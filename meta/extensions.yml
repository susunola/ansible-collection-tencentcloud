---
# meta/extensions.yml declares plugin types that ansible-core does not know
# natively so that collection tooling can still find and package them.
#
# This collection currently ships only ansible-core plugin types (action,
# callback, connection, filter, inventory, lookup, module, module_utils,
# doc_fragments), which are resolved automatically and must NOT be listed
# here, so the extensions list is empty. The plugins/event_source
# event-driven-Ansible plugins previously declared here were removed in the
# 2.0 core-scope reduction.
extensions: []
