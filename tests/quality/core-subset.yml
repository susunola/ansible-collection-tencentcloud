# The subset this collection asks to be judged on.
#
# These products are the ones a typical production Tencent Cloud user
# actually needs, and they are the ones we commit to holding at the full
# bar -- complete documentation, a runnable integration target, and a
# dedicated unit test.
#
# After the 2.0.0 surface reduction (docs/REMEDIATION.md) this list covers
# every product prefix still shipping in the collection; the allowlist in
# docs/core-allowlist.yml is the binding module-level registry.
version: 1

products:
  # compute
  - cvm
  - lighthouse
  - as
  - key_pair
  # network
  - vpc
  - subnet
  - security_group
  - eip
  - clb
  - route_table
  - nat_gateway
  # storage
  - cos
  - cbs
  # containers
  - tke
  - tcr
  # databases
  - cdb
  - redis
  # identity and secrets
  - cam
  - kms
  - ssm
