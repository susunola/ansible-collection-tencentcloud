version: 1
targets:
  cam_user: {cost: free, modules: [cam_user]}
  cam_group_membership: {cost: free, modules: [cam_group_membership]}
  key_pair: {cost: free, modules: [key_pair]}
  security_group: {cost: free, modules: [security_group, security_group_rule]}
  # vpc/subnet have dedicated flagship targets below (P0-01/02); keep the
  # module->target mapping unique so the registry validator passes.
  network: {cost: low, modules: [route_table, network_acl, eip]}
  cos_bucket: {cost: low, modules: [cos_bucket]}
  cfs_file_system: {cost: medium, modules: [cfs_file_system]}
  clb_http: {cost: medium, modules: [clb_load_balancer, clb_listener, clb_rule]}
  kms_key: {cost: low, modules: [kms_key, kms_key_rotation]}
  monitor_alarm_policy: {cost: free, modules: [monitor_alarm_policy, monitor_alarm_policy_notice]}
  private_dns: {cost: low, modules: [private_dns_zone, private_dns_record]}
  tke_addon: {cost: medium, modules: [tke_addon]}
  cmq_queue: {cost: low, modules: [cmq_queue]}
  # High-impact / billed targets: gated and kept out of the weekly default
  # list; they run when an operator switches their inputs on (§2.2, §6).
  tcr_immutable_tag_rule: {cost: high, modules: [tcr_immutable_tag_rule]}
  tcr_webhook_trigger: {cost: high, modules: [tcr_webhook_trigger]}
  cls_alarm: {cost: medium, modules: [cls_alarm]}
  redis_replication_group: {cost: high, modules: [redis_replication_group]}
  dbbrain_sql_filter: {cost: high, modules: [dbbrain_sql_filter]}
  tcr_replication_instance: {cost: high, modules: [tcr_replication_instance]}
  cls_log_pipeline: {cost: low, modules: [cls_logset, cls_topic]}
  api_gateway_service: {cost: low, modules: [api_gateway_service]}
  # Pure-configuration write modules: no billable resource, safe every pass.
  cls_alarm_notice: {cost: free, modules: [cls_alarm_notice]}
  cdb_audit_rule_template: {cost: free, modules: [cdb_audit_rule_template]}
  apigateway_plugin: {cost: free, modules: [apigateway_plugin]}
  apigateway_ip_strategy: {cost: free, modules: [apigateway_ip_strategy]}
  tat_command: {cost: free, modules: [tat_command]}
  # P0-01 / P0-02 flagship dedicated targets.
  cvm_instance: {cost: medium, modules: [cvm_instance]}
  vpc: {cost: free, modules: [vpc]}
  subnet: {cost: free, modules: [subnet]}
  cdb_instance: {cost: high, modules: [cdb_instance]}
  tke_cluster: {cost: high, modules: [tke_cluster]}
