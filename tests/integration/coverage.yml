version: 1
targets:
  # CAM sub-user and group writes are refused with AuthFailure.UnauthorizedOperation
  # on this account (2.4), so these self-skip whatever their gate says.
  # account_blocked: the product is unavailable on this account, so the target
  # can only ever self-skip (docs/integration-env.md 2.4). Declared here rather
  # than in the checker so scripts/check_integration_ran.py can tell "gate not
  # configured" (a failure) from "account cannot host it" (tolerated).
  cam_user: {cost: free, modules: [cam_user], account_blocked: true}
  cam_group_membership: {cost: free, modules: [cam_group_membership], account_blocked: true}
  key_pair: {cost: free, modules: [key_pair]}
  security_group: {cost: free, modules: [security_group]}
  # vpc/subnet have dedicated flagship targets below (P0-01/02); keep the
  # module->target mapping unique so the registry validator passes.
  network: {cost: low, modules: [route_table, security_group_rule, eip]}
  cos_bucket: {cost: low, modules: [cos_bucket]}
  clb_http: {cost: medium, modules: [clb_load_balancer, clb_listener]}
  kms_key: {cost: low, modules: [kms_key]}
  tke_addon: {cost: medium, modules: [tke_addon]}
  # P0-01 / P0-02 flagship dedicated targets.
  cvm_instance: {cost: medium, modules: [cvm_instance]}
  vpc: {cost: free, modules: [vpc]}
  subnet: {cost: free, modules: [subnet]}
  cdb_instance: {cost: high, modules: [cdb_instance]}
  tke_cluster: {cost: high, modules: [tke_cluster]}
  # Manual-only targets (G1-d). Both ship a complete meta/tasks/vars layout
  # and self-skip when their operator gate is unset, but neither was ever
  # entered in this registry, so no target selector could reach them and they
  # silently never ran. Registered now so scripts/integration_impact.py --check
  # accounts for them; both stay out of the weekly default list because they
  # create billable resources (a CVM image snapshot, a Lighthouse instance).
  cvm_image: {cost: high, modules: [cvm_image]}
  lighthouse: {cost: high, modules: [lighthouse_instance]}
