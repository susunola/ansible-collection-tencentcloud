---
# PLATFORM CAVEAT (verified 2026-09 against a live intl account): API Gateway
# refuses new resources on accounts that never activated the product -
# CreateService returns
#   FailedOperation.LimitingResourceCreated:
#     The API gateway product has been stopped for sale, and no new resources
#     can be created.
# in every region. The suite therefore treats that code (and the bare
# InternalError that CreatePlugin surfaces for the same condition) as "this
# account cannot host API Gateway" and skips the lifecycle instead of failing,
# so the target still exercises the module on accounts that do have the
# product. Any other error is a genuine regression and fails the run.
- name: API Gateway service real-cloud lifecycle
  vars:
    run_id: "{{ lookup('env', 'GITHUB_RUN_ID') | default(99999999 | random, true) }}"
    service_name: "ansible-apigw-it-{{ run_id }}"
  module_defaults:
    group/susunola.tencentcloud.all:
      region: "{{ tencentcloud_region }}"
  block:
    # NOTE: a `vars:` block is templated lazily, so a `| random` name is
    # re-rolled on EVERY reference - the resource is created under one
    # name and asserted/deleted under another, which fails the run and
    # leaks the resource. Freeze the names once with set_fact (facts
    # outrank play vars).
    - name: Freeze the per-run resource names
      ansible.builtin.set_fact:
        run_id: "{{ run_id }}"

    - name: Predict service creation
      susunola.tencentcloud.api_gateway_service:
        name: "{{ service_name }}"
        description: integration
      check_mode: true
      register: predicted
    - name: Create service
      susunola.tencentcloud.api_gateway_service:
        name: "{{ service_name }}"
        description: integration
      register: created
      ignore_errors: true

    # The module wraps every SDK failure in a generic `msg`, so the platform
    # refusal has to be recognised from the structured `error_code` / `error`
    # fields that fail_sdk_error() adds alongside it.
    - name: Decide whether API Gateway accepts new resources on this account
      ansible.builtin.set_fact:
        apigateway_refused: >-
          {{ created is failed
             and (created.error_code | default('') == 'InternalError'
                  or 'LimitingResourceCreated' in created.error_code | default('')
                  or 'stopped for sale' in created.error | default('')) }}

    - name: Report the platform refusal and skip the lifecycle
      ansible.builtin.debug:
        msg: >-
          API Gateway refused to create a service on this account
          ({{ created.error_code | default('unknown') }}:
          {{ created.error | default(created.msg | default('unknown error')) }});
          skipping the lifecycle. No assertion was run and nothing was leaked.
      when: apigateway_refused | bool

    - name: Fail on any create error that is not a platform refusal
      ansible.builtin.fail:
        msg: >-
          Creating the API Gateway service failed unexpectedly:
          {{ created.error_code | default('unknown') }}:
          {{ created.error | default(created.msg | default('no detail')) }}
      when: created is failed and not (apigateway_refused | bool)

    - name: Service lifecycle
      when: not (apigateway_refused | bool)
      block:
        - name: Reconcile service
          susunola.tencentcloud.api_gateway_service:
            service_id: "{{ created.service.ServiceId }}"
            name: "{{ service_name }}"
            description: integration
          register: same
        - name: Update service
          susunola.tencentcloud.api_gateway_service:
            service_id: "{{ created.service.ServiceId }}"
            name: "{{ service_name }}"
            description: integration-updated
          register: updated
        - name: Verify API Gateway contract
          ansible.builtin.assert:
            that:
              - predicted is changed
              - created is changed
              - same is not changed
              - updated is changed
        - name: Delete service
          susunola.tencentcloud.api_gateway_service:
            state: absent
            service_id: "{{ created.service.ServiceId }}"
          register: deleted
        - name: Delete service again
          susunola.tencentcloud.api_gateway_service:
            state: absent
            service_id: "{{ created.service.ServiceId }}"
          register: deleted_again
        - name: Verify API Gateway deletion
          ansible.builtin.assert:
            that:
              - deleted is changed
              - deleted_again is not changed
  always:
    - name: Clean up service
      susunola.tencentcloud.api_gateway_service:
        state: absent
        service_id: "{{ created.service.ServiceId | default(omit) }}"
        name: "{{ service_name }}"
      ignore_errors: true
