---
# PLATFORM CAVEAT (verified 2026-09 against a live intl account): API Gateway
# refuses new resources on accounts that never activated the product -
# CreateService returns
#   FailedOperation.LimitingResourceCreated:
#     The API gateway product has been stopped for sale, and no new resources
#     can be created.
# in every region. An IP strategy hangs off a service, so this target has to
# create one first; when that creation is refused the whole lifecycle is
# skipped instead of failing (see api_gateway_service for the same reasoning).
# Set TENCENTCLOUD_APIGW_SERVICE_ID to reuse a service that already exists and
# skip the creation step entirely.
- name: API Gateway IP strategy real-cloud lifecycle
  vars:
    run_id: "{{ e2e_inputs.GITHUB_RUN_ID | default(lookup('env', 'GITHUB_RUN_ID'), true) | default(99999999 | random, true) }}"
    strategy_name: "ansible-ipstrategy-it-{{ run_id }}"
    supporting_service_name: "ansible-apigwips-it-{{ run_id }}"
  module_defaults:
    group/susunola.tencentcloud.all:
      region: "{{ tencentcloud_region }}"
  block:
    # NOTE: a `vars:` block is templated lazily, so a `| random` name is
    # re-rolled on EVERY reference - the resource is created under one
    # name and asserted/deleted under another, which fails the run and
    # leaks the resource. Freeze the names once with set_fact (facts
    # outrank play vars).
    - name: Freeze the per-run resource names
      ansible.builtin.set_fact:
        run_id: "{{ run_id }}"
        strategy_name: "{{ strategy_name }}"
        supporting_service_name: "{{ supporting_service_name }}"

    - name: Read the optional pre-existing service id
      ansible.builtin.set_fact:
        provided_service_id: >-
          {{ e2e_inputs.TENCENTCLOUD_APIGW_SERVICE_ID
             | default(lookup('env', 'TENCENTCLOUD_APIGW_SERVICE_ID'), true)
             | default('', true) }}

    - name: Create the supporting API Gateway service
      susunola.tencentcloud.api_gateway_service:
        name: "{{ supporting_service_name }}"
        description: integration
      register: supporting_service
      ignore_errors: true
      when: provided_service_id | length == 0

    # The module wraps every SDK failure in a generic `msg`, so the platform
    # refusal has to be recognised from the structured `error_code` / `error`
    # fields that fail_sdk_error() adds alongside it.
    - name: Decide whether API Gateway accepts new resources on this account
      ansible.builtin.set_fact:
        apigateway_refused: >-
          {{ supporting_service is failed
             and (supporting_service.error_code | default('') == 'InternalError'
                  or 'LimitingResourceCreated' in supporting_service.error_code | default('')
                  or 'stopped for sale' in supporting_service.error | default('')) }}

    - name: Resolve the service the strategy hangs off
      ansible.builtin.set_fact:
        service_id: >-
          {{ provided_service_id if provided_service_id | length > 0
             else supporting_service.service.ServiceId | default('') }}

    - name: Report the platform refusal and skip the lifecycle
      ansible.builtin.debug:
        msg: >-
          API Gateway refused to create a service on this account
          ({{ supporting_service.error_code | default('unknown') }}:
          {{ supporting_service.error | default(supporting_service.msg | default('unknown error')) }});
          skipping the IP strategy lifecycle. No assertion was run and nothing
          was leaked.
      when: apigateway_refused | bool

    - name: Fail on any service error that is not a platform refusal
      ansible.builtin.fail:
        msg: >-
          Creating the supporting API Gateway service failed unexpectedly:
          {{ supporting_service.error_code | default('unknown') }}:
          {{ supporting_service.error | default(supporting_service.msg | default('no detail')) }}
      when: supporting_service is failed and not (apigateway_refused | bool)

    - name: IP strategy lifecycle
      when: not (apigateway_refused | bool) and service_id | length > 0
      block:
        - name: Predict strategy creation
          susunola.tencentcloud.apigateway_ip_strategy:
            service_id: "{{ service_id }}"
            strategy_name: "{{ strategy_name }}"
            strategy_type: WHITE
            strategy_data: "10.0.0.0/8"
          check_mode: true
          register: predicted
        - name: Create strategy
          susunola.tencentcloud.apigateway_ip_strategy:
            service_id: "{{ service_id }}"
            strategy_name: "{{ strategy_name }}"
            strategy_type: WHITE
            strategy_data: "10.0.0.0/8"
          register: created
        - name: Reconcile strategy
          susunola.tencentcloud.apigateway_ip_strategy:
            service_id: "{{ service_id }}"
            strategy_name: "{{ strategy_name }}"
            strategy_type: WHITE
            strategy_data: "10.0.0.0/8"
          register: same
        - name: Verify the IP strategy contract
          ansible.builtin.assert:
            that:
              - predicted is changed
              - created is changed
              - created.strategy_id is search('^IPStrategy-')
              - created.exists
              - same is not changed
        - name: Check mode reports the delete without deleting
          susunola.tencentcloud.apigateway_ip_strategy:
            service_id: "{{ service_id }}"
            strategy_name: "{{ strategy_name }}"
            state: absent
          check_mode: true
          register: check_delete
        - name: Delete strategy
          susunola.tencentcloud.apigateway_ip_strategy:
            service_id: "{{ service_id }}"
            strategy_name: "{{ strategy_name }}"
            state: absent
          register: deleted
        - name: Delete strategy again
          susunola.tencentcloud.apigateway_ip_strategy:
            service_id: "{{ service_id }}"
            strategy_name: "{{ strategy_name }}"
            state: absent
          register: deleted_again
        - name: Verify the IP strategy deletion
          ansible.builtin.assert:
            that:
              - check_delete is changed
              - deleted is changed
              - deleted_again is not changed
  always:
    - name: Clean up strategy
      susunola.tencentcloud.apigateway_ip_strategy:
        service_id: "{{ service_id | default('') }}"
        strategy_name: "{{ strategy_name }}"
        state: absent
      ignore_errors: true
      when: service_id | default('') | length > 0

    - name: Clean up the supporting service this run created
      susunola.tencentcloud.api_gateway_service:
        state: absent
        service_id: "{{ service_id }}"
      ignore_errors: true
      when: provided_service_id | length == 0 and service_id | default('') | length > 0
