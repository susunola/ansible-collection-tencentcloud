---
# End-to-end coverage for key_pair: create (generated key) + idempotency +
# check mode + delete. Key pairs are free of charge.
#
# Naming: the CVM API rejects '-' in a key pair name (InvalidParameterValue:
# 包含不合法的字符`-`), so the name uses the underscore spelling
# ansible_key_it_<run_id>. The cleanup sweeper accepts both separators.
#
# Result shape: the module returns the key pair under `key_pair` (see its
# RETURN block), not `key`; assertions below match that.
- name: Key pair end-to-end
  vars:
    region: "{{ tencentcloud_region }}"
    run_id: "{{ 99999999 | random }}"
    key_name: "ansible_key_it_{{ run_id }}"
  module_defaults:
    group/susunola.tencentcloud.all:
      region: "{{ region }}"
  block:
    # NOTE: a `vars:` block is templated lazily, so a `| random` name is
    # re-rolled on EVERY reference - the resource is created under one
    # name and asserted/deleted under another, which fails the run and
    # leaks the resource. Freeze the names once with set_fact (facts
    # outrank play vars).
    - name: Freeze the per-run resource names
      ansible.builtin.set_fact:
        run_id: "{{ run_id }}"

    - name: Create a key pair
      susunola.tencentcloud.key_pair:
        state: present
        name: "{{ key_name }}"
      register: key_create

    - name: Creation reports changed with a key id and the private key
      ansible.builtin.assert:
        that:
          - key_create is changed
          - key_create.key_pair.KeyId is defined
          - key_create.key_pair.KeyName == key_name
          - key_create.private_key is defined
          - key_create.private_key is search("BEGIN RSA PRIVATE KEY")

    - name: Create the same key pair again (idempotency)
      susunola.tencentcloud.key_pair:
        state: present
        name: "{{ key_name }}"
      register: key_second

    - name: Second run reports no change
      ansible.builtin.assert:
        that:
          - key_second is not changed
          - key_second.key_pair.KeyId == key_create.key_pair.KeyId

    - name: Check mode reports the delete without deleting
      susunola.tencentcloud.key_pair:
        state: absent
        name: "{{ key_name }}"
      check_mode: true
      register: key_check_delete

    - name: Check mode reports changed
      ansible.builtin.assert:
        that:
          - key_check_delete is changed

    - name: Delete the key pair
      susunola.tencentcloud.key_pair:
        state: absent
        name: "{{ key_name }}"
      register: key_delete

    - name: Deletion reports changed
      ansible.builtin.assert:
        that:
          - key_delete is changed

  always:
    - name: Delete the key pair if the run failed mid-way
      susunola.tencentcloud.key_pair:
        state: absent
        name: "{{ key_name }}"
      ignore_errors: true
