---
# PLATFORM CAVEAT (verified 2026-09 against a live intl account): some
# accounts/regions have no alarm "view map" loaded - CreateAlarmPolicy answers
#   InvalidParameter: "INVALID_ARGUMENT": view not found: QCE/CVM
# for EVERY namespace, including the ones DescribeProductList returns. That is
# an account capability gap, not a module defect, so the target reports and
# skips instead of failing the whole suite. Any other error still fails.
- name: Monitor alarm policy end-to-end
  vars:
    run_id: "{{ e2e_inputs.GITHUB_RUN_ID | default(lookup('env', 'GITHUB_RUN_ID'), true) | default(99999999 | random, true) }}"
    policy_name: "ansible-monitor-it-{{ run_id }}"
    namespace: "{{ e2e_inputs.TENCENTCLOUD_MONITOR_NAMESPACE | default(lookup('env', 'TENCENTCLOUD_MONITOR_NAMESPACE'), true) | default('QCE/CVM', true) }}"
    notice_id: "{{ e2e_inputs.TENCENTCLOUD_MONITOR_NOTICE_ID | default(lookup('env', 'TENCENTCLOUD_MONITOR_NOTICE_ID'), true) | default('', true) }}"
  module_defaults:
    group/susunola.tencentcloud.all:
      region: "{{ tencentcloud_region }}"
  block:
    # NOTE: a `vars:` block is templated lazily, so a `| random` name is
    # re-rolled on EVERY reference - the resource is created under one
    # name and asserted/deleted under another, which fails the run and
    # leaks the resource. Freeze the names once with set_fact (facts
    # outrank play vars).
    - name: Freeze the per-run resource names
      ansible.builtin.set_fact:
        run_id: "{{ run_id }}"
        policy_name: "{{ policy_name }}"

    - name: Create policy
      susunola.tencentcloud.monitor_alarm_policy:
        name: "{{ policy_name }}"
        namespace: "{{ namespace }}"
        remark: CI integration test
        enabled: false
        condition:
          IsUnionRule: 0
          Rules: []
      register: created
      ignore_errors: true

    - name: Decide whether this account can create alarm policies
      ansible.builtin.set_fact:
        monitor_refused: >-
          {{ created is failed
             and created.error_code | default('') == 'InvalidParameter'
             and 'view not found' in created.error | default('') }}

    - name: Report the skipped alarm policy coverage
      ansible.builtin.debug:
        msg: >-
          Skipping the monitor_alarm_policy lifecycle: this account has no
          alarm view map for namespace {{ namespace }}
          ({{ created.error_code | default('unknown') }}). Override
          TENCENTCLOUD_MONITOR_NAMESPACE to try another namespace.
      when: monitor_refused | bool

    - name: Fail on any create error that is not a missing view map
      ansible.builtin.fail:
        msg: >-
          Creating the monitor alarm policy failed unexpectedly:
          {{ created.error_code | default('unknown') }}:
          {{ created.error | default(created.msg | default('no detail')) }}
      when: created is failed and not (monitor_refused | bool)

    - name: Alarm policy lifecycle
      when: not (monitor_refused | bool)
      block:
        - name: Reconcile policy again
          susunola.tencentcloud.monitor_alarm_policy:
            policy_id: "{{ created.policy.PolicyId }}"
            name: "{{ policy_name }}"
            namespace: "{{ namespace }}"
            remark: CI integration test
            enabled: false
            condition:
              IsUnionRule: 0
              Rules: []
          register: second

        - name: Verify idempotency
          ansible.builtin.assert:
            that:
              - created is changed
              - second is not changed

        - name: Update policy remark
          susunola.tencentcloud.monitor_alarm_policy:
            policy_id: "{{ created.policy.PolicyId }}"
            name: "{{ policy_name }}"
            namespace: "{{ namespace }}"
            remark: CI integration test updated
            enabled: false
            condition:
              IsUnionRule: 0
              Rules: []
          register: updated

        - name: Verify update
          ansible.builtin.assert:
            that:
              - updated is changed
              - updated.policy.Remark == 'CI integration test updated'

        - name: Bind notification independently
          susunola.tencentcloud.monitor_alarm_policy_notice:
            policy_id: "{{ created.policy.PolicyId }}"
            notice_ids: ["{{ notice_id }}"]
          register: notice_update
          when: notice_id | length > 0

        - name: Reconcile notification independently
          susunola.tencentcloud.monitor_alarm_policy_notice:
            policy_id: "{{ created.policy.PolicyId }}"
            notice_ids: ["{{ notice_id }}"]
          register: notice_second
          when: notice_id | length > 0

        - name: Verify notification idempotency
          ansible.builtin.assert:
            that:
              - notice_update is changed
              - notice_second is not changed
          when: notice_id | length > 0
  always:
    - name: Delete integration policy
      susunola.tencentcloud.monitor_alarm_policy:
        state: absent
        policy_id: "{{ created.policy.PolicyId }}"
      when: created.policy is defined and created.policy.PolicyId is defined
      ignore_errors: true
