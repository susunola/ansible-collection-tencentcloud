---
# High-impact target: it writes to a real TCR registry namespace. Gated on
# TENCENTCLOUD_TCR_REGISTRY_ID + TENCENTCLOUD_TCR_NAMESPACE and deliberately
# kept out of the weekly default list (docs/integration-env.md 6).
- name: Read TCR immutable tag rule integration inputs
  ansible.builtin.set_fact:
    tcr_registry_id: "{{ e2e_inputs.TENCENTCLOUD_TCR_REGISTRY_ID | default(lookup('env', 'TENCENTCLOUD_TCR_REGISTRY_ID'), true) | default('', true) }}"
    tcr_namespace: "{{ e2e_inputs.TENCENTCLOUD_TCR_NAMESPACE | default(lookup('env', 'TENCENTCLOUD_TCR_NAMESPACE'), true) | default('', true) }}"
    run_id: "{{ e2e_inputs.GITHUB_RUN_ID | default(lookup('env', 'GITHUB_RUN_ID'), true) | default(99999999 | random, true) }}"

- name: Explain skipped TCR immutable tag rule integration
  ansible.builtin.debug:
    msg: Set TENCENTCLOUD_TCR_REGISTRY_ID and TENCENTCLOUD_TCR_NAMESPACE to run this high-impact target.
  when: tcr_registry_id | length == 0 or tcr_namespace | length == 0

- name: TCR immutable tag rule end-to-end
  vars:
    # Absolute, because ansible-test runs this target from a temporary copy
    # (see the longer note in private_dns). Supplied by
    # scripts/integration_inputs.py.
    manifest_script: "{{ e2e_inputs.E2E_SCRIPTS_DIR | default('', true) }}/e2e_manifest.py"
    manifest_path: "{{ e2e_inputs.E2E_MANIFEST_PATH | default('', true) }}"
  module_defaults:
    group/susunola.tencentcloud.all:
      region: "{{ tencentcloud_region }}"
  when: tcr_registry_id | length > 0 and tcr_namespace | length > 0
  block:
    - name: Predict immutable tag rule creation
      susunola.tencentcloud.tcr_immutable_tag_rule:
        registry_id: "{{ tcr_registry_id }}"
        namespace_name: "{{ tcr_namespace }}"
        rule:
          RepositoryPattern: "ansible-e2e-*"
          TagPattern: "latest"
          RepositoryDecoration: repoMatches
          TagDecoration: matches
          Disabled: false
      check_mode: true
      register: predicted

    - name: Create immutable tag rule
      susunola.tencentcloud.tcr_immutable_tag_rule:
        registry_id: "{{ tcr_registry_id }}"
        namespace_name: "{{ tcr_namespace }}"
        rule:
          RepositoryPattern: "ansible-e2e-*"
          TagPattern: "latest"
          RepositoryDecoration: repoMatches
          TagDecoration: matches
          Disabled: false
      register: created

    # Bookkeeping only: never fail a test because the manifest could not be
    # written, but do register what was created so an orphan is caught even if
    # the `always:` block never gets to run.
    - name: Note that resource tracking is unavailable
      ansible.builtin.debug:
        msg: >-
          No E2E_MANIFEST_PATH in the integration inputs, so the rule created
          here cannot be registered and the resource reaper will audit
          nothing. Run `python scripts/integration_inputs.py --write` first.
      when: manifest_path | length == 0

    - name: Register the rule with the TTL manifest
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ manifest_script }}"
          - --path
          - "{{ manifest_path }}"
          - add
          - --run-id
          - "{{ run_id }}"
          - --target
          - tcr_immutable_tag_rule
          - --resource-type
          - tcr:immutable_tag_rule
          # The rule has no id of its own; registry + namespace + pattern is
          # what identifies it.
          - --resource-id
          - "{{ tcr_registry_id }}/{{ tcr_namespace }}"
          - --region
          - "{{ tencentcloud_region }}"
          - --name
          - ansible-e2e-*/latest
          - --cost-class
          - free
      when: manifest_path | length > 0
      changed_when: false
      ignore_errors: true

    - name: Reconcile immutable tag rule
      susunola.tencentcloud.tcr_immutable_tag_rule:
        registry_id: "{{ tcr_registry_id }}"
        namespace_name: "{{ tcr_namespace }}"
        rule:
          RepositoryPattern: "ansible-e2e-*"
          TagPattern: "latest"
          RepositoryDecoration: repoMatches
          TagDecoration: matches
          Disabled: false
      register: reconciled

    - name: Verify immutable tag rule idempotency
      ansible.builtin.assert:
        that:
          - predicted is changed
          - created is changed
          - created.exists
          - reconciled is not changed

    - name: Delete immutable tag rule
      susunola.tencentcloud.tcr_immutable_tag_rule:
        state: absent
        registry_id: "{{ tcr_registry_id }}"
        namespace_name: "{{ tcr_namespace }}"
        rule:
          RepositoryPattern: "ansible-e2e-*"
          TagPattern: "latest"
      register: deleted

    - name: Delete immutable tag rule again
      susunola.tencentcloud.tcr_immutable_tag_rule:
        state: absent
        registry_id: "{{ tcr_registry_id }}"
        namespace_name: "{{ tcr_namespace }}"
        rule:
          RepositoryPattern: "ansible-e2e-*"
          TagPattern: "latest"
      register: deleted_again

    - name: Verify immutable tag rule deletion
      ansible.builtin.assert:
        that:
          - deleted is changed
          - deleted_again is not changed
  always:
    - name: Remove immutable tag rule if the run failed mid-way
      susunola.tencentcloud.tcr_immutable_tag_rule:
        state: absent
        registry_id: "{{ tcr_registry_id }}"
        namespace_name: "{{ tcr_namespace }}"
        rule:
          RepositoryPattern: "ansible-e2e-*"
          TagPattern: "latest"
      ignore_errors: true
      when: tcr_registry_id | length > 0 and tcr_namespace | length > 0
