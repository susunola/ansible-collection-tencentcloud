name: Feature Request
description: Suggest a new module, plugin, or enhancement for the susunola.tencentcloud collection
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the feature
        and the problem it solves.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: Please confirm you agree to follow the Ansible Community Code of Conduct.
      options:
        - label: I agree to follow the Ansible Community Code of Conduct.
          required: true
  - type: input
    id: collection_version
    attributes:
      label: Collection version
      description: Output of `ansible-galaxy collection list susunola.tencentcloud`.
      placeholder: "0.4.0"
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short description of the feature you would like to see.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: |
        What problem does this solve for you? Which Tencent Cloud service
        and API does it map to (if known)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed module or playbook example
      description: |
        If you have a concrete proposal, show what the module parameters or
        an example playbook task could look like.
      render: yaml
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have tried.
    validations:
      required: false
