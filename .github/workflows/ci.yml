name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run integration tests against a real Tencent Cloud account
        type: boolean
        default: false

jobs:
  sanity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires_ansible is >= 2.19 (meta/runtime.yml): 2.16/2.17/2.18
        # reached end-of-life (2025-07 / 2025-11 / 2026-05) and are no
        # longer tested. Python rows cover the oldest controller Python
        # each ansible-core release supports.
        include:
          - ansible-core: "2.19.*"
            python: "3.11"
          - ansible-core: "2.20.*"
            python: "3.12"
          - ansible-core: "2.21.*"
            python: "3.13"
    defaults:
      run:
        working-directory: ansible_collections/susunola/tencentcloud
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/susunola/tencentcloud
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core==${{ matrix.ansible-core }}" pytest pytest-xdist yamllint ruff
      # The committed _info specs are generated against a specific SDK
      # release. requirements.txt allows the SDK as a compatibility range
      # for users, so this sentinel first installs the range, then re-pins
      # the SDK to the GENERATED_SDK_VERSION stamp, and fails when the
      # stamp and the pinned install drift. Stale specs are regenerated
      # deliberately (and reviewed) instead of shipping silently.
      - name: SDK drift sentinel
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "tencentcloud-sdk-python==$(python scripts/check_sdk_drift.py --print-stamp)"
          python scripts/check_sdk_drift.py --check
      - name: Generated modules are up to date
        run: python scripts/generate_info_modules.py --check
      # RESOURCE_SPECS entries are verified against the installed SDK and
      # missing scaffolds are flagged (write-once: existing module files are
      # never overwritten). Add a write module by extending RESOURCE_SPECS
      # and scaffolding it with --resource <module>.
      - name: Resource scaffolds match the SDK
        run: python scripts/generate_info_modules.py --resources --check
      - name: Module registries are up to date
        run: python scripts/sync_registry.py --check
      - name: Module tiers are consistent
        run: python scripts/check_module_tiers.py --check
      # Every write module needs a readable query surface: a matching _info
      # module, a curated KNOWN_COVERAGE mapping, or a documented gap.
      - name: Write modules have a read surface
        run: python scripts/audit_info_coverage.py --check
      - name: CAM action manifest is up to date
        run: python scripts/generate_cam_actions.py --check
      - name: Integration coverage registry is valid
        run: python scripts/integration_impact.py --check --files plugins/module_utils/base.py
      # Generated _info modules must expose every required request field:
      # a spec hiding one makes every call fail with a confusing API error.
      # Runs after the SDK drift sentinel so the models are importable.
      - name: No hidden required params
        run: python scripts/check_hidden_required_params.py --check
      - name: Ruff lint
        run: ruff check .
      - name: Sanity tests
        run: ansible-test sanity --color --python ${{ matrix.python }}
      - name: Unit tests
        run: ansible-test units --color --python ${{ matrix.python }}
      # Contract tests run each module's request construction against the
      # real Tencent Cloud SDK classes. They are deliberately NOT part of
      # ansible-test units (those environments lack the SDK), so they run
      # here as a plain pytest step with the SDK installed; they skip
      # cleanly when the SDK is not importable.
      #
      # Coverage: module_utils + modules are measured and the run fails
      # below the threshold (--cov-fail-under=55), so a PR that silently
      # regresses overall coverage is blocked instead of merged. The
      # module_utils AND module unit tests are collected here as well
      # (they are pure Python and pass with or without the SDK), because
      # the gate only counts what this step measures: without them the
      # module bodies would only be imported, never exercised. COS modules
      # are excluded from the scope by design via .coveragerc (COS is not
      # an API 3.0 service).
      #
      # Threshold note: the gate was introduced at 70 (2026-08-31,
      # 01fd38e) after the batch module-generation run pushed the write
      # module count to 313, of which only 63 have unit tests. Coverage
      # sits around 58-59% (module_utils 92%, _info modules 86%, write
      # modules 51%); the 70% floor has never passed since introduction.
      # 55 was set just under that measured baseline so the gate went green
      # while still catching regressions. The #57 write-module unit-test
      # drive has since raised the measured total to 74% (2026-09-04),
      # so the gate moves to 72 (measured minus two points of headroom);
      # closing the remaining gap is tracked in docs/roadmap.md (write-
      # module unit-test coverage drive).
      - name: SDK contract tests
        run: |
          python -m pip install -r requirements.txt pytest-cov
          python -m pip install "tencentcloud-sdk-python==$(python scripts/check_sdk_drift.py --print-stamp)"
          PYTHONPATH="${{ github.workspace }}" python -m pytest tests/contract tests/unit/plugins/module_utils tests/unit/plugins/modules -q \
            --cov=plugins/module_utils --cov=plugins/modules \
            --cov-report=term-missing --cov-report=xml:${GITHUB_WORKSPACE}/coverage.xml \
            --cov-report=html:${GITHUB_WORKSPACE}/coverage-html --cov-fail-under=72
      # Coverage is reported as an artifact so the numbers behind the
      # 72% gate are inspectable (XML for tooling, HTML for humans),
      # even when the run fails the threshold. upload-artifact resolves
      # paths against GITHUB_WORKSPACE (not the job working-directory),
      # so the reports are written there by the step above.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-html/
          if-no-files-found: warn
      - name: Build collection
        run: ansible-galaxy collection build

  # Integration tests run in .github/workflows/integration.yml with their
  # own guardrails: a fixed concurrency group (serialises all runs against
  # the shared cloud account), a 40-minute budget cap, and an always-on
  # sweeper that removes leftover test resources after success or failure.
  #
