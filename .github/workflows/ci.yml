name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ansible-test sanity --color --python 3.12
      - run: ansible-test units --color --python 3.12
      - run: ansible-galaxy collection build
