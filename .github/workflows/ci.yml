name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run integration tests against a real Tencent Cloud account
        type: boolean
        default: false

jobs:
  sanity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires_ansible is >= 2.19 (meta/runtime.yml): 2.16/2.17/2.18
        # reached end-of-life (2025-07 / 2025-11 / 2026-05) and are no
        # longer tested. Python rows cover the oldest controller Python
        # each ansible-core release supports.
        include:
          - ansible-core: "2.19.*"
            python: "3.11"
          - ansible-core: "2.20.*"
            python: "3.12"
          - ansible-core: "2.21.*"
            python: "3.13"
    defaults:
      run:
        working-directory: ansible_collections/susunola/tencentcloud
    steps:
      - uses: actions/checkout@v7
        with:
          path: ansible_collections/susunola/tencentcloud
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core==${{ matrix.ansible-core }}" pytest pytest-xdist yamllint ruff
      # The committed _info specs are generated against a specific SDK
      # release. requirements.txt allows the SDK as a compatibility range
      # for users, so this sentinel first installs the range, then re-pins
      # the SDK to the GENERATED_SDK_VERSION stamp, and fails when the
      # stamp and the pinned install drift. Stale specs are regenerated
      # deliberately (and reviewed) instead of shipping silently.
      - name: SDK drift sentinel
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "tencentcloud-sdk-python==$(python scripts/check_sdk_drift.py --print-stamp)"
          python scripts/check_sdk_drift.py --check
      - name: Generated modules are up to date
        run: python scripts/generate_info_modules.py --check
      # RESOURCE_SPECS entries are verified against the installed SDK and
      # missing scaffolds are flagged (write-once: existing module files are
      # never overwritten). Add a write module by extending RESOURCE_SPECS
      # and scaffolding it with --resource <module>.
      - name: Resource scaffolds match the SDK
        run: python scripts/generate_info_modules.py --resources --check
      - name: Module registries are up to date
        run: python scripts/sync_registry.py --check
      # Common options (credentials/region/connection/retry/user_agent/waiter)
      # are documented by doc_fragments, not copied inline; a module that
      # re-introduces a strippable inline copy or drops a base fragment
      # fails here.
      - name: Doc fragments are canonical
        run: python scripts/sync_doc_fragments.py --check
      - name: Module tiers are consistent
        run: python scripts/check_module_tiers.py --check
      # Every write module needs a readable query surface: a matching _info
      # module, a curated KNOWN_COVERAGE mapping, or a documented gap.
      - name: Write modules have a read surface
        run: python scripts/audit_info_coverage.py --check
      - name: CAM action manifest is up to date
        run: python scripts/generate_cam_actions.py --check
      - name: Product capability matrix is up to date
        run: python scripts/generate_product_capabilities.py --check
      - name: Integration coverage registry is valid
        run: python scripts/integration_impact.py --check --files plugins/module_utils/base.py
      # The default dispatch list is typed twice in integration.yml and is the
      # only thing here that runs against a real cloud account. free/low must
      # be dispatched, high never, medium only when vetted with a reason --
      # and the two copies must agree with each other.
      - name: Integration default dispatch list
        run: python scripts/check_integration_defaults.py --check
      # Generated _info modules must expose every required request field:
      # a spec hiding one makes every call fail with a confusing API error.
      # Runs after the SDK drift sentinel so the models are importable.
      - name: No hidden required params
        run: python scripts/check_hidden_required_params.py --check
      - name: Extensions metadata matches plugins
        run: python scripts/check_extensions_metadata.py --check
      - name: Curated info targets shipped
        run: python scripts/check_info_targets.py --check
      - name: Roadmap badges match the acceptance criteria
        run: python scripts/check_roadmap_status.py --check
      # event_source is the one plugin type neither ansible-core nor
      # antsibull-docs knows, so its docsite page is generated by hand and
      # nothing upstream would notice it go stale. This checks the page
      # itself *and* the chain that makes it reachable: build.sh must copy
      # extra_rst/ in and index.rst must name it in a toctree.
      - name: Event source docsite page
        run: python scripts/generate_event_source_docs.py --check
      - name: Ruff lint
        # --no-cache matters: ruff would otherwise drop a .ruff_cache/ into the
        # working copy, and the ansible-test sanity step below scans *every*
        # file in it -- flagging the cache blobs for line-endings and
        # no-smart-quotes (they are binary-ish and carry CRLF).
        run: ruff check . --no-cache
      - name: Sanity ignore budget
        run: python scripts/check_sanity_ignore.py
      # The reviewer's headline finding: 432 modules documented their options as
      # single-line flow mappings.  Nothing upstream can see that -- a flow
      # mapping is legal YAML, validate-modules accepts it, and
      # sync_doc_fragments accepts it by design.
      # Reviewer MUST FIX: every module must document check mode support and
      # idempotency through an attributes block.
      # Two ratchets over the core subset (tests/quality/core-subset.yml):
      # an option description may not merely repeat the option name, and a
      # core write module must have an integration target that actually runs.
      # Four guards that existed and were never invoked from any workflow.
      # A check nobody runs is how a regression lands: this collection's
      # sanity step was itself skipped for a day because a step above it
      # failed, which is the same failure mode one level up.
      - name: Modules cross-reference their read-only counterpart
        run: python scripts/add_module_seealso.py --check
      - name: Module headers are complete
        run: python scripts/fix_module_headers.py --check
      - name: Example playbooks resolve
        run: python scripts/check_examples.py --check
      - name: Module examples run as written
        run: python scripts/check_module_examples.py --check
      - name: Every module that can delete shows it
        run: python scripts/add_delete_examples.py --check
      - name: Generated test skeletons are unmodified
        run: python scripts/generate_module_test_skeleton.py --check
      - name: Documentation links resolve
        run: python scripts/check_doc_links.py --check
      - name: Porting table resolves
        run: python scripts/check_porting_map.py --check
      - name: Integration target layout is complete
        run: python scripts/audit_integration_targets.py
      - name: Core subset quality gates
        run: python scripts/check_quality_gates.py
      - name: Modules document check_mode, diff_mode and idempotent
        run: python scripts/add_module_attributes.py --check
      - name: Modules document every key they return
        run: python scripts/check_return_docs.py --check
      - name: Changelog fragments use a configured section
        run: python scripts/check_changelog_fragments.py --check
      - name: Module docs are block style
        run: python scripts/normalize_module_docs.py --check
      - name: State documentation names the calls it makes
        run: python scripts/enrich_state_docs.py --check
      - name: Identity options say which one to give
        run: python scripts/enrich_identity_docs.py --check
      - name: Sanity tests
        run: ansible-test sanity --color --python ${{ matrix.python }}
      - name: Unit tests
        run: ansible-test units --color --python ${{ matrix.python }}
      # Contract tests run each module's request construction against the
      # real Tencent Cloud SDK classes. They are deliberately NOT part of
      # ansible-test units (those environments lack the SDK), so they run
      # here as a plain pytest step with the SDK installed; they skip
      # cleanly when the SDK is not importable.
      #
      # Coverage: module_utils + modules are measured and the run fails
      # below the coverage threshold (--cov-fail-under), so a PR that
      # silently regresses overall coverage is blocked instead of merged. The
      # module_utils AND module unit tests are collected here as well
      # (they are pure Python and pass with or without the SDK), because
      # the gate only counts what this step measures: without them the
      # module bodies would only be imported, never exercised. COS modules
      # are excluded from the scope by design via .coveragerc (COS is not
      # an API 3.0 service).
      #
      # Threshold note: the gate was introduced at 70 (2026-08-31,
      # 01fd38e) after the batch module-generation run pushed the write
      # module count to 313, of which only 63 have unit tests. Coverage
      # sits around 58-59% (module_utils 92%, _info modules 86%, write
      # modules 51%); the 70% floor has never passed since introduction.
      # 55 was set just under that measured baseline so the gate went green
      # while still catching regressions. The #57 write-module unit-test
      # drive has since raised the measured total to 74% (2026-09-04),
      # so the gate moves to 72 (measured minus two points of headroom).
      # The 80% drive (2026-09-08) raised the measured total to 81.44%
      # (9,985 unit/contract tests), so the gate moves to 80.
      - name: SDK contract tests
        run: |
          python -m pip install -r requirements.txt pytest-cov
          python -m pip install "tencentcloud-sdk-python==$(python scripts/check_sdk_drift.py --print-stamp)"
          # The measured packages are named in full rather than as relative
          # directories: pointed at a directory, coverage records each file by
          # its bare name, and three of them -- inventory.py, paging.py and
          # polling.py -- exist in both module_utils and plugin_utils, so the
          # report could not be attributed to either.
          PYTHONPATH="${{ github.workspace }}" python -m pytest tests/contract tests/unit/plugins/module_utils tests/unit/plugins/modules tests/unit/plugins/plugin_utils -q \
            --cov=ansible_collections.susunola.tencentcloud.plugins.module_utils \
            --cov=ansible_collections.susunola.tencentcloud.plugins.modules \
            --cov=ansible_collections.susunola.tencentcloud.plugins.plugin_utils \
            --cov-report=term-missing --cov-report=xml:${GITHUB_WORKSPACE}/coverage.xml \
            --cov-report=html:${GITHUB_WORKSPACE}/coverage-html --cov-fail-under=80
          # The 80% gate is measured over module_utils and modules together,
          # so one shared helper with no tests moves it by a fraction of a
          # point. cos_bucket_read.py sat at 89% that way, with twelve
          # uncovered lines every one of which was a defensive branch the API
          # itself reaches. Each shared helper is now held to its own floor.
          python scripts/check_shared_coverage.py --coverage-xml "${GITHUB_WORKSPACE}/coverage.xml"
      # Coverage is reported as an artifact so the numbers behind the
      # 80% gate are inspectable (XML for tooling, HTML for humans),
      # even when the run fails the threshold. upload-artifact resolves
      # paths against GITHUB_WORKSPACE (not the job working-directory),
      # so the reports are written there by the step above.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-html/
          if-no-files-found: warn
      # Deliberately last: this guard reads figures out of docs/panorama.html
      # and has twice gone red for its own bookkeeping.  While it sat above
      # the test steps, that failure skipped sanity and units entirely, which
      # is how 4,559 validate-modules errors reached main unnoticed.
      - name: Docs figures match the repo
        run: python scripts/check_doc_figures.py --check
      - name: Build collection
        run: ansible-galaxy collection build

  # Integration tests run in .github/workflows/integration.yml with their
  # own guardrails: a fixed concurrency group (serialises all runs against
  # the shared cloud account), a 40-minute budget cap, and an always-on
  # sweeper that removes leftover test resources after success or failure.
  #
