name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed by the step below that re-dispatches CI on the folded main.
      actions: write
    defaults:
      run:
        working-directory: ansible_collections/susunola/tencentcloud
    steps:
      - uses: actions/checkout@v7
        with:
          path: ansible_collections/susunola/tencentcloud
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Same dependency set as ci.yml, including the pinned SDK: the CI job
        # runs `ansible-test units` in a shell where the SDK happens to be
        # importable, so a unit test that needs it passes there and fails
        # here. Installing it keeps this workflow's verdict equal to CI's.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core==2.19.*" pytest pytest-xdist yamllint antsibull-changelog
          python -m pip install -r requirements.txt
          python -m pip install "tencentcloud-sdk-python==$(python scripts/check_sdk_drift.py --print-stamp)"
      - name: Lint changelog fragments
        run: antsibull-changelog lint
      - name: Sanity tests
        run: ansible-test sanity --color --python 3.12
      - name: Unit tests
        run: ansible-test units --color --python 3.12
      - name: Verify tag matches galaxy.yml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          galaxy_version="$(python -c "import yaml; print(yaml.safe_load(open('galaxy.yml'))['version'])")"
          if [ "$tag" != "$galaxy_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match galaxy.yml version ${galaxy_version}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches galaxy.yml version ${galaxy_version}"
      - name: Fold changelog fragments
        run: antsibull-changelog release --version "${GITHUB_REF_NAME#v}"
      - name: Commit changelog to main
        # Only push from the canonical repository; tag builds on forks
        # must not attempt to push.
        if: github.repository == 'susunola/ansible-collection-tencentcloud'
        id: fold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A changelogs
          # antsibull-changelog currently writes CHANGELOG.rst under
          # changelogs/; also pick it up if it ever lands at the root.
          if [ -f CHANGELOG.rst ]; then
            git add CHANGELOG.rst
          fi
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git commit -m "chore(release): fold changelog for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # A commit pushed with the default GITHUB_TOKEN does not start any
      # workflow, so the fold commit above has historically never been tested:
      # v1.2.0's fold landed a red unit test on main and nothing noticed until
      # the next manual push. Dispatch CI explicitly and wait for it, so a red
      # main is reported here instead of sitting there until someone looks.
      - name: Run CI on the folded main
        if: steps.fold.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOLD_SHA: ${{ steps.fold.outputs.sha }}
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${api}/actions/workflows/ci.yml/dispatches" \
            "${auth[@]}" -H "Content-Type: application/json" -d "{\"ref\":\"main\"}")
          if [ "$code" != "204" ]; then
            echo "::warning::Could not dispatch CI on main (HTTP ${code}); the folded commit will not be verified."
            exit 0
          fi

          # The run is created asynchronously; give it a moment, then find it
          # by its head SHA so a concurrent run cannot be mistaken for ours.
          run=""
          for _ in $(seq 1 30); do
            run=$(curl -s "${auth[@]}" "${api}/actions/runs?head_sha=${FOLD_SHA}&per_page=1" \
              | jq -r '.workflow_runs[0].id // empty')
            if [ -n "$run" ]; then break; fi
            sleep 5
          done
          if [ -z "$run" ]; then
            echo "::warning::CI was dispatched but no run for ${FOLD_SHA} appeared; skipping the wait."
            exit 0
          fi

          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run}"
          echo "Waiting for CI on the folded main: ${url}"
          for _ in $(seq 1 90); do
            state=$(curl -s "${auth[@]}" "${api}/actions/runs/${run}" | jq -r '.status + " " + (.conclusion // "")')
            case "$state" in
              completed\ success) echo "CI green on the folded main: ${url}"; exit 0 ;;
              completed\ *) echo "::error::CI failed on the folded main: ${url} (${state})"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::CI did not finish within 30 minutes: ${url}"
          exit 1
      - name: Build collection
        run: ansible-galaxy collection build
      - name: Upload collection tarball
        uses: actions/upload-artifact@v7
        with:
          name: collection-tarball
          path: ansible_collections/susunola/tencentcloud/susunola-tencentcloud-*.tar.gz
          if-no-files-found: error

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ansible_collections/susunola/tencentcloud
    steps:
      - uses: actions/checkout@v7
        with:
          path: ansible_collections/susunola/tencentcloud
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: python -m pip install "ansible-core==2.19.*"
      - name: Download collection tarball
        uses: actions/download-artifact@v8
        with:
          name: collection-tarball
          path: ansible_collections/susunola/tencentcloud
      - name: Check Galaxy API key
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -n "$GALAXY_API_KEY" ]; then
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
            echo "::warning::GALAXY_API_KEY secret is not set; skipping Galaxy publish."
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag susunola-tencentcloud-*.tar.gz
      - name: Publish to Ansible Galaxy
        if: env.HAS_KEY == 'true'
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: ansible-galaxy collection publish susunola-tencentcloud-*.tar.gz --api-key "$GALAXY_API_KEY"
