name: Integration
on:
  # Integration runs create billable cloud resources, so they are
  # opt-in: manual (workflow_dispatch) plus one weekly scheduled run
  # (Saturdays 02:00 UTC, offset from the Monday devel run). Merge-time
  # runs were dropped - sanity/units on every push already gate merges,
  # and a daily billable run added cost without catching more regressions.
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      targets:
        description: "Integration targets to run (space separated)"
        type: string
        default: "security_group network cmq_queue cls_log_pipeline api_gateway_service tat_command cfs_file_system clb_http cam_user cam_group_membership cos_bucket key_pair kms_key monitor_alarm_policy private_dns tke_addon"

# Integration tests create billable resources in a shared Tencent Cloud
# account. A single fixed concurrency group serialises every run (any
# branch, any trigger) so two runs never fight over the same account or
# double the bill; new runs wait for the current one instead of cancelling
# it mid-flight, because a cancelled run would leak resources.
concurrency:
  group: tencentcloud-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    # Hard budget cap: no integration run may exceed this wall-clock
    # limit, so a hung test or API deadlock cannot rack up unbounded
    # cloud spend.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ansible_collections/susunola/tencentcloud
    steps:
      - uses: actions/checkout@v7
        with:
          path: ansible_collections/susunola/tencentcloud
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Tencent Cloud credentials
        id: creds
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
        run: |
          if [ -n "$TENCENTCLOUD_SECRET_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.creds.outputs.available == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Build collection
        if: steps.creds.outputs.available == 'true'
        run: ansible-galaxy collection build
      - name: Install collection
        if: steps.creds.outputs.available == 'true'
        run: ansible-galaxy collection install susunola-tencentcloud-*.tar.gz --force
      # ansible-test sanitises the environment it hands to ansible-playbook:
      # only HOME / PATH / LC_ALL and a short platform-compatibility list
      # survive, so a step-level env: block never reaches the modules under
      # test and every module fails with "Set secret_id and secret_key".
      # Copy the credentials into the TCCLI profile under $HOME instead -
      # that file is the modules' last credential/region fallback and does
      # survive the sanitiser (docs/integration-env.md §2.3).
      - name: Materialise credentials for ansible-test
        if: steps.creds.outputs.available == 'true'
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_TOKEN: ${{ secrets.TENCENTCLOUD_TOKEN }}
          TENCENTCLOUD_REGION: ap-guangzhou
        run: |
          python scripts/integration_credentials.py --write
          python scripts/integration_credentials.py --check
      - name: Run integration tests
        if: steps.creds.outputs.available == 'true'
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou
          TENCENTCLOUD_TKE_CLUSTER_ID: ${{ secrets.TENCENTCLOUD_TKE_CLUSTER_ID }}
          TENCENTCLOUD_TKE_ADDON_NAME: ${{ vars.TENCENTCLOUD_TKE_ADDON_NAME }}
          TENCENTCLOUD_TKE_ADDON_VERSION: ${{ vars.TENCENTCLOUD_TKE_ADDON_VERSION }}
          TENCENTCLOUD_MONITOR_NAMESPACE: ${{ vars.TENCENTCLOUD_MONITOR_NAMESPACE }}
          TENCENTCLOUD_MONITOR_NOTICE_ID: ${{ secrets.TENCENTCLOUD_MONITOR_NOTICE_ID }}
          TENCENTCLOUD_PRIVATE_DNS_VPC_ID: ${{ secrets.TENCENTCLOUD_PRIVATE_DNS_VPC_ID }}
          TENCENTCLOUD_CAM_GROUP_ID: ${{ secrets.TENCENTCLOUD_CAM_GROUP_ID }}
          TENCENTCLOUD_CAM_SUB_UIN: ${{ secrets.TENCENTCLOUD_CAM_SUB_UIN }}
          TENCENTCLOUD_DBBRAIN_INSTANCE_ID: ${{ secrets.TENCENTCLOUD_DBBRAIN_INSTANCE_ID }}
          TENCENTCLOUD_DBBRAIN_SESSION_TOKEN: ${{ secrets.TENCENTCLOUD_DBBRAIN_SESSION_TOKEN }}
          TENCENTCLOUD_TCR_REGISTRY_ID: ${{ secrets.TENCENTCLOUD_TCR_REGISTRY_ID }}
          TENCENTCLOUD_TCR_REPLICATION_REGION_ID: ${{ vars.TENCENTCLOUD_TCR_REPLICATION_REGION_ID }}
          TENCENTCLOUD_TCR_REPLICATION_REGION_NAME: ${{ vars.TENCENTCLOUD_TCR_REPLICATION_REGION_NAME }}
          # P0-01/02 flagship targets: billed targets stay out of the default
          # list and self-skip until their gate is configured (see
          # docs/integration-env.md §2.2 - keep that table in sync here).
          TENCENTCLOUD_CVM_INSTANCE_IMAGE_ID: ${{ secrets.TENCENTCLOUD_CVM_INSTANCE_IMAGE_ID }}
          TENCENTCLOUD_CVM_INSTANCE_TYPE: ${{ vars.TENCENTCLOUD_CVM_INSTANCE_TYPE }}
          TENCENTCLOUD_RUN_BILLED_TARGETS: ${{ vars.TENCENTCLOUD_RUN_BILLED_TARGETS }}
          TENCENTCLOUD_CDB_ENGINE_VERSION: ${{ vars.TENCENTCLOUD_CDB_ENGINE_VERSION }}
          TENCENTCLOUD_CDB_MEMORY: ${{ vars.TENCENTCLOUD_CDB_MEMORY }}
          TENCENTCLOUD_CDB_VOLUME: ${{ vars.TENCENTCLOUD_CDB_VOLUME }}
          TENCENTCLOUD_CDB_ZONE: ${{ vars.TENCENTCLOUD_CDB_ZONE }}
          TENCENTCLOUD_TKE_CLUSTER_VERSION: ${{ vars.TENCENTCLOUD_TKE_CLUSTER_VERSION }}
        run: >-
          ansible-test integration ${{ inputs.targets || 'security_group network cmq_queue cls_log_pipeline api_gateway_service tat_command cfs_file_system clb_http cam_user cam_group_membership cos_bucket key_pair kms_key monitor_alarm_policy private_dns tke_addon vpc subnet' }}
          --color --python 3.12 --coverage
      # Coverage is collected (not gated) on real-cloud runs: the numbers
      # fluctuate with the account's resource state, so they are reported
      # as an artifact for inspection instead of failing the run. The XML
      # report lands in tests/output/report/ via ansible-test coverage
      # xml; upload-artifact resolves paths against GITHUB_WORKSPACE (not
      # the job working-directory), so the full path is given here.
      - name: Generate integration coverage report
        if: always() && steps.creds.outputs.available == 'true'
        continue-on-error: true
        run: |
          ansible-test coverage xml --python 3.12
          ansible-test coverage report --python 3.12
      - name: Upload integration coverage report
        if: always() && steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage
          path: ansible_collections/susunola/tencentcloud/tests/output/report/
          if-no-files-found: warn
      # Sweeper: runs even when the tests above failed or timed out, so a
      # broken run cannot leave billable resources behind. Uses the same
      # credential set and the collection installed above.
      - name: Sweep leftover test resources
        if: always() && steps.creds.outputs.available == 'true'
        continue-on-error: true
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou
        run: ansible-test integration cleanup --color --python 3.12
      - name: Audit expired manifest resources
        if: always() && steps.creds.outputs.available == 'true'
        continue-on-error: true
        run: python scripts/resource_reaper.py --fail-on-expired
      - name: Upload E2E resource manifests
        if: always() && steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-resource-manifests
          path: |
            ansible_collections/susunola/tencentcloud/tests/output/e2e-resources.jsonl
            ansible_collections/susunola/tencentcloud/tests/output/reaper-plan.json
          if-no-files-found: ignore
      # Alert a human when a real-cloud run fails: weekly and manual runs are
      # the only ones that touch billable resources, so red means triage the
      # same day. No-ops when TENCENTCLOUD_IT_ALERT_WEBHOOK is unconfigured.
      - name: Alert on integration failure
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.TENCENTCLOUD_IT_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "TENCENTCLOUD_IT_ALERT_WEBHOOK not configured - skipping alert"
            exit 0
          fi
          SUMMARY="[${{ github.workflow }}] integration run FAILED (${{ github.ref_name }}) - $RUN_URL"
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"${SUMMARY}\"}}" \
            "$ALERT_WEBHOOK"
