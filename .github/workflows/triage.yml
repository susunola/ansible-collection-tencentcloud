name: Triage
# The triage label flow described in docs/triage.md. Until this workflow
# existed, a new issue or PR carried no label until a maintainer touched it
# by hand, which is the gap that document calls out: the queue was only
# visible to whoever happened to look at it.
#
# The flow is deliberately narrow -- it moves one label in and out:
#
#   opened / reopened  -> triage     (nobody has looked at it yet)
#   first human signal -> -triage    (somebody has: a comment or a review)
#
# It never checks out pull-request code. The pull_request* events below use
# pull_request_target so the workflow has a writable token on PRs from forks,
# and the only thing any job does with that token is call the labels API.

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted]
  schedule:
    # Daily first-response sweep, 07:23 UTC. Off-peak and off the hour so it
    # does not queue behind everyone else's :00 cron.
    - cron: "23 7 * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------
  # An item just appeared, or a closed one came back: it is untriaged again.
  # ---------------------------------------------------------------------
  mark-untriaged:
    name: Mark as untriaged
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Add triage
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.issue?.number
              ?? context.payload.pull_request?.number;
            if (!number) {
              core.setFailed('no issue or pull request number in the payload');
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              // The REST endpoint creates the label when it does not exist,
              // so a fresh fork of this repo needs no bootstrap step.
              labels: ['triage'],
            });

  # ---------------------------------------------------------------------
  # The first human signal clears it. Bots do not count -- dependabot and
  # the changelog bot answer within seconds and counting them would make
  # every response time look perfect. A review clears a PR even when the
  # reviewer left no comment.
  # ---------------------------------------------------------------------
  clear-triaged:
    name: Clear the triage label
    if: >-
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Skip bot noise
        id: author
        run: |
          login="${{ github.event.comment.user.login || github.event.review.user.login }}"
          echo "login=$login" >> "$GITHUB_OUTPUT"
          case "$login" in
            *[Bb]ot|dependabot*|github-actions*) echo "bot=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "bot=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Remove triage
        if: steps.author.outputs.bot == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.issue?.number
              ?? context.payload.pull_request?.number;
            if (!number) {
              core.setFailed('no issue or pull request number in the payload');
              return;
            }
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                name: 'triage',
              });
            } catch (error) {
              // 404 is the common case: the label was already removed, or the
              // item never had it. Anything else is worth failing on.
              if (error.status !== 404) throw error;
              core.info('triage label was not present');
            }

  # ---------------------------------------------------------------------
  # The promise itself: first response within 48 hours, measured. Only
  # BREACH fails the job, because only BREACH is actionable -- a reporter
  # is still waiting and there is something to do about it.
  # ---------------------------------------------------------------------
  first-response-sla:
    name: First-response SLA
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Report first-response times
        # triage_sla.py is standard library only, so there is nothing to
        # install and no dependency to drift. Unauthenticated it would be
        # rate-limited to 60 requests an hour, hence the token.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/triage_sla.py --closed 30
          python scripts/triage_sla.py --check --exclude-author susunola
