# Dependency update automation.
#
# tencentcloud-sdk-python is declared as a range whose lower bound is a
# verified floor. scripts/check_sdk_floor.py fails when the installed
# release is not the floor or when an SDK reference does not resolve
# there, so a dependabot bump of the lower bound turns CI red until the
# bump is reviewed against the floor -- the intended review workflow for
# an SDK upgrade. Bumps of cos-python-sdk-v5 and of the GitHub Actions
# are ordinary dependency PRs.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
