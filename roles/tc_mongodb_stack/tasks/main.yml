---
- name: Resolve existing MongoDB instance ID for teardown
  when:
    - tc_mongodb_stack_state == 'absent'
    - tc_mongodb_stack_instance_id | length == 0
    - tc_mongodb_stack_name | length > 0
  ansible.builtin.set_fact:
    tc_mongodb_stack_instance_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_mongodb_stack_name,
                resource_type='mongodb_instance', region=tc_mongodb_stack_region) }}

- name: Validate MongoDB stack inputs
  ansible.builtin.assert:
    that:
      - tc_mongodb_stack_state in ['present', 'absent']
      - tc_mongodb_stack_instance_id | length > 0 or tc_mongodb_stack_name | length > 0
      - tc_mongodb_stack_state == 'absent' or tc_mongodb_stack_instance_id | length > 0 or tc_mongodb_stack_zone | length > 0
      - tc_mongodb_stack_state == 'absent' or tc_mongodb_stack_instance_id | length > 0 or tc_mongodb_stack_version | length > 0
      - tc_mongodb_stack_state == 'absent' or tc_mongodb_stack_instance_id | length > 0 or tc_mongodb_stack_memory is not none
      - tc_mongodb_stack_state == 'absent' or tc_mongodb_stack_instance_id | length > 0 or tc_mongodb_stack_volume is not none
      - tc_mongodb_stack_state == 'absent' or tc_mongodb_stack_instance_id | length > 0 or tc_mongodb_stack_cluster_type | length > 0
      - tc_mongodb_stack_state == 'present' or tc_mongodb_stack_accounts | length == 0 or tc_mongodb_stack_mongo_user_password | length > 0
    fail_msg: MongoDB creation needs sizing, version, zone and cluster type; account deletion also needs mongo_user_password.

- name: Provision MongoDB instance
  when: tc_mongodb_stack_state == 'present'
  susunola.tencentcloud.mongodb_instance:
    region: "{{ tc_mongodb_stack_region | default(omit, true) }}"
    state: present
    instance_id: "{{ tc_mongodb_stack_instance_id | default(omit, true) }}"
    name: "{{ tc_mongodb_stack_name | default(omit, true) }}"
    memory: "{{ tc_mongodb_stack_memory | default(omit, true) }}"
    volume: "{{ tc_mongodb_stack_volume | default(omit, true) }}"
    mongo_version: "{{ tc_mongodb_stack_version | default(omit, true) }}"
    zone: "{{ tc_mongodb_stack_zone | default(omit, true) }}"
    cluster_type: "{{ tc_mongodb_stack_cluster_type | default(omit, true) }}"
    node_num: "{{ tc_mongodb_stack_node_num | default(omit, true) }}"
    replicate_set_num: "{{ tc_mongodb_stack_replicate_set_num | default(omit, true) }}"
    password: "{{ tc_mongodb_stack_password | default(omit, true) }}"
    vpc_id: "{{ tc_mongodb_stack_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_mongodb_stack_subnet_id | default(omit, true) }}"
    project_id: "{{ tc_mongodb_stack_project_id | default(omit, true) }}"
    period_months: "{{ tc_mongodb_stack_period_months | default(omit, true) }}"
    auto_renew: "{{ tc_mongodb_stack_auto_renew | default(omit, true) }}"
    security_group: "{{ tc_mongodb_stack_security_groups }}"
    tags: "{{ tc_mongodb_stack_tags }}"
  register: _tc_mongodb_stack_instance

- name: Resolve MongoDB instance ID
  when: tc_mongodb_stack_state == 'present'
  ansible.builtin.set_fact:
    _tc_mongodb_stack_instance_id: >-
      {{ tc_mongodb_stack_instance_id
         or (_tc_mongodb_stack_instance.instance.InstanceId | default('')) }}

- name: Provision MongoDB accounts
  when:
    - tc_mongodb_stack_state == 'present'
    - _tc_mongodb_stack_instance_id | length > 0
  susunola.tencentcloud.mongodb_account:
    region: "{{ tc_mongodb_stack_region | default(omit, true) }}"
    state: present
    instance_id: "{{ _tc_mongodb_stack_instance_id }}"
    username: "{{ item.username }}"
    password: "{{ item.password | default(omit) }}"
    rotate_password: "{{ item.rotate_password | default(false) }}"
    mongo_user_password: "{{ tc_mongodb_stack_mongo_user_password | default(omit, true) }}"
    description: "{{ item.description | default('') }}"
    roles: "{{ item.roles }}"
  loop: "{{ tc_mongodb_stack_accounts }}"
  loop_control:
    label: "{{ item.username }}"
  register: _tc_mongodb_stack_accounts

- name: Configure MongoDB automatic backup
  when:
    - tc_mongodb_stack_state == 'present'
    - _tc_mongodb_stack_instance_id | length > 0
    - tc_mongodb_stack_backup_enabled
  susunola.tencentcloud.mongodb_backup_config:
    region: "{{ tc_mongodb_stack_region | default(omit, true) }}"
    instance_id: "{{ _tc_mongodb_stack_instance_id }}"
    backup_method: "{{ tc_mongodb_stack_backup_method }}"
    backup_hour: "{{ tc_mongodb_stack_backup_hour }}"
    frequency_hours: "{{ tc_mongodb_stack_backup_frequency_hours }}"
    active_weekdays: "{{ tc_mongodb_stack_backup_active_weekdays }}"
    retention_days: "{{ tc_mongodb_stack_backup_retention_days }}"
    oplog_retention_days: "{{ tc_mongodb_stack_oplog_retention_days }}"
    backup_version: "{{ tc_mongodb_stack_backup_version }}"
    alert_threshold: "{{ tc_mongodb_stack_backup_alert_threshold }}"
  register: _tc_mongodb_stack_backup

- name: Remove MongoDB accounts
  when: tc_mongodb_stack_state == 'absent'
  susunola.tencentcloud.mongodb_account:
    region: "{{ tc_mongodb_stack_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_mongodb_stack_instance_id }}"
    username: "{{ item.username }}"
    mongo_user_password: "{{ tc_mongodb_stack_mongo_user_password }}"
  loop: "{{ tc_mongodb_stack_accounts }}"
  loop_control:
    label: "{{ item.username }}"

- name: Remove MongoDB instance
  when: tc_mongodb_stack_state == 'absent'
  susunola.tencentcloud.mongodb_instance:
    region: "{{ tc_mongodb_stack_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_mongodb_stack_instance_id | default(omit, true) }}"
    name: "{{ tc_mongodb_stack_name | default(omit, true) }}"

- name: Publish MongoDB stack result
  when: tc_mongodb_stack_state == 'present'
  ansible.builtin.set_fact:
    tc_mongodb_stack_result:
      instance_id: "{{ _tc_mongodb_stack_instance_id }}"
      instance: "{{ _tc_mongodb_stack_instance.instance }}"
      accounts: "{{ _tc_mongodb_stack_accounts.results | default([]) }}"
      backup: "{{ _tc_mongodb_stack_backup | default({}) }}"
