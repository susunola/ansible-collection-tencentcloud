- name: Publish TSE API gateway outputs
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    tc_tse_api_gateway_result:
      gateway: "{{ _tc_tse_api_gateway_gateway.gateway }}"
      autoscaler_strategies: "{{ _tc_tse_api_gateway_autoscaler_strategies_result.results | default([]) | map(attribute='strategy') | list }}"
      autoscaler_bindings: "{{ _tc_tse_api_gateway_autoscaler_bindings_result.results | default([]) | map(attribute='binding') | list }}"
      services: "{{ _tc_tse_api_gateway_services.results | default([]) | map(attribute='service') | list }}"
      routes: "{{ _tc_tse_api_gateway_routes_result.results | default([]) | map(attribute='route') | list }}"
      canary_rules: "{{ _tc_tse_api_gateway_canary_rules_result.results | default([]) | map(attribute='canary_rule') | list }}"
      consumers: "{{ _tc_tse_api_gateway_consumers_result.results | default([]) | map(attribute='consumer') | list }}"
      consumer_groups: "{{ _tc_tse_api_gateway_consumer_groups_result.results | default([]) | map(attribute='consumer_group') | list }}"
      consumer_group_memberships: "{{ _tc_tse_api_gateway_consumer_group_memberships_result.results | default([]) | map(attribute='membership') | list }}"
      model_api_group_auths: "{{ _tc_tse_api_gateway_model_api_group_auths_result.results | default([]) | map(attribute='authorization') | list }}"
      secret_keys: "{{ _tc_tse_api_gateway_secret_keys_result.results | default([]) | map(attribute='secret_key') | list }}"
      model_services: "{{ _tc_tse_api_gateway_model_services_result.results | default([]) | map(attribute='model_service') | list }}"
      model_apis: "{{ _tc_tse_api_gateway_model_apis_result.results | default([]) | map(attribute='model_api') | list }}"
      certificates: "{{ _tc_tse_api_gateway_certificates_result.results | default([]) | map(attribute='certificate_info') | list }}"
      waf_domains: "{{ _tc_tse_api_gateway_waf_domains_result.waf_domains | default([]) }}"
      waf_protections: "{{ _tc_tse_api_gateway_waf_protections_result.results | default([]) | map(attribute='waf_protection') | list }}"
      rate_limits: "{{ _tc_tse_api_gateway_rate_limits_result.results | default([]) | map(attribute='rate_limit') | list }}"
      cors_policies: "{{ _tc_tse_api_gateway_cors_result.results | default([]) | map(attribute='cors') | list }}"
      ip_restrictions: "{{ _tc_tse_api_gateway_ip_restrictions_result.results | default([]) | map(attribute='ip_restriction') | list }}"
      public_networks: "{{ _tc_tse_api_gateway_public_networks_result.results | default([]) | map(attribute='public_network') | list }}"

- name: Require gateway ID for deterministic teardown
  when:
    - tc_tse_api_gateway_state == 'absent'
    - tc_tse_api_gateway_gateway.gateway_id | default('') | length == 0
  ansible.builtin.fail:
    msg: gateway.gateway_id is required for deterministic TSE API gateway teardown.

