---
- name: Validate TSE API gateway inputs
  ansible.builtin.assert:
    that:
      - tc_tse_api_gateway_state in ['present', 'absent']
      - tc_tse_api_gateway_gateway is mapping
      - tc_tse_api_gateway_server_groups is sequence
      - tc_tse_api_gateway_autoscaler_strategies is sequence
      - tc_tse_api_gateway_autoscaler_bindings is sequence
      - tc_tse_api_gateway_service_sources is sequence
      - tc_tse_api_gateway_services is sequence
      - tc_tse_api_gateway_routes is sequence
      - tc_tse_api_gateway_canary_rules is sequence
      - tc_tse_api_gateway_consumers is sequence
      - tc_tse_api_gateway_consumer_groups is sequence
      - tc_tse_api_gateway_consumer_group_memberships is sequence
      - tc_tse_api_gateway_model_api_group_auths is sequence
      - tc_tse_api_gateway_secret_keys is sequence
      - tc_tse_api_gateway_model_services is sequence
      - tc_tse_api_gateway_model_apis is sequence
      - tc_tse_api_gateway_certificates is sequence
      - tc_tse_api_gateway_waf_domains is sequence
      - tc_tse_api_gateway_waf_protections is sequence
      - tc_tse_api_gateway_rate_limits is sequence
      - tc_tse_api_gateway_cors_policies is sequence
      - tc_tse_api_gateway_ip_restrictions is sequence
      - tc_tse_api_gateway_public_networks is sequence
      - tc_tse_api_gateway_gateway.gateway_id | default(tc_tse_api_gateway_gateway.name | default('')) | length > 0
      - tc_tse_api_gateway_state == 'present' or tc_tse_api_gateway_allow_destroy | bool
    fail_msg: TSE API gateway requires gateway_id or name; destruction requires tc_tse_api_gateway_allow_destroy=true.

- name: Reconcile TSE cloud-native API gateway
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_cloud_native_gateway:
  args: "{{ tc_tse_api_gateway_gateway | combine({'state': 'present'}) }}"
  register: _tc_tse_api_gateway_gateway

- name: Capture TSE API gateway ID
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_id: "{{ _tc_tse_api_gateway_gateway.gateway.GatewayId }}"

- name: Reconcile TSE API gateway server groups
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_server_group:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_api_gateway_server_groups }}"
  loop_control: {label: "{{ item.name | default(item.group_id | default('unnamed')) }}"}
  register: _tc_tse_api_gateway_server_groups_result

- name: Reconcile TSE API gateway autoscaler strategies
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_autoscaler_strategy:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_api_gateway_autoscaler_strategies }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}
  register: _tc_tse_api_gateway_autoscaler_strategies_result

- name: Validate TSE API gateway autoscaler binding references
  when:
    - tc_tse_api_gateway_state == 'present'
    - item.strategy_name is defined
  ansible.builtin.assert:
    that:
      - >-
        [item.strategy_name] | difference(
          _tc_tse_api_gateway_autoscaler_strategies_result.results
          | map(attribute='strategy.StrategyName') | list
        ) | length == 0
    fail_msg: An autoscaler binding references an unknown strategy name.
  loop: "{{ tc_tse_api_gateway_autoscaler_bindings }}"
  loop_control: {label: "{{ item.strategy_name | default(item.strategy_id | default('unnamed')) }}"}

- name: Initialize resolved TSE API gateway autoscaler bindings
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_autoscaler_bindings: []

- name: Resolve TSE API gateway autoscaler strategy names
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_autoscaler_bindings: >-
      {{ _tc_tse_api_gateway_resolved_autoscaler_bindings + [
        (item | dict2items | rejectattr('key', 'equalto', 'strategy_name') | items2dict)
        | combine({
          'strategy_id': item.strategy_id
            if item.strategy_id is defined else
            (_tc_tse_api_gateway_autoscaler_strategies_result.results
              | selectattr('strategy.StrategyName', 'equalto', item.strategy_name)
              | map(attribute='strategy.StrategyId') | first)
        })
      ] }}
  loop: "{{ tc_tse_api_gateway_autoscaler_bindings }}"
  loop_control: {label: "{{ item.strategy_name | default(item.strategy_id | default('unnamed')) }}"}

- name: Reconcile TSE API gateway autoscaler bindings
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_autoscaler_binding:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ _tc_tse_api_gateway_resolved_autoscaler_bindings }}"
  loop_control: {label: "{{ item.strategy_id | default('unnamed') }}"}
  register: _tc_tse_api_gateway_autoscaler_bindings_result

- name: Reconcile TSE API gateway service sources
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_service_source:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_api_gateway_service_sources }}"
  loop_control: {label: "{{ item.source_name | default(item.source_id | default('unnamed')) }}"}
  register: _tc_tse_api_gateway_service_sources_result
  no_log: true

- name: Validate TSE API gateway service-source references
  when:
    - tc_tse_api_gateway_state == 'present'
    - item.upstream_source_name is defined
  ansible.builtin.assert:
    that:
      - >-
        item.upstream_source_name in
        (_tc_tse_api_gateway_service_sources_result.results
          | map(attribute='source.SourceName') | list)
    fail_msg: A gateway service references an unknown upstream service source name.
  loop: "{{ tc_tse_api_gateway_services }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}

- name: Initialize resolved TSE API gateway services
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_services: []

- name: Resolve TSE API gateway service-source names
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_services: >-
      {{ _tc_tse_api_gateway_resolved_services + [
        (item | dict2items | rejectattr('key', 'equalto', 'upstream_source_name') | items2dict)
        | combine({
          'upstream_info': (item.upstream_info | default({})) | combine({
            'SourceID': (_tc_tse_api_gateway_service_sources_result.results
              | selectattr('source.SourceName', 'equalto', item.upstream_source_name)
              | map(attribute='source.SourceID') | first)
          })
        }) if item.upstream_source_name is defined else item
      ] }}
  loop: "{{ tc_tse_api_gateway_services }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}

- name: Reconcile TSE API gateway services
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_service:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ _tc_tse_api_gateway_resolved_services }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}
  register: _tc_tse_api_gateway_services

- name: Reconcile TSE API gateway public networks
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_public_network:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_api_gateway_public_networks }}"
  loop_control: {label: "{{ item.group_id | default('unnamed') }}"}
  register: _tc_tse_api_gateway_public_networks_result

- name: Initialize resolved TSE API gateway routes
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_routes: []

- name: Resolve TSE API gateway route service IDs
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_routes: >-
      {{ _tc_tse_api_gateway_resolved_routes + [
        (item | dict2items | rejectattr('key', 'equalto', 'service_name') | items2dict)
        | combine({'service_id': item.service_id | default(
          _tc_tse_api_gateway_services.results
          | selectattr('service.Name', 'equalto', item.service_name | default(''))
          | map(attribute='service.ID') | first)})
      ] }}
  loop: "{{ tc_tse_api_gateway_routes }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}

- name: Reconcile TSE API gateway routes
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_route:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ _tc_tse_api_gateway_resolved_routes }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}
  register: _tc_tse_api_gateway_routes_result

- name: Reconcile TSE API gateway canary rules
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_canary_rule:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_api_gateway_canary_rules }}"
  loop_control: {label: "{{ item.service_id | default('unnamed') }}/{{ item.priority | default('?') }}"}
  register: _tc_tse_api_gateway_canary_rules_result

- name: Reconcile TSE API gateway consumers
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_consumer:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_api_gateway_consumers }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}
  register: _tc_tse_api_gateway_consumers_result

- name: Reconcile TSE API gateway consumer groups
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_consumer_group:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_api_gateway_consumer_groups }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}
  register: _tc_tse_api_gateway_consumer_groups_result

- name: Validate TSE API gateway consumer group membership references
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.assert:
    that:
      - item.consumer_group_id is defined or item.consumer_group_name is defined
      - item.consumer_ids is defined or item.consumer_names is defined
      - >-
        item.consumer_group_name is not defined or
        [item.consumer_group_name] | difference(
          _tc_tse_api_gateway_consumer_groups_result.results
          | map(attribute='consumer_group.Name') | list
        ) | length == 0
      - >-
        item.consumer_names is not defined or
        item.consumer_names | difference(
          _tc_tse_api_gateway_consumers_result.results
          | map(attribute='consumer.Name') | list
        ) | length == 0
    fail_msg: A consumer group membership references an unknown or incomplete consumer/group identity.
  loop: "{{ tc_tse_api_gateway_consumer_group_memberships }}"
  loop_control: {label: "{{ item.consumer_group_name | default(item.consumer_group_id | default('unnamed')) }}"}

- name: Initialize resolved TSE API gateway consumer group memberships
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_consumer_group_memberships: []

- name: Resolve TSE API gateway consumer group membership names
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_consumer_group_memberships: >-
      {{ _tc_tse_api_gateway_resolved_consumer_group_memberships + [
        (item | dict2items
          | rejectattr('key', 'in', ['consumer_group_name', 'consumer_names']) | items2dict)
        | combine({
          'consumer_group_id': item.consumer_group_id
            if item.consumer_group_id is defined else
            (_tc_tse_api_gateway_consumer_groups_result.results
              | selectattr('consumer_group.Name', 'equalto', item.consumer_group_name)
              | map(attribute='consumer_group.ConsumerGroupId') | first),
          'consumer_ids': item.consumer_ids
            if item.consumer_ids is defined else
            (_tc_tse_api_gateway_consumers_result.results
              | selectattr('consumer.Name', 'in', item.consumer_names)
              | map(attribute='consumer.ConsumerId') | list)
        })
      ] }}
  loop: "{{ tc_tse_api_gateway_consumer_group_memberships }}"
  loop_control: {label: "{{ item.consumer_group_name | default(item.consumer_group_id | default('unnamed')) }}"}

- name: Reconcile TSE API gateway consumer group memberships
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_consumer_group_membership:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ _tc_tse_api_gateway_resolved_consumer_group_memberships }}"
  loop_control: {label: "{{ item.consumer_group_id | default('unnamed') }}"}
  register: _tc_tse_api_gateway_consumer_group_memberships_result

- name: Reconcile TSE API gateway secret keys
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_secret_key:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_api_gateway_secret_keys }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}
  register: _tc_tse_api_gateway_secret_keys_result
  no_log: "{{ item.secret_value is defined or item.reveal_secret_value | default(false) | bool }}"

- name: Initialize resolved TSE AI gateway model services
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_model_services: []

- name: Resolve TSE AI gateway model service secret key names
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_model_services: >-
      {{ _tc_tse_api_gateway_resolved_model_services + [
        (item | dict2items | rejectattr('key', 'equalto', 'secret_key_names') | items2dict)
        | combine(
          {'config': (item.config | default({})) | combine({
            'SecretKeyIds': _tc_tse_api_gateway_secret_keys_result.results
            | selectattr('secret_key.Name', 'in', item.secret_key_names)
            | map(attribute='secret_key.SecretKeyId') | list
          })} if item.secret_key_names is defined else {}
        )
      ] }}
  loop: "{{ tc_tse_api_gateway_model_services }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}

- name: Validate TSE AI gateway model service secret key references
  when:
    - tc_tse_api_gateway_state == 'present'
    - item.secret_key_names is defined
  ansible.builtin.assert:
    that:
      - >-
        item.secret_key_names | difference(
          _tc_tse_api_gateway_secret_keys_result.results
          | map(attribute='secret_key.Name') | list
        ) | length == 0
    fail_msg: "Model service {{ item.name | default('unnamed') }} references an unknown secret key name."
  loop: "{{ tc_tse_api_gateway_model_services }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}

- name: Reconcile TSE AI gateway model services
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_model_service:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ _tc_tse_api_gateway_resolved_model_services }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}
  register: _tc_tse_api_gateway_model_services_result

- name: Initialize resolved TSE AI gateway Model APIs
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_model_apis: []

- name: Resolve TSE AI gateway Model API service names
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_model_apis: >-
      {{ _tc_tse_api_gateway_resolved_model_apis + [
        (item | dict2items | rejectattr('key', 'equalto', 'model_service_names') | items2dict)
        | combine(
          {'config': (item.config | default({})) | combine({
            'ListModelServiceId': _tc_tse_api_gateway_model_services_result.results
            | selectattr('model_service.Name', 'in', item.model_service_names)
            | map(attribute='model_service.Id') | list
          })} if item.model_service_names is defined else {}
        )
      ] }}
  loop: "{{ tc_tse_api_gateway_model_apis }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}

- name: Validate TSE AI gateway Model API service references
  when:
    - tc_tse_api_gateway_state == 'present'
    - item.model_service_names is defined
  ansible.builtin.assert:
    that:
      - >-
        item.model_service_names | difference(
          _tc_tse_api_gateway_model_services_result.results
          | map(attribute='model_service.Name') | list
        ) | length == 0
    fail_msg: "Model API {{ item.name | default('unnamed') }} references an unknown model service name."
  loop: "{{ tc_tse_api_gateway_model_apis }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}

- name: Reconcile TSE AI gateway Model APIs
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_model_api:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ _tc_tse_api_gateway_resolved_model_apis }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}
  register: _tc_tse_api_gateway_model_apis_result

- name: Validate TSE API gateway Model API authorization references
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.assert:
    that:
      - item.model_api_id is defined or item.model_api_name is defined
      - item.consumer_group_ids is defined or item.consumer_group_names is defined
      - >-
        item.model_api_name is not defined or
        [item.model_api_name] | difference(
          _tc_tse_api_gateway_model_apis_result.results
          | map(attribute='model_api.Name') | list
        ) | length == 0
      - >-
        item.consumer_group_names is not defined or
        item.consumer_group_names | difference(
          _tc_tse_api_gateway_consumer_groups_result.results
          | map(attribute='consumer_group.Name') | list
        ) | length == 0
    fail_msg: A Model API authorization references an unknown or incomplete Model API/group identity.
  loop: "{{ tc_tse_api_gateway_model_api_group_auths }}"
  loop_control: {label: "{{ item.model_api_name | default(item.model_api_id | default('unnamed')) }}"}

- name: Initialize resolved TSE API gateway Model API group authorizations
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_model_api_group_auths: []

- name: Resolve TSE API gateway Model API authorization names
  when: tc_tse_api_gateway_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_api_gateway_resolved_model_api_group_auths: >-
      {{ _tc_tse_api_gateway_resolved_model_api_group_auths + [
        (item | dict2items
          | rejectattr('key', 'in', ['model_api_name', 'consumer_group_names']) | items2dict)
        | combine({
          'model_api_id': item.model_api_id
            if item.model_api_id is defined else
            (_tc_tse_api_gateway_model_apis_result.results
              | selectattr('model_api.Name', 'equalto', item.model_api_name)
              | map(attribute='model_api.Id') | first),
          'consumer_group_ids': item.consumer_group_ids
            if item.consumer_group_ids is defined else
            (_tc_tse_api_gateway_consumer_groups_result.results
              | selectattr('consumer_group.Name', 'in', item.consumer_group_names)
              | map(attribute='consumer_group.ConsumerGroupId') | list)
        })
      ] }}
  loop: "{{ tc_tse_api_gateway_model_api_group_auths }}"
  loop_control: {label: "{{ item.model_api_name | default(item.model_api_id | default('unnamed')) }}"}

- name: Reconcile TSE API gateway Model API group authorizations
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_model_api_group_auth:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ _tc_tse_api_gateway_resolved_model_api_group_auths }}"
  loop_control: {label: "{{ item.model_api_id | default('unnamed') }}"}
  register: _tc_tse_api_gateway_model_api_group_auths_result

- name: Reconcile TSE API gateway certificates
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_certificate:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_api_gateway_certificates }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}
  register: _tc_tse_api_gateway_certificates_result
  no_log: "{{ item.private_key is defined }}"

- name: Reconcile TSE API gateway WAF domains
  when:
    - tc_tse_api_gateway_state == 'present'
    - tc_tse_api_gateway_waf_domains | length > 0
  susunola.tencentcloud.tse_gateway_waf_domains:
    gateway_id: "{{ _tc_tse_api_gateway_id }}"
    domains: "{{ tc_tse_api_gateway_waf_domains }}"
    purge_unlisted: true
    state: present
  register: _tc_tse_api_gateway_waf_domains_result

- name: Reconcile TSE API gateway WAF protections
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_waf_protection:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id}) }}"
  loop: "{{ tc_tse_api_gateway_waf_protections }}"
  loop_control: {label: "{{ item.scope | default('unnamed') }}"}
  register: _tc_tse_api_gateway_waf_protections_result

- name: Reconcile TSE API gateway rate limits
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_rate_limit:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_api_gateway_rate_limits }}"
  loop_control: {label: "{{ item.scope | default('?') }}/{{ item.resource | default('unnamed') }}"}
  register: _tc_tse_api_gateway_rate_limits_result

- name: Reconcile TSE API gateway CORS policies
  when: tc_tse_api_gateway_state == 'present'
  susunola.tencentcloud.tse_gateway_cors:
  args: "{{ item | combine({'gateway_id': _tc_tse_api_gateway_id, 'state': 'present'}) }}"
