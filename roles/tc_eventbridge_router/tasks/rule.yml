---
- name: Reconcile EventBridge rule
  susunola.tencentcloud.eb_rule:
    region: "{{ tc_eventbridge_router_region | default(omit, true) }}"
    state: present
    event_bus_id: "{{ _tc_eventbridge_router_event_bus_id }}"
    rule_id: "{{ _tc_eventbridge_rule.rule_id | default(omit, true) }}"
    name: "{{ _tc_eventbridge_rule.name | default(omit, true) }}"
    event_pattern: "{{ _tc_eventbridge_rule.event_pattern | default(omit, true) }}"
    enabled: "{{ _tc_eventbridge_rule.enabled | default(true) }}"
    description: "{{ _tc_eventbridge_rule.description | default('') }}"
  register: _tc_eventbridge_rule_result

- name: Resolve EventBridge rule ID
  ansible.builtin.set_fact:
    _tc_eventbridge_rule_id: >-
      {{ _tc_eventbridge_rule.rule_id | default('')
         or (_tc_eventbridge_rule_result.rule.RuleId | default('')) }}

- name: Reconcile EventBridge rule targets
  susunola.tencentcloud.eb_target:
    region: "{{ tc_eventbridge_router_region | default(omit, true) }}"
    state: present
    event_bus_id: "{{ _tc_eventbridge_router_event_bus_id }}"
    rule_id: "{{ _tc_eventbridge_rule_id }}"
    target_id: "{{ item.target_id | default(omit, true) }}"
    target_type: "{{ item.target_type | default(omit, true) }}"
    target_description: "{{ item.target_description | default(omit) }}"
    enable_batch_delivery: "{{ item.enable_batch_delivery | default(omit) }}"
    batch_timeout: "{{ item.batch_timeout | default(omit) }}"
    batch_event_count: "{{ item.batch_event_count | default(omit) }}"
  loop: "{{ _tc_eventbridge_rule.targets | default([]) }}"
  loop_control:
    label: "{{ item.target_id | default(item.target_type | default('target')) }}"
