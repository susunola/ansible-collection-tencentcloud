---
- name: Validate EventBridge target teardown identity
  when: _tc_eventbridge_rule.targets | default([]) | length > 0
  ansible.builtin.assert:
    that:
      - _tc_eventbridge_rule.rule_id | default('') | length > 0
    fail_msg: rule_id is required on a rule item when deleting its targets.

- name: Remove EventBridge rule targets
  susunola.tencentcloud.eb_target:
    region: "{{ tc_eventbridge_router_region | default(omit, true) }}"
    state: absent
    event_bus_id: "{{ tc_eventbridge_router_event_bus_id }}"
    rule_id: "{{ _tc_eventbridge_rule.rule_id }}"
    target_id: "{{ item.target_id | default(omit, true) }}"
    target_type: "{{ item.target_type | default(omit, true) }}"
    target_description: "{{ item.target_description | default(omit) }}"
  loop: "{{ _tc_eventbridge_rule.targets | default([]) }}"
  loop_control:
    label: "{{ item.target_id | default(item.target_type | default('target')) }}"

- name: Remove EventBridge rule
  susunola.tencentcloud.eb_rule:
    region: "{{ tc_eventbridge_router_region | default(omit, true) }}"
    state: absent
    event_bus_id: "{{ tc_eventbridge_router_event_bus_id }}"
    rule_id: "{{ _tc_eventbridge_rule.rule_id | default(omit, true) }}"
    name: "{{ _tc_eventbridge_rule.name | default(omit, true) }}"
