---
- name: Validate Doris analytics platform inputs
  ansible.builtin.assert:
    that:
      - tc_doris_analytics_platform_state in ['present', 'absent']
      - tc_doris_analytics_platform_instance | length > 0
      - tc_doris_analytics_platform_state != 'absent' or tc_doris_analytics_platform_instance.instance_id is defined
    fail_msg: Doris analytics platform requires instance creation fields or an existing instance_id.

- name: Reconcile Doris instance
  when: tc_doris_analytics_platform_state == 'present'
  susunola.tencentcloud.cdwdoris_instance:
  args: "{{ tc_doris_analytics_platform_instance | combine({'state': 'present'}) }}"
  register: _tc_doris_platform_instance

- name: Reconcile Doris workload groups
  when:
    - tc_doris_analytics_platform_state == 'present'
    - _tc_doris_platform_instance.instance.InstanceId is defined
  susunola.tencentcloud.cdwdoris_workload_group:
  args: "{{ _tc_doris_workload_group | combine({'state': 'present', 'instance_id': _tc_doris_platform_instance.instance.InstanceId, 'workload_groups_enabled': tc_doris_analytics_platform_workload_groups_enabled}) }}"
  loop: "{{ tc_doris_analytics_platform_workload_groups }}"
  loop_control:
    loop_var: _tc_doris_workload_group
    label: "{{ _tc_doris_workload_group.name | default('unnamed') }}"
  register: _tc_doris_platform_workload_groups

- name: Bind Doris users to workload groups
  when:
    - tc_doris_analytics_platform_state == 'present'
    - _tc_doris_platform_instance.instance.InstanceId is defined
  susunola.tencentcloud.cdwdoris_user_workload_group:
    instance_id: "{{ _tc_doris_platform_instance.instance.InstanceId }}"
    user_name: "{{ _tc_doris_user_binding.user_name }}"
    hosts: "{{ _tc_doris_user_binding.hosts }}"
    workload_group: "{{ _tc_doris_user_binding.workload_group }}"
  loop: "{{ tc_doris_analytics_platform_user_bindings }}"
  loop_control:
    loop_var: _tc_doris_user_binding
    label: "{{ _tc_doris_user_binding.user_name | default('unnamed') }}"
  register: _tc_doris_platform_user_bindings

- name: Publish Doris analytics platform result
  when: tc_doris_analytics_platform_state == 'present'
  ansible.builtin.set_fact:
    tc_doris_analytics_platform_result:
      instance: "{{ _tc_doris_platform_instance.instance }}"
      workload_groups: "{{ _tc_doris_platform_workload_groups.results | default([]) | map(attribute='workload_group') | list }}"
      user_bindings: "{{ _tc_doris_platform_user_bindings.results | default([]) | map(attribute='binding') | list }}"

- name: Require explicit authorization before Doris platform teardown
  when:
    - tc_doris_analytics_platform_state == 'absent'
    - not tc_doris_analytics_platform_allow_destroy | bool
  ansible.builtin.fail:
    msg: Set tc_doris_analytics_platform_allow_destroy=true to authorize workload-group removal and instance destruction.

- name: Move Doris users to their teardown workload group
  when:
    - tc_doris_analytics_platform_state == 'absent'
    - tc_doris_analytics_platform_allow_destroy | bool
    - _tc_doris_user_binding.teardown_workload_group is defined
  susunola.tencentcloud.cdwdoris_user_workload_group:
    instance_id: "{{ tc_doris_analytics_platform_instance.instance_id }}"
    user_name: "{{ _tc_doris_user_binding.user_name }}"
    hosts: "{{ _tc_doris_user_binding.hosts }}"
    workload_group: "{{ _tc_doris_user_binding.teardown_workload_group }}"
  loop: "{{ tc_doris_analytics_platform_user_bindings }}"
  loop_control:
    loop_var: _tc_doris_user_binding
    label: "{{ _tc_doris_user_binding.user_name | default('unnamed') }}"

- name: Remove Doris workload groups before the instance
  when:
    - tc_doris_analytics_platform_state == 'absent'
    - tc_doris_analytics_platform_allow_destroy | bool
  susunola.tencentcloud.cdwdoris_workload_group:
  args: "{{ _tc_doris_workload_group | combine({'state': 'absent', 'instance_id': tc_doris_analytics_platform_instance.instance_id}) }}"
  loop: "{{ tc_doris_analytics_platform_workload_groups }}"
  loop_control:
    loop_var: _tc_doris_workload_group
    label: "{{ _tc_doris_workload_group.name | default('unnamed') }}"

- name: Destroy Doris instance
  when:
    - tc_doris_analytics_platform_state == 'absent'
    - tc_doris_analytics_platform_allow_destroy | bool
  susunola.tencentcloud.cdwdoris_instance:
  args: "{{ tc_doris_analytics_platform_instance | combine({'state': 'absent'}) }}"
