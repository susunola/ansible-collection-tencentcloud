---
- name: Resolve existing RabbitMQ instance ID for teardown
  when:
    - tc_rabbitmq_platform_state == 'absent'
    - tc_rabbitmq_platform_instance_id | length == 0
    - tc_rabbitmq_platform_name | length > 0
  ansible.builtin.set_fact:
    tc_rabbitmq_platform_instance_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_rabbitmq_platform_name,
                resource_type='rabbitmq_instance', region=tc_rabbitmq_platform_region) }}

- name: Validate RabbitMQ platform inputs
  ansible.builtin.assert:
    that:
      - tc_rabbitmq_platform_state in ['present', 'absent']
      - tc_rabbitmq_platform_instance_id | length > 0 or tc_rabbitmq_platform_name | length > 0
      - tc_rabbitmq_platform_state == 'present' or tc_rabbitmq_platform_instance_id | length > 0
      - tc_rabbitmq_platform_state == 'absent' or tc_rabbitmq_platform_instance_id | length > 0 or tc_rabbitmq_platform_zone_ids | length > 0
      - tc_rabbitmq_platform_state == 'absent' or tc_rabbitmq_platform_instance_id | length > 0 or tc_rabbitmq_platform_vpc_id | length > 0
      - tc_rabbitmq_platform_state == 'absent' or tc_rabbitmq_platform_instance_id | length > 0 or tc_rabbitmq_platform_subnet_id | length > 0
    fail_msg: RabbitMQ creation requires zones, VPC and subnet; teardown requires a resolvable instance ID.

- name: Provision RabbitMQ dedicated instance
  when: tc_rabbitmq_platform_state == 'present'
  susunola.tencentcloud.tdmq_rabbitmq_instance:
    region: "{{ tc_rabbitmq_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ tc_rabbitmq_platform_instance_id | default(omit, true) }}"
    name: "{{ tc_rabbitmq_platform_name | default(omit, true) }}"
    zone_ids: "{{ tc_rabbitmq_platform_zone_ids | default(omit, true) }}"
    vpc_id: "{{ tc_rabbitmq_platform_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_rabbitmq_platform_subnet_id | default(omit, true) }}"
    node_spec: "{{ tc_rabbitmq_platform_node_spec }}"
    node_count: "{{ tc_rabbitmq_platform_node_count | default(omit) }}"
    storage_size: "{{ tc_rabbitmq_platform_storage_size }}"
    cluster_version: "{{ tc_rabbitmq_platform_version }}"
    pay_mode: "{{ tc_rabbitmq_platform_pay_mode }}"
    period_months: "{{ tc_rabbitmq_platform_period_months }}"
    auto_renew: "{{ tc_rabbitmq_platform_auto_renew }}"
    default_ha_mirror_queue: "{{ tc_rabbitmq_platform_default_ha_mirror_queue }}"
    bandwidth: "{{ tc_rabbitmq_platform_bandwidth | default(omit) }}"
    public_access: "{{ tc_rabbitmq_platform_public_access }}"
    deletion_protection: "{{ tc_rabbitmq_platform_deletion_protection }}"
    remark: "{{ tc_rabbitmq_platform_remark }}"
    tags: "{{ tc_rabbitmq_platform_tags }}"
    international: "{{ tc_rabbitmq_platform_international }}"
    waiter_delay: "{{ tc_rabbitmq_platform_waiter_delay }}"
    waiter_timeout: "{{ tc_rabbitmq_platform_waiter_timeout }}"
  register: _tc_rabbitmq_platform_instance

- name: Resolve RabbitMQ instance ID
  when: tc_rabbitmq_platform_state == 'present'
  ansible.builtin.set_fact:
    _tc_rabbitmq_platform_instance_id: >-
      {{ tc_rabbitmq_platform_instance_id
         or (_tc_rabbitmq_platform_instance.instance.InstanceId | default('')) }}

- name: Reconcile RabbitMQ users
  when:
    - tc_rabbitmq_platform_state == 'present'
    - _tc_rabbitmq_platform_instance_id | length > 0
  susunola.tencentcloud.tdmq_rabbitmq_user:
    region: "{{ tc_rabbitmq_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ _tc_rabbitmq_platform_instance_id }}"
    name: "{{ item.name }}"
    password: "{{ item.password | default(omit, true) }}"
    rotate_password: "{{ item.rotate_password | default(false) }}"
    description: "{{ item.description | default('') }}"
    tags: "{{ item.tags | default([]) }}"
    max_connections: "{{ item.max_connections | default(omit) }}"
    max_channels: "{{ item.max_channels | default(omit) }}"
    cam_auth_enabled: "{{ item.cam_auth_enabled | default(false) }}"
  loop: "{{ tc_rabbitmq_platform_users }}"
  loop_control: {label: "{{ item.name }}"}
  no_log: "{{ item.password is defined }}"
  register: _tc_rabbitmq_platform_users

- name: Reconcile RabbitMQ virtual hosts and access
  when:
    - tc_rabbitmq_platform_state == 'present'
    - _tc_rabbitmq_platform_instance_id | length > 0
  ansible.builtin.include_tasks: virtual_host.yml
  loop: "{{ tc_rabbitmq_platform_virtual_hosts }}"
  loop_control:
    loop_var: _tc_rabbitmq_vhost
    label: "{{ _tc_rabbitmq_vhost.name }}"

- name: Remove RabbitMQ bindings permissions and virtual hosts
  when: tc_rabbitmq_platform_state == 'absent'
  ansible.builtin.include_tasks: teardown_virtual_host.yml
  loop: "{{ tc_rabbitmq_platform_virtual_hosts }}"
  loop_control:
    loop_var: _tc_rabbitmq_vhost
    label: "{{ _tc_rabbitmq_vhost.name }}"

- name: Remove RabbitMQ users
  when: tc_rabbitmq_platform_state == 'absent'
  susunola.tencentcloud.tdmq_rabbitmq_user:
    region: "{{ tc_rabbitmq_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_rabbitmq_platform_instance_id }}"
    name: "{{ item.name }}"
  loop: "{{ tc_rabbitmq_platform_users }}"
  loop_control: {label: "{{ item.name }}"}

- name: Disable RabbitMQ deletion protection and remove instance
  when: tc_rabbitmq_platform_state == 'absent'
  susunola.tencentcloud.tdmq_rabbitmq_instance:
    region: "{{ tc_rabbitmq_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_rabbitmq_platform_instance_id }}"
    deletion_protection: false
    international: "{{ tc_rabbitmq_platform_international }}"

- name: Publish RabbitMQ platform result
  when: tc_rabbitmq_platform_state == 'present'
  ansible.builtin.set_fact:
    tc_rabbitmq_platform_result:
      instance_id: "{{ _tc_rabbitmq_platform_instance_id }}"
      instance: "{{ _tc_rabbitmq_platform_instance.instance | default({}) }}"
      users: "{{ _tc_rabbitmq_platform_users | default({}) }}"
