---
- name: Resolve existing TKE cluster ID for teardown
  when:
    - tc_tke_platform_state == 'absent'
    - tc_tke_platform_cluster_id | length == 0
    - tc_tke_platform_name | length > 0
  ansible.builtin.set_fact:
    tc_tke_platform_cluster_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_tke_platform_name,
                resource_type='tke_cluster', region=tc_tke_platform_region) }}

- name: Validate TKE platform inputs
  ansible.builtin.assert:
    that:
      - tc_tke_platform_state in ['present', 'absent']
      - tc_tke_platform_cluster_id | length > 0 or tc_tke_platform_name | length > 0
      - tc_tke_platform_state == 'absent' or tc_tke_platform_cluster_id | length > 0 or tc_tke_platform_vpc_id | length > 0
      - not tc_tke_platform_authentication_enabled or tc_tke_platform_service_accounts | length > 0
      - not tc_tke_platform_authentication_enabled or tc_tke_platform_oidc | length > 0
      - tc_tke_platform_state == 'present' or (tc_tke_platform_node_pools | length == 0 and tc_tke_platform_endpoints | length == 0 and tc_tke_platform_addons | length == 0) or tc_tke_platform_cluster_id | length > 0
      - tc_tke_platform_state == 'present' or tc_tke_platform_tcr_internal_endpoints | length == 0 or tc_tke_platform_cluster_id | length > 0
    fail_msg: >-
      A cluster ID or name is required; creation also requires vpc_id.
      Authentication requires both service_accounts and oidc payloads.

- name: Provision TKE cluster
  when: tc_tke_platform_state == 'present'
  susunola.tencentcloud.tke_cluster:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: present
    cluster_id: "{{ tc_tke_platform_cluster_id | default(omit, true) }}"
    name: "{{ tc_tke_platform_name | default(omit, true) }}"
    vpc_id: "{{ tc_tke_platform_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_tke_platform_subnet_id | default(omit, true) }}"
    cluster_version: "{{ tc_tke_platform_cluster_version | default(omit, true) }}"
    cluster_desc: "{{ tc_tke_platform_cluster_desc | default(omit, true) }}"
    cluster_type: "{{ tc_tke_platform_cluster_type }}"
    cluster_cidr: "{{ tc_tke_platform_cluster_cidr | default(omit, true) }}"
    service_cidr: "{{ tc_tke_platform_service_cidr | default(omit, true) }}"
    max_node_pod_num: "{{ tc_tke_platform_max_node_pod_num | default(omit, true) }}"
    project_id: "{{ tc_tke_platform_project_id | default(omit, true) }}"
    deletion_protection: "{{ tc_tke_platform_deletion_protection }}"
    tags: "{{ tc_tke_platform_tags }}"
    waiter_timeout: "{{ tc_tke_platform_waiter_timeout }}"
    waiter_delay: "{{ tc_tke_platform_waiter_delay }}"
  register: _tc_tke_platform_cluster

- name: Resolve TKE cluster ID
  when: tc_tke_platform_state == 'present'
  ansible.builtin.set_fact:
    _tc_tke_platform_cluster_id: >-
      {{ tc_tke_platform_cluster_id
         or (_tc_tke_platform_cluster.cluster.ClusterId | default('')) }}

- name: Configure TKE authentication
  when:
    - tc_tke_platform_state == 'present'
    - _tc_tke_platform_cluster_id | length > 0
    - tc_tke_platform_authentication_enabled
  susunola.tencentcloud.tke_cluster_authentication:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    cluster_id: "{{ _tc_tke_platform_cluster_id }}"
    service_accounts: "{{ tc_tke_platform_service_accounts }}"
    oidc: "{{ tc_tke_platform_oidc }}"

- name: Connect private TCR registries before provisioning node pools
  when: tc_tke_platform_state == 'present'
  susunola.tencentcloud.tcr_internal_endpoint:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: present
    registry_id: "{{ item.registry_id }}"
    vpc_id: "{{ item.vpc_id }}"
    subnet_id: "{{ item.subnet_id }}"
  loop: "{{ tc_tke_platform_tcr_internal_endpoints }}"
  loop_control:
    label: "{{ item.registry_id }}/{{ item.vpc_id }}/{{ item.subnet_id }}"
  register: _tc_tke_platform_tcr_internal_endpoints

- name: Provision TKE node pools
  when:
    - tc_tke_platform_state == 'present'
    - _tc_tke_platform_cluster_id | length > 0
  susunola.tencentcloud.tke_node_pool:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: present
    cluster_id: "{{ _tc_tke_platform_cluster_id }}"
    name: "{{ item.name }}"
    launch_configuration_json: "{{ item.launch_configuration_json | default(omit) }}"
    autoscaling_group_json: "{{ item.autoscaling_group_json | default(omit) }}"
    enable_autoscale: "{{ item.enable_autoscale | default(omit) }}"
    min_nodes_num: "{{ item.min_nodes_num | default(omit) }}"
    max_nodes_num: "{{ item.max_nodes_num | default(omit) }}"
    labels: "{{ item.labels | default({}) }}"
    taints: "{{ item.taints | default([]) }}"
    node_pool_os: "{{ item.node_pool_os | default(omit) }}"
    deletion_protection: "{{ item.deletion_protection | default(false) }}"
    tags: "{{ item.tags | default(tc_tke_platform_tags) }}"
  loop: "{{ tc_tke_platform_node_pools }}"
  loop_control:
    label: "{{ item.name }}"
  register: _tc_tke_platform_node_pools

- name: Reconcile TKE cluster autoscaler
  when:
    - tc_tke_platform_state == 'present'
    - _tc_tke_platform_cluster_id | length > 0
    - tc_tke_platform_autoscaler | length > 0
  susunola.tencentcloud.tke_cluster_autoscaler:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    cluster_id: "{{ _tc_tke_platform_cluster_id }}"
    is_scale_down_enabled: "{{ tc_tke_platform_autoscaler.is_scale_down_enabled | default(omit) }}"
    expander: "{{ tc_tke_platform_autoscaler.expander | default(omit) }}"
    max_empty_bulk_delete: "{{ tc_tke_platform_autoscaler.max_empty_bulk_delete | default(omit) }}"
    scale_down_delay: "{{ tc_tke_platform_autoscaler.scale_down_delay | default(omit) }}"
    scale_down_unneeded_time: "{{ tc_tke_platform_autoscaler.scale_down_unneeded_time | default(omit) }}"
    scale_down_utilization_threshold: "{{ tc_tke_platform_autoscaler.scale_down_utilization_threshold | default(omit) }}"
    skip_nodes_with_local_storage: "{{ tc_tke_platform_autoscaler.skip_nodes_with_local_storage | default(omit) }}"
    skip_nodes_with_system_pods: "{{ tc_tke_platform_autoscaler.skip_nodes_with_system_pods | default(omit) }}"
    ignore_daemon_sets_utilization: "{{ tc_tke_platform_autoscaler.ignore_daemon_sets_utilization | default(omit) }}"
    ok_total_unready_count: "{{ tc_tke_platform_autoscaler.ok_total_unready_count | default(omit) }}"
    max_total_unready_percentage: "{{ tc_tke_platform_autoscaler.max_total_unready_percentage | default(omit) }}"
    scale_down_unready_time: "{{ tc_tke_platform_autoscaler.scale_down_unready_time | default(omit) }}"
    unregistered_node_removal_time: "{{ tc_tke_platform_autoscaler.unregistered_node_removal_time | default(omit) }}"
  register: _tc_tke_platform_autoscaler

- name: Provision TKE endpoints
  when:
    - tc_tke_platform_state == 'present'
    - _tc_tke_platform_cluster_id | length > 0
  susunola.tencentcloud.tke_cluster_endpoint:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: present
    cluster_id: "{{ _tc_tke_platform_cluster_id }}"
    access: "{{ item.access | default('private') }}"
    subnet_id: "{{ item.subnet_id | default(omit) }}"
    domain: "{{ item.domain | default(omit) }}"
    security_group_id: "{{ item.security_group_id | default(omit) }}"
    load_balancer_id: "{{ item.load_balancer_id | default(omit) }}"
    extensive_parameters: "{{ item.extensive_parameters | default(omit) }}"
  loop: "{{ tc_tke_platform_endpoints }}"
  loop_control:
    label: "{{ item.access | default('private') }}"
  register: _tc_tke_platform_endpoints

- name: Reconcile TKE addons
  when:
    - tc_tke_platform_state == 'present'
    - _tc_tke_platform_cluster_id | length > 0
  susunola.tencentcloud.tke_addon:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: present
    cluster_id: "{{ _tc_tke_platform_cluster_id }}"
    name: "{{ item.name }}"
    version: "{{ item.version | default(omit) }}"
    values: "{{ item.values | default(omit) }}"
    values_file: "{{ item.values_file | default(omit) }}"
    values_format: "{{ item.values_format | default('auto') }}"
    update_strategy: "{{ item.update_strategy | default('merge') }}"
    api_dry_run: "{{ item.api_dry_run | default(false) }}"
    allow_downgrade: "{{ item.allow_downgrade | default(false) }}"
    waiter_timeout: "{{ tc_tke_platform_waiter_timeout }}"
    waiter_delay: "{{ tc_tke_platform_waiter_delay }}"
  loop: "{{ tc_tke_platform_addons }}"
  loop_control:
    label: "{{ item.name }}"
  register: _tc_tke_platform_addons

- name: Enable TKE audit delivery
  when:
    - tc_tke_platform_state == 'present'
    - _tc_tke_platform_cluster_id | length > 0
    - tc_tke_platform_audit_enabled
  susunola.tencentcloud.tke_cluster_audit:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: enabled
    cluster_id: "{{ _tc_tke_platform_cluster_id }}"
    logset_id: "{{ tc_tke_platform_audit_logset_id | default(omit, true) }}"
    topic_id: "{{ tc_tke_platform_audit_topic_id | default(omit, true) }}"
    topic_region: "{{ tc_tke_platform_audit_topic_region | default(omit, true) }}"

- name: Reconcile TKE CLS log collection
  when:
    - tc_tke_platform_state == 'present'
    - _tc_tke_platform_cluster_id | length > 0
  susunola.tencentcloud.tke_cls_log_config:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: present
    cluster_id: "{{ _tc_tke_platform_cluster_id }}"
    cluster_type: "{{ item.cluster_type | default('tke') }}"
    log_config_name: "{{ item.name }}"
    log_config: "{{ item.log_config }}"
    logset_id: "{{ item.logset_id }}"
  loop: "{{ tc_tke_platform_cls_log_configs }}"
  loop_control:
    label: "{{ item.name }}"
  register: _tc_tke_platform_cls_log_configs

- name: Bind TKE cluster to Managed Prometheus
  when:
    - tc_tke_platform_state == 'present'
    - _tc_tke_platform_cluster_id | length > 0
    - tc_tke_platform_prometheus_instance_id | length > 0
  susunola.tencentcloud.monitor_prometheus_cluster_agent:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ tc_tke_platform_prometheus_instance_id }}"
    cluster_id: "{{ _tc_tke_platform_cluster_id }}"
    cluster_type: tke
    agent: "{{ tc_tke_platform_prometheus_agent }}"
  register: _tc_tke_platform_prometheus_agent

- name: Unbind TKE cluster from Managed Prometheus
  when:
    - tc_tke_platform_state == 'absent'
    - tc_tke_platform_prometheus_instance_id | length > 0
  susunola.tencentcloud.monitor_prometheus_cluster_agent:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_tke_platform_prometheus_instance_id }}"
    cluster_id: "{{ tc_tke_platform_cluster_id }}"
    cluster_type: tke

- name: Remove TKE CLS log collection
  when: tc_tke_platform_state == 'absent'
  susunola.tencentcloud.tke_cls_log_config:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: absent
    cluster_id: "{{ tc_tke_platform_cluster_id }}"
    cluster_type: "{{ item.cluster_type | default('tke') }}"
    log_config_name: "{{ item.name }}"
  loop: "{{ tc_tke_platform_cls_log_configs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove TKE addons
  when: tc_tke_platform_state == 'absent'
  susunola.tencentcloud.tke_addon:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: absent
    cluster_id: "{{ tc_tke_platform_cluster_id }}"
    name: "{{ item.name }}"
  loop: "{{ tc_tke_platform_addons }}"

- name: Remove TKE endpoints
  when: tc_tke_platform_state == 'absent'
  susunola.tencentcloud.tke_cluster_endpoint:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: absent
    cluster_id: "{{ tc_tke_platform_cluster_id }}"
    access: "{{ item.access | default('private') }}"
  loop: "{{ tc_tke_platform_endpoints }}"

- name: Remove TKE node pools
  when: tc_tke_platform_state == 'absent'
  susunola.tencentcloud.tke_node_pool:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: absent
    cluster_id: "{{ tc_tke_platform_cluster_id }}"
    name: "{{ item.name }}"
    keep_instance: "{{ item.keep_instance | default(false) }}"
  loop: "{{ tc_tke_platform_node_pools }}"

- name: Disconnect platform-owned private TCR registries after node pools
  when: tc_tke_platform_state == 'absent'
  susunola.tencentcloud.tcr_internal_endpoint:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: absent
    registry_id: "{{ item.registry_id }}"
    vpc_id: "{{ item.vpc_id }}"
    subnet_id: "{{ item.subnet_id }}"
  loop: "{{ tc_tke_platform_tcr_internal_endpoints }}"
  loop_control:
    label: "{{ item.registry_id }}/{{ item.vpc_id }}/{{ item.subnet_id }}"

- name: Remove TKE cluster
  when: tc_tke_platform_state == 'absent'
  susunola.tencentcloud.tke_cluster:
    region: "{{ tc_tke_platform_region | default(omit, true) }}"
    state: absent
    cluster_id: "{{ tc_tke_platform_cluster_id | default(omit, true) }}"
    name: "{{ tc_tke_platform_name | default(omit, true) }}"
    deletion_protection: false
    instance_delete_mode: "{{ tc_tke_platform_instance_delete_mode }}"

- name: Publish TKE platform result
  when: tc_tke_platform_state == 'present'
  ansible.builtin.set_fact:
    tc_tke_platform_result:
      cluster_id: "{{ _tc_tke_platform_cluster_id }}"
      cluster: "{{ _tc_tke_platform_cluster.cluster }}"
      node_pools: "{{ _tc_tke_platform_node_pools.results | default([]) }}"
      tcr_internal_endpoints: "{{ _tc_tke_platform_tcr_internal_endpoints.results | default([]) }}"
      autoscaler: "{{ _tc_tke_platform_autoscaler | default({}) }}"
      endpoints: "{{ _tc_tke_platform_endpoints.results | default([]) }}"
      addons: "{{ _tc_tke_platform_addons.results | default([]) }}"
      cls_log_configs: "{{ _tc_tke_platform_cls_log_configs.results | default([]) }}"
      prometheus_agent: "{{ _tc_tke_platform_prometheus_agent | default({}) }}"
