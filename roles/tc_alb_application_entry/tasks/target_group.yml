---
- name: Provision ALB target group
  when: tc_alb_application_entry_state == 'present'
  susunola.tencentcloud.alb_target_group:
    region: "{{ tc_alb_application_entry_region | default(omit, true) }}"
    state: present
    target_group_id: "{{ _tc_alb_target_group.target_group_id | default(omit, true) }}"
    name: "{{ _tc_alb_target_group.name }}"
    vpc_id: "{{ _tc_alb_target_group.vpc_id | default(tc_alb_application_entry_vpc_id) }}"
    target_type: "{{ _tc_alb_target_group.target_type | default('Instance') }}"
    protocol: "{{ _tc_alb_target_group.protocol | default('HTTP') }}"
    scheduler_algorithm: "{{ _tc_alb_target_group.scheduler_algorithm | default('wrr') }}"
    keepalive_enabled: "{{ _tc_alb_target_group.keepalive_enabled | default(false) }}"
    health_check: "{{ _tc_alb_target_group.health_check | default(omit) }}"
    sticky_session: "{{ _tc_alb_target_group.sticky_session | default(omit) }}"
    tags: "{{ _tc_alb_target_group.tags | default({}) }}"
  register: _tc_alb_target_group_result

- name: Resolve ALB target group ID
  when: tc_alb_application_entry_state == 'present'
  ansible.builtin.set_fact:
    _tc_alb_target_group_id: >-
      {{ _tc_alb_target_group.target_group_id | default('')
         or (_tc_alb_target_group_result.target_group.TargetGroupId | default('')) }}

- name: Reconcile ALB target group backends
  when: tc_alb_application_entry_state == 'present'
  susunola.tencentcloud.alb_target_group_targets:
    region: "{{ tc_alb_application_entry_region | default(omit, true) }}"
    target_group_id: "{{ _tc_alb_target_group_id }}"
    targets: "{{ _tc_alb_target_group.targets | default([]) }}"
    purge: "{{ _tc_alb_target_group.purge_targets | default(true) }}"

- name: Provision ALB listeners with target group forwarding
  when: tc_alb_application_entry_state == 'present'
  susunola.tencentcloud.alb_listener:
    region: "{{ tc_alb_application_entry_region | default(omit, true) }}"
    state: present
    load_balancer_id: "{{ _tc_alb_application_entry_load_balancer_id }}"
    listener_id: "{{ item.listener_id | default(omit, true) }}"
    name: "{{ item.name }}"
    port: "{{ item.port }}"
    protocol: "{{ item.protocol }}"
    default_actions: "{{ item.default_actions | default([{'Type': 'ForwardGroup', 'ForwardGroupConfig': {'TargetGroups': [{'TargetGroupId': _tc_alb_target_group_id, 'Weight': 100}]}}]) }}"
    certificate_ids: "{{ item.certificate_ids | default(omit) }}"
    ca_enabled: "{{ item.ca_enabled | default(false) }}"
    ca_certificate_ids: "{{ item.ca_certificate_ids | default(omit) }}"
    security_policy_id: "{{ item.security_policy_id | default(omit) }}"
    gzip_enabled: "{{ item.gzip_enabled | default(true) }}"
    http2_enabled: "{{ item.http2_enabled | default(omit) }}"
    idle_timeout: "{{ item.idle_timeout | default(15) }}"
    request_timeout: "{{ item.request_timeout | default(60) }}"
    x_forwarded_for: "{{ item.x_forwarded_for | default(omit) }}"
  loop: "{{ _tc_alb_target_group.listeners | default([]) }}"

- name: Remove ALB listeners before target group
  when: tc_alb_application_entry_state == 'absent'
  susunola.tencentcloud.alb_listener:
    region: "{{ tc_alb_application_entry_region | default(omit, true) }}"
    state: absent
    load_balancer_id: "{{ tc_alb_application_entry_load_balancer_id }}"
    listener_id: "{{ item.listener_id | default(omit, true) }}"
    port: "{{ item.port | default(omit) }}"
    protocol: "{{ item.protocol | default(omit) }}"
  loop: "{{ _tc_alb_target_group.listeners | default([]) }}"

- name: Remove ALB target group backends
  when: tc_alb_application_entry_state == 'absent'
  susunola.tencentcloud.alb_target_group_targets:
    region: "{{ tc_alb_application_entry_region | default(omit, true) }}"
    target_group_id: "{{ _tc_alb_target_group.target_group_id }}"
    targets: []
    purge: true

- name: Remove ALB target group
  when: tc_alb_application_entry_state == 'absent'
  susunola.tencentcloud.alb_target_group:
    region: "{{ tc_alb_application_entry_region | default(omit, true) }}"
    state: absent
    target_group_id: "{{ _tc_alb_target_group.target_group_id }}"
