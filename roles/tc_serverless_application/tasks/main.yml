---
- name: Validate serverless application inputs
  ansible.builtin.assert:
    that:
      - tc_serverless_application_state in ['present', 'absent']
      - tc_serverless_application_function_name | length > 0
      - not tc_serverless_application_api_gateway_enabled or tc_serverless_application_api_service_id | length > 0 or tc_serverless_application_api_service_name | length > 0
    fail_msg: function_name is required; API Gateway also requires a service ID or name.

- name: Provision SCF function
  when: tc_serverless_application_state == 'present'
  susunola.tencentcloud.scf_function:
    region: "{{ tc_serverless_application_region | default(omit, true) }}"
    state: present
    function_name: "{{ tc_serverless_application_function_name }}"
    namespace: "{{ tc_serverless_application_namespace }}"
    runtime: "{{ tc_serverless_application_runtime | default(omit, true) }}"
    handler: "{{ tc_serverless_application_handler | default(omit, true) }}"
    zip_file: "{{ tc_serverless_application_zip_file | default(omit, true) }}"
    cos_bucket_name: "{{ tc_serverless_application_cos_bucket_name | default(omit, true) }}"
    cos_object_name: "{{ tc_serverless_application_cos_object_name | default(omit, true) }}"
    cos_bucket_region: "{{ tc_serverless_application_cos_bucket_region | default(omit, true) }}"
    memory_size: "{{ tc_serverless_application_memory_size | default(omit, true) }}"
    execution_timeout: "{{ tc_serverless_application_execution_timeout | default(omit, true) }}"
    description: "{{ tc_serverless_application_description | default(omit, true) }}"
    environment: "{{ tc_serverless_application_environment }}"
    role: "{{ tc_serverless_application_role | default(omit, true) }}"
    vpc_id: "{{ tc_serverless_application_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_serverless_application_subnet_id | default(omit, true) }}"
  register: _tc_serverless_application_function

- name: Reconcile SCF aliases
  when: tc_serverless_application_state == 'present'
  susunola.tencentcloud.scf_alias:
    region: "{{ tc_serverless_application_region | default(omit, true) }}"
    state: present
    function_name: "{{ tc_serverless_application_function_name }}"
    namespace: "{{ tc_serverless_application_namespace }}"
    name: "{{ item.name }}"
    function_version: "{{ item.function_version }}"
    description: "{{ item.description | default(omit) }}"
  loop: "{{ tc_serverless_application_aliases }}"
  loop_control:
    label: "{{ item.name }}"
  register: _tc_serverless_application_aliases

- name: Reconcile SCF triggers
  when: tc_serverless_application_state == 'present'
  susunola.tencentcloud.scf_trigger:
    region: "{{ tc_serverless_application_region | default(omit, true) }}"
    state: present
    function_name: "{{ tc_serverless_application_function_name }}"
    namespace: "{{ tc_serverless_application_namespace }}"
    qualifier: "{{ item.qualifier | default('$LATEST') }}"
    name: "{{ item.name }}"
    trigger_type: "{{ item.trigger_type }}"
    trigger_desc: "{{ item.trigger_desc }}"
    enabled: "{{ item.enabled | default(true) }}"
    custom_argument: "{{ item.custom_argument | default(omit) }}"
    description: "{{ item.description | default('') }}"
    force_replace: "{{ item.force_replace | default(false) }}"
  loop: "{{ tc_serverless_application_triggers }}"
  loop_control:
    label: "{{ item.name }}"
  register: _tc_serverless_application_triggers

- name: Provision API Gateway service
  when:
    - tc_serverless_application_state == 'present'
    - tc_serverless_application_api_gateway_enabled
  susunola.tencentcloud.api_gateway_service:
    region: "{{ tc_serverless_application_region | default(omit, true) }}"
    state: present
    service_id: "{{ tc_serverless_application_api_service_id | default(omit, true) }}"
    name: "{{ tc_serverless_application_api_service_name | default(omit, true) }}"
    description: "{{ tc_serverless_application_api_service_description }}"
    protocol: "{{ tc_serverless_application_api_protocol }}"
    network_types: "{{ tc_serverless_application_api_network_types }}"
    vpc_id: "{{ tc_serverless_application_vpc_id | default(omit, true) }}"
  register: _tc_serverless_application_api_service

- name: Resolve API Gateway service ID
  when:
    - tc_serverless_application_state == 'present'
    - tc_serverless_application_api_gateway_enabled
  ansible.builtin.set_fact:
    _tc_serverless_application_api_service_id: >-
      {{ tc_serverless_application_api_service_id
         or (_tc_serverless_application_api_service.service.ServiceId | default('')) }}

- name: Reconcile API Gateway APIs
  when:
    - tc_serverless_application_state == 'present'
    - tc_serverless_application_api_gateway_enabled
    - _tc_serverless_application_api_service_id | length > 0
  susunola.tencentcloud.api_gateway_api:
    region: "{{ tc_serverless_application_region | default(omit, true) }}"
    state: present
    service_id: "{{ _tc_serverless_application_api_service_id }}"
    api_id: "{{ item.api_id | default(omit, true) }}"
    name: "{{ item.name }}"
    path: "{{ item.path | default('/') }}"
    method: "{{ item.method | default('ANY') }}"
    description: "{{ item.description | default('') }}"
    auth_type: "{{ item.auth_type | default('NONE') }}"
    service_type: "{{ item.service_type | default('MOCK') }}"
    service_timeout: "{{ item.service_timeout | default(15) }}"
    mock_response: "{{ item.mock_response | default('{}') }}"
    scf_function_name: >-
      {{ item.scf_function_name | default(
         tc_serverless_application_function_name if item.service_type | default('MOCK') == 'SCF' else omit) }}
    scf_function_namespace: "{{ item.scf_function_namespace | default(tc_serverless_application_namespace) }}"
    scf_function_qualifier: "{{ item.scf_function_qualifier | default(item.qualifier | default('$LATEST')) }}"
    scf_function_type: "{{ item.scf_function_type | default('EVENT') }}"
    scf_integrated_response: "{{ item.scf_integrated_response | default(false) }}"
    enable_cors: "{{ item.enable_cors | default(false) }}"
  loop: "{{ tc_serverless_application_apis }}"
  loop_control:
    label: "{{ item.method | default('ANY') }} {{ item.path | default('/') }}"
  register: _tc_serverless_application_apis

- name: Release API Gateway service
  when:
    - tc_serverless_application_state == 'present'
    - tc_serverless_application_api_gateway_enabled
    - _tc_serverless_application_api_service_id | length > 0
    - tc_serverless_application_apis | length > 0
  susunola.tencentcloud.api_gateway_service_release:
    region: "{{ tc_serverless_application_region | default(omit, true) }}"
    state: present
    service_id: "{{ _tc_serverless_application_api_service_id }}"
    environment: "{{ tc_serverless_application_api_release_environment }}"
    description: "{{ tc_serverless_application_api_release_description }}"
  register: _tc_serverless_application_release

- name: Remove SCF triggers
  when: tc_serverless_application_state == 'absent'
  susunola.tencentcloud.scf_trigger:
    region: "{{ tc_serverless_application_region | default(omit, true) }}"
    state: absent
    function_name: "{{ tc_serverless_application_function_name }}"
    namespace: "{{ tc_serverless_application_namespace }}"
    qualifier: "{{ item.qualifier | default('$LATEST') }}"
    name: "{{ item.name }}"
    trigger_type: "{{ item.trigger_type }}"
  loop: "{{ tc_serverless_application_triggers }}"

- name: Remove SCF aliases
  when: tc_serverless_application_state == 'absent'
  susunola.tencentcloud.scf_alias:
    region: "{{ tc_serverless_application_region | default(omit, true) }}"
    state: absent
    function_name: "{{ tc_serverless_application_function_name }}"
    namespace: "{{ tc_serverless_application_namespace }}"
    name: "{{ item.name }}"
  loop: "{{ tc_serverless_application_aliases }}"

- name: Remove SCF function
  when: tc_serverless_application_state == 'absent'
  susunola.tencentcloud.scf_function:
    region: "{{ tc_serverless_application_region | default(omit, true) }}"
    state: absent
    function_name: "{{ tc_serverless_application_function_name }}"
    namespace: "{{ tc_serverless_application_namespace }}"

- name: Publish serverless application result
  when: tc_serverless_application_state == 'present'
  ansible.builtin.set_fact:
    tc_serverless_application_result:
      function: "{{ _tc_serverless_application_function.function }}"
      aliases: "{{ _tc_serverless_application_aliases.results | default([]) }}"
      triggers: "{{ _tc_serverless_application_triggers.results | default([]) }}"
      api_service_id: "{{ _tc_serverless_application_api_service_id | default('') }}"
      apis: "{{ _tc_serverless_application_apis.results | default([]) }}"
      release: "{{ _tc_serverless_application_release | default({}) }}"
