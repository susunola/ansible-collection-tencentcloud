---
- name: Validate DLC access-governance inputs
  ansible.builtin.assert:
    that:
      - tc_dlc_access_governance_state in ['present', 'absent']
      - >-
        tc_dlc_access_governance_inference_models | map(attribute='name') | unique | list | length
        == tc_dlc_access_governance_inference_models | length
      - >-
        tc_dlc_access_governance_inference_services | map(attribute='name') | unique | list | length
        == tc_dlc_access_governance_inference_services | length
      - >-
        tc_dlc_access_governance_cluster_groups | map(attribute='name') | unique | list | length
        == tc_dlc_access_governance_cluster_groups | length
      - >-
        tc_dlc_access_governance_resource_configs | map(attribute='name') | unique | list | length
        == tc_dlc_access_governance_resource_configs | length
      - >-
        tc_dlc_access_governance_ray_clusters | map(attribute='name') | unique | list | length
        == tc_dlc_access_governance_ray_clusters | length
      - tc_dlc_access_governance_state == 'present' or tc_dlc_access_governance_inference_models | length == 0
      - tc_dlc_access_governance_state == 'present' or tc_dlc_access_governance_model_versions | length == 0
      - tc_dlc_access_governance_state == 'present' or tc_dlc_access_governance_model_artifact_checks | length == 0
      - tc_dlc_access_governance_state == 'present' or tc_dlc_access_governance_inference_services | length == 0
      - tc_dlc_access_governance_state == 'present' or tc_dlc_access_governance_store_location | length == 0
      - tc_dlc_access_governance_state == 'present' or tc_dlc_access_governance_data_engine_configs | length == 0
      - tc_dlc_access_governance_state == 'present' or tc_dlc_access_governance_network_connections | length == 0
      - >-
        tc_dlc_access_governance_state == 'present'
        or (tc_dlc_access_governance_work_groups
            | map(attribute='work_group')
            | selectattr('work_group_id', 'defined')
            | list | length == tc_dlc_access_governance_work_groups | length)
      - >-
        tc_dlc_access_governance_state == 'present'
        or (tc_dlc_access_governance_vpc_connections
            | selectattr('endpoint_id', 'defined')
            | list | length == tc_dlc_access_governance_vpc_connections | length)
      - >-
        tc_dlc_access_governance_state == 'present'
        or (tc_dlc_access_governance_users
            | map(attribute='user')
            | selectattr('user_id', 'defined')
            | list | length == tc_dlc_access_governance_users | length)
      - >-
        tc_dlc_access_governance_state == 'present'
        or (tc_dlc_access_governance_data_mask_strategies
            | selectattr('strategy_id', 'defined')
            | list | length == tc_dlc_access_governance_data_mask_strategies | length)
    fail_msg: DLC teardown requires exact identities and cannot remove inference models because the service exposes no deletion API.

- name: Initialize DLC managed-resource identity maps
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_vpc_endpoint_ids: {}
    _tc_dlc_data_engine_ids: {}
    _tc_dlc_data_engine_config_ids: []
    _tc_dlc_network_connection_names: []
    _tc_dlc_notebook_session_ids: {}
    _tc_dlc_engine_resource_group_ids: {}
    _tc_dlc_cluster_group_ids: {}
    _tc_dlc_partition_queue_ids: {}
    _tc_dlc_resource_config_ids: {}
    _tc_dlc_ray_cluster_ids: {}
    _tc_dlc_job_spec_ids: {}
    _tc_dlc_inference_model_uids: {}
    _tc_dlc_model_version_ids: []
    _tc_dlc_model_artifacts: []
    _tc_dlc_inference_service_ids: {}
    _tc_dlc_lab_ids: {}
    _tc_dlc_spark_job_ids: {}
    _tc_dlc_database_names: []
    _tc_dlc_table_names: []
    _tc_dlc_table_partition_identities: []
    _tc_dlc_script_ids: {}
    _tc_dlc_user_ids: []
    _tc_dlc_work_group_ids: {}
    _tc_dlc_udf_policy_identities: []
    _tc_dlc_data_mask_strategy_ids: {}

- name: Configure DLC query-result storage before data and compute resources
  when:
    - tc_dlc_access_governance_state == 'present'
    - tc_dlc_access_governance_store_location | length > 0
  susunola.tencentcloud.dlc_store_location:
  args: "{{ tc_dlc_access_governance_store_location }}"
  register: _tc_dlc_store_location_result

- name: Reconcile DLC VPC connections before compute engines
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.include_tasks: vpc_connection.yml
  loop: "{{ tc_dlc_access_governance_vpc_connections }}"
  loop_control:
    loop_var: _tc_dlc_connection
    label: "{{ _tc_dlc_connection.endpoint_name }}"

- name: Reconcile DLC data engines before access policies
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.include_tasks: data_engine.yml
  loop: "{{ tc_dlc_access_governance_data_engines }}"
  loop_control:
    loop_var: _tc_dlc_engine
    label: "{{ _tc_dlc_engine.name }}"

- name: Reconcile DLC engine runtime configurations after parent engines
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_data_engine_config:
  args: "{{ _tc_dlc_engine_config }}"
  loop: "{{ tc_dlc_access_governance_data_engine_configs }}"
  loop_control:
    loop_var: _tc_dlc_engine_config
    label: "{{ _tc_dlc_engine_config.engine_name | default(_tc_dlc_engine_config.engine_id) }}"
  register: _tc_dlc_engine_config_results

- name: Record configured DLC engine identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_data_engine_config_ids: "{{ _tc_dlc_engine_config_results.results | map(attribute='engine_id') | list }}"

- name: Reconcile existing DLC network-connection metadata after engines
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_network_connection:
  args: "{{ _tc_dlc_network_connection }}"
  loop: "{{ tc_dlc_access_governance_network_connections }}"
  loop_control:
    loop_var: _tc_dlc_network_connection
    label: "{{ _tc_dlc_network_connection.name }}"

- name: Record managed DLC network-connection names
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_network_connection_names: "{{ tc_dlc_access_governance_network_connections | map(attribute='name') | list }}"

- name: Reconcile DLC Notebook sessions after engine configuration
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_notebook_session:
  args: "{{ _tc_dlc_notebook | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_notebook_sessions }}"
  loop_control:
    loop_var: _tc_dlc_notebook
    label: "{{ _tc_dlc_notebook.name | default(_tc_dlc_notebook.session_id) }}"
  register: _tc_dlc_notebook_results

- name: Record DLC Notebook session identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_notebook_session_ids: >-
      {{ dict((tc_dlc_access_governance_notebook_sessions | map(attribute='name') | list)
              | zip(_tc_dlc_notebook_results.results | map(attribute='session_id') | list)) }}

- name: Reconcile DLC engine resource groups after parent engines
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_engine_resource_group:
  args: "{{ _tc_dlc_resource_group | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_engine_resource_groups }}"
  loop_control:
    loop_var: _tc_dlc_resource_group
    label: "{{ _tc_dlc_resource_group.name }}"
  register: _tc_dlc_resource_group_results

- name: Record DLC engine resource-group identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_engine_resource_group_ids: >-
      {{ dict((tc_dlc_access_governance_engine_resource_groups | map(attribute='name') | list)
              | zip(_tc_dlc_resource_group_results.results | map(attribute='resource_group_id') | list)) }}

- name: Reconcile DLC partition queues before laboratories
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_partition_queue:
  args: "{{ _tc_dlc_queue | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_partition_queues }}"
  loop_control:
    loop_var: _tc_dlc_queue
    label: "{{ _tc_dlc_queue.partition_code }}/{{ _tc_dlc_queue.name }}"
  register: _tc_dlc_queue_results

- name: Record DLC partition queue identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_partition_queue_ids: >-
      {{ dict((tc_dlc_access_governance_partition_queues | map(attribute='name') | list)
              | zip(_tc_dlc_queue_results.results | map(attribute='queue_id') | list)) }}

- name: Reconcile DLC cluster groups before dependent compute workloads
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_cluster_group:
  args: "{{ _tc_dlc_cluster_group | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_cluster_groups }}"
  loop_control:
    loop_var: _tc_dlc_cluster_group
    label: "{{ _tc_dlc_cluster_group.name }}"
  register: _tc_dlc_cluster_group_results

- name: Record DLC cluster-group identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_cluster_group_ids: >-
      {{ dict((tc_dlc_access_governance_cluster_groups | map(attribute='name') | list)
              | zip(_tc_dlc_cluster_group_results.results | map(attribute='cluster_group_id') | list)) }}

- name: Reconcile DLC resource templates before laboratories
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_resource_config:
  args: "{{ _tc_dlc_config | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_resource_configs }}"
  loop_control:
    loop_var: _tc_dlc_config
    label: "{{ _tc_dlc_config.name }}"
  register: _tc_dlc_config_results

- name: Record DLC resource-template identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_resource_config_ids: >-
      {{ dict((tc_dlc_access_governance_resource_configs | map(attribute='name') | list)
              | zip(_tc_dlc_config_results.results | map(attribute='resource_config_id') | list)) }}

- name: Validate DLC Ray cluster parent references
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.assert:
    that:
      - not (_tc_dlc_ray.group_id is defined and _tc_dlc_ray.group_name is defined)
      - _tc_dlc_ray.group_name is not defined or _tc_dlc_ray.group_name in _tc_dlc_cluster_group_ids
      - not (_tc_dlc_ray.resource_config_id is defined and _tc_dlc_ray.resource_config_name is defined)
      - >-
        not (_tc_dlc_ray.resource_config is defined
             and (_tc_dlc_ray.resource_config_id is defined
                  or _tc_dlc_ray.resource_config_name is defined))
      - >-
        _tc_dlc_ray.resource_config_name is not defined
        or _tc_dlc_ray.resource_config_name in _tc_dlc_resource_config_ids
    fail_msg: DLC Ray cluster references must use one valid managed name or direct ID per parent resource.
  loop: "{{ tc_dlc_access_governance_ray_clusters }}"
  loop_control:
    loop_var: _tc_dlc_ray
    label: "{{ _tc_dlc_ray.name }}"

- name: Reconcile DLC Ray clusters after queues and resource templates
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_ray_cluster:
  args: >-
    {{ _tc_dlc_ray
       | combine({'state': 'present',
                  'group_id': _tc_dlc_resolved_ray_group_id,
                  'group_name': omit,
                  'resource_config_id': _tc_dlc_resolved_ray_config_id,
                  'resource_config_name': omit}) }}
  loop: "{{ tc_dlc_access_governance_ray_clusters }}"
  loop_control:
    loop_var: _tc_dlc_ray
    label: "{{ _tc_dlc_ray.name }}"
  vars:
    _tc_dlc_resolved_ray_group_id: >-
      {{ _tc_dlc_ray.group_id
         if _tc_dlc_ray.group_id is defined
         else (_tc_dlc_cluster_group_ids[_tc_dlc_ray.group_name]
               if _tc_dlc_ray.group_name is defined else omit) }}
    _tc_dlc_resolved_ray_config_id: >-
      {{ _tc_dlc_ray.resource_config_id
         if _tc_dlc_ray.resource_config_id is defined
         else (_tc_dlc_resource_config_ids[_tc_dlc_ray.resource_config_name]
               if _tc_dlc_ray.resource_config_name is defined else omit) }}
  register: _tc_dlc_ray_results

- name: Record DLC Ray cluster identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_ray_cluster_ids: >-
      {{ dict((tc_dlc_access_governance_ray_clusters | map(attribute='name') | list)
              | zip(_tc_dlc_ray_results.results | map(attribute='ray_cluster_id') | list)) }}

- name: Validate DLC job-specification parent references
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.assert:
    that:
      - not (_tc_dlc_job_spec.group_id is defined and _tc_dlc_job_spec.group_name is defined)
      - not (_tc_dlc_job_spec.cluster_id is defined and _tc_dlc_job_spec.cluster_name is defined)
      - >-
        not ((_tc_dlc_job_spec.group_id is defined or _tc_dlc_job_spec.group_name is defined)
             and (_tc_dlc_job_spec.cluster_id is defined or _tc_dlc_job_spec.cluster_name is defined))
      - _tc_dlc_job_spec.group_name is not defined or _tc_dlc_job_spec.group_name in _tc_dlc_cluster_group_ids
      - _tc_dlc_job_spec.cluster_name is not defined or _tc_dlc_job_spec.cluster_name in _tc_dlc_ray_cluster_ids
      - not (_tc_dlc_job_spec.resource_config_id is defined and _tc_dlc_job_spec.resource_config_name is defined)
      - >-
        not (_tc_dlc_job_spec.resource_config is defined
             and (_tc_dlc_job_spec.resource_config_id is defined
                  or _tc_dlc_job_spec.resource_config_name is defined))
      - >-
        _tc_dlc_job_spec.resource_config_name is not defined
        or _tc_dlc_job_spec.resource_config_name in _tc_dlc_resource_config_ids
    fail_msg: DLC job specifications require one valid compute target and at most one resource-configuration source.
  loop: "{{ tc_dlc_access_governance_job_specs }}"
  loop_control:
    loop_var: _tc_dlc_job_spec
    label: "{{ _tc_dlc_job_spec.name }}"

- name: Reconcile DLC job specifications after compute targets
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_job_spec:
  args: >-
    {{ _tc_dlc_job_spec
       | combine({'state': 'present',
                  'group_id': _tc_dlc_resolved_job_group_id,
                  'group_name': omit,
                  'cluster_id': _tc_dlc_resolved_job_cluster_id,
                  'cluster_name': omit,
                  'resource_config_id': _tc_dlc_resolved_job_config_id,
                  'resource_config_name': omit}) }}
  loop: "{{ tc_dlc_access_governance_job_specs }}"
  loop_control:
    loop_var: _tc_dlc_job_spec
    label: "{{ _tc_dlc_job_spec.name }}"
  vars:
    _tc_dlc_resolved_job_group_id: >-
      {{ _tc_dlc_job_spec.group_id
         if _tc_dlc_job_spec.group_id is defined
         else (_tc_dlc_cluster_group_ids[_tc_dlc_job_spec.group_name]
               if _tc_dlc_job_spec.group_name is defined else omit) }}
    _tc_dlc_resolved_job_cluster_id: >-
      {{ _tc_dlc_job_spec.cluster_id
         if _tc_dlc_job_spec.cluster_id is defined
         else (_tc_dlc_ray_cluster_ids[_tc_dlc_job_spec.cluster_name]
               if _tc_dlc_job_spec.cluster_name is defined else omit) }}
    _tc_dlc_resolved_job_config_id: >-
      {{ _tc_dlc_job_spec.resource_config_id
         if _tc_dlc_job_spec.resource_config_id is defined
         else (_tc_dlc_resource_config_ids[_tc_dlc_job_spec.resource_config_name]
               if _tc_dlc_job_spec.resource_config_name is defined else omit) }}
  register: _tc_dlc_job_spec_results

- name: Record DLC job-specification identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_job_spec_ids: >-
      {{ dict((tc_dlc_access_governance_job_specs | map(attribute='name') | list)
              | zip(_tc_dlc_job_spec_results.results | map(attribute='job_spec_id') | list)) }}

- name: Validate DLC laboratory parent references
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.assert:
    that:
      - not (_tc_dlc_lab.group_id is defined and _tc_dlc_lab.group_name is defined)
      - _tc_dlc_lab.group_name is not defined or _tc_dlc_lab.group_name in _tc_dlc_cluster_group_ids
      - not (_tc_dlc_lab.resource_config_id is defined and _tc_dlc_lab.resource_config_name is defined)
      - >-
        not (_tc_dlc_lab.resource_config is defined
             and (_tc_dlc_lab.resource_config_id is defined
                  or _tc_dlc_lab.resource_config_name is defined))
      - >-
        _tc_dlc_lab.resource_config_name is not defined
        or _tc_dlc_lab.resource_config_name in _tc_dlc_resource_config_ids
    fail_msg: DLC laboratory references must use one valid managed name or direct ID per parent resource.
  loop: "{{ tc_dlc_access_governance_labs }}"
  loop_control:
    loop_var: _tc_dlc_lab
    label: "{{ _tc_dlc_lab.name }}"

- name: Reconcile DLC laboratories after queues and resource templates
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_lab:
  args: >-
    {{ _tc_dlc_lab
       | combine({'state': 'present',
                  'group_id': _tc_dlc_resolved_lab_group_id,
                  'group_name': omit,
                  'resource_config_id': _tc_dlc_resolved_lab_config_id,
                  'resource_config_name': omit}) }}
  loop: "{{ tc_dlc_access_governance_labs }}"
  loop_control:
    loop_var: _tc_dlc_lab
    label: "{{ _tc_dlc_lab.name }}"
  vars:
    _tc_dlc_resolved_lab_group_id: >-
      {{ _tc_dlc_lab.group_id
         if _tc_dlc_lab.group_id is defined
         else (_tc_dlc_cluster_group_ids[_tc_dlc_lab.group_name]
               if _tc_dlc_lab.group_name is defined else omit) }}
    _tc_dlc_resolved_lab_config_id: >-
      {{ _tc_dlc_lab.resource_config_id
         if _tc_dlc_lab.resource_config_id is defined
         else (_tc_dlc_resource_config_ids[_tc_dlc_lab.resource_config_name]
               if _tc_dlc_lab.resource_config_name is defined else omit) }}
  register: _tc_dlc_lab_results

- name: Record DLC laboratory identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_lab_ids: >-
      {{ dict((tc_dlc_access_governance_labs | map(attribute='name') | list)
              | zip(_tc_dlc_lab_results.results | map(attribute='lab_id') | list)) }}

- name: Reconcile DLC inference models before inference versions and services
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_inference_model:
  args: "{{ _tc_dlc_inference_model }}"
  loop: "{{ tc_dlc_access_governance_inference_models }}"
  loop_control:
    loop_var: _tc_dlc_inference_model
    label: "{{ _tc_dlc_inference_model.name }}"
  register: _tc_dlc_inference_model_results

- name: Record DLC inference-model identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_inference_model_uids: >-
      {{ dict((tc_dlc_access_governance_inference_models | map(attribute='name') | list)
              | zip(_tc_dlc_inference_model_results.results | map(attribute='model_uid') | list)) }}

- name: Validate DLC model-version parent references
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.assert:
    that:
      - (_tc_dlc_model_version.model_uid is defined) != (_tc_dlc_model_version.model_name is defined)
      - >-
        _tc_dlc_model_version.model_name is not defined
        or _tc_dlc_model_version.model_name in _tc_dlc_inference_model_uids
    fail_msg: Each DLC model version requires exactly one model_uid or managed model_name reference.
  loop: "{{ tc_dlc_access_governance_model_versions }}"
  loop_control:
    loop_var: _tc_dlc_model_version
    label: "{{ _tc_dlc_model_version.version }}"

- name: Publish DLC model versions after parent inference models
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_model_version:
  args: >-
    {{ _tc_dlc_model_version
       | combine({'model_uid': _tc_dlc_resolved_model_uid,
                  'model_name': omit}) }}
  loop: "{{ tc_dlc_access_governance_model_versions }}"
  loop_control:
    loop_var: _tc_dlc_model_version
    label: "{{ _tc_dlc_model_version.model_uid | default(_tc_dlc_model_version.model_name) }}/{{ _tc_dlc_model_version.version }}"
  vars:
    _tc_dlc_resolved_model_uid: >-
      {{ _tc_dlc_model_version.model_uid
         if _tc_dlc_model_version.model_uid is defined
         else _tc_dlc_inference_model_uids[_tc_dlc_model_version.model_name] }}
  register: _tc_dlc_model_version_results

- name: Record DLC model-version identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_model_version_ids: >-
      {{ _tc_dlc_model_version_results.results | map(attribute='version_id') | list }}

- name: Validate DLC model-artifact parent references
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.assert:
    that:
      - (_tc_dlc_model_artifact_check.model_uid is defined) != (_tc_dlc_model_artifact_check.model_name is defined)
      - _tc_dlc_model_artifact_check.model_version is defined
      - >-
        _tc_dlc_model_artifact_check.model_name is not defined
        or _tc_dlc_model_artifact_check.model_name in _tc_dlc_inference_model_uids
    fail_msg: Each DLC model-artifact check requires a model version and exactly one model_uid or managed model_name reference.
  loop: "{{ tc_dlc_access_governance_model_artifact_checks }}"
  loop_control:
    loop_var: _tc_dlc_model_artifact_check
    label: "{{ _tc_dlc_model_artifact_check.model_uid | default(_tc_dlc_model_artifact_check.model_name) }}/{{ _tc_dlc_model_artifact_check.model_version }}"

- name: Inspect DLC model artifacts before inference-service deployment
