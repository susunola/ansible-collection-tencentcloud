- name: Publish DLC access-governance result
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    tc_dlc_access_governance_result:
      vpc_endpoint_ids: "{{ _tc_dlc_vpc_endpoint_ids }}"
      data_engine_ids: "{{ _tc_dlc_data_engine_ids }}"
      engine_resource_group_ids: "{{ _tc_dlc_engine_resource_group_ids }}"
      cluster_group_ids: "{{ _tc_dlc_cluster_group_ids }}"
      partition_queue_ids: "{{ _tc_dlc_partition_queue_ids }}"
      resource_config_ids: "{{ _tc_dlc_resource_config_ids }}"
      ray_cluster_ids: "{{ _tc_dlc_ray_cluster_ids }}"
      job_spec_ids: "{{ _tc_dlc_job_spec_ids }}"
      lab_ids: "{{ _tc_dlc_lab_ids }}"
      spark_job_ids: "{{ _tc_dlc_spark_job_ids }}"
      database_names: "{{ _tc_dlc_database_names }}"
      script_ids: "{{ _tc_dlc_script_ids }}"
      user_ids: "{{ _tc_dlc_user_ids }}"
      work_group_ids: "{{ _tc_dlc_work_group_ids }}"
      data_mask_strategy_ids: "{{ _tc_dlc_data_mask_strategy_ids }}"
