---
- name: Validate DLC access-governance inputs
  ansible.builtin.assert:
    that:
      - tc_dlc_access_governance_state in ['present', 'absent']
      - >-
        tc_dlc_access_governance_state == 'present'
        or (tc_dlc_access_governance_work_groups
            | map(attribute='work_group')
            | selectattr('work_group_id', 'defined')
            | list | length == tc_dlc_access_governance_work_groups | length)
      - >-
        tc_dlc_access_governance_state == 'present'
        or (tc_dlc_access_governance_vpc_connections
            | selectattr('endpoint_id', 'defined')
            | list | length == tc_dlc_access_governance_vpc_connections | length)
      - >-
        tc_dlc_access_governance_state == 'present'
        or (tc_dlc_access_governance_users
            | map(attribute='user')
            | selectattr('user_id', 'defined')
            | list | length == tc_dlc_access_governance_users | length)
      - >-
        tc_dlc_access_governance_state == 'present'
        or (tc_dlc_access_governance_data_mask_strategies
            | selectattr('strategy_id', 'defined')
            | list | length == tc_dlc_access_governance_data_mask_strategies | length)
    fail_msg: DLC teardown requires exact work_group_id, user_id, strategy_id and endpoint_id identities for declared resources.

- name: Initialize DLC managed-resource identity maps
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_vpc_endpoint_ids: {}
    _tc_dlc_data_engine_ids: {}
    _tc_dlc_engine_resource_group_ids: {}
    _tc_dlc_cluster_group_ids: {}
    _tc_dlc_partition_queue_ids: {}
    _tc_dlc_resource_config_ids: {}
    _tc_dlc_ray_cluster_ids: {}
    _tc_dlc_job_spec_ids: {}
    _tc_dlc_lab_ids: {}
    _tc_dlc_spark_job_ids: {}
    _tc_dlc_database_names: []
    _tc_dlc_script_ids: {}
    _tc_dlc_user_ids: []
    _tc_dlc_work_group_ids: {}
    _tc_dlc_data_mask_strategy_ids: {}

- name: Reconcile DLC VPC connections before compute engines
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.include_tasks: vpc_connection.yml
  loop: "{{ tc_dlc_access_governance_vpc_connections }}"
  loop_control:
    loop_var: _tc_dlc_connection
    label: "{{ _tc_dlc_connection.endpoint_name }}"

- name: Reconcile DLC data engines before access policies
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.include_tasks: data_engine.yml
  loop: "{{ tc_dlc_access_governance_data_engines }}"
  loop_control:
    loop_var: _tc_dlc_engine
    label: "{{ _tc_dlc_engine.name }}"

- name: Reconcile DLC engine resource groups after parent engines
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_engine_resource_group:
  args: "{{ _tc_dlc_resource_group | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_engine_resource_groups }}"
  loop_control:
    loop_var: _tc_dlc_resource_group
    label: "{{ _tc_dlc_resource_group.name }}"
  register: _tc_dlc_resource_group_results

- name: Record DLC engine resource-group identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_engine_resource_group_ids: >-
      {{ dict((tc_dlc_access_governance_engine_resource_groups | map(attribute='name') | list)
              | zip(_tc_dlc_resource_group_results.results | map(attribute='resource_group_id') | list)) }}

- name: Reconcile DLC partition queues before laboratories
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_partition_queue:
  args: "{{ _tc_dlc_queue | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_partition_queues }}"
  loop_control:
    loop_var: _tc_dlc_queue
    label: "{{ _tc_dlc_queue.partition_code }}/{{ _tc_dlc_queue.name }}"
  register: _tc_dlc_queue_results

- name: Record DLC partition queue identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_partition_queue_ids: >-
      {{ dict((tc_dlc_access_governance_partition_queues | map(attribute='name') | list)
              | zip(_tc_dlc_queue_results.results | map(attribute='queue_id') | list)) }}

- name: Reconcile DLC cluster groups before dependent compute workloads
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_cluster_group:
  args: "{{ _tc_dlc_cluster_group | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_cluster_groups }}"
  loop_control:
    loop_var: _tc_dlc_cluster_group
    label: "{{ _tc_dlc_cluster_group.name }}"
  register: _tc_dlc_cluster_group_results

- name: Record DLC cluster-group identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_cluster_group_ids: >-
      {{ dict((tc_dlc_access_governance_cluster_groups | map(attribute='name') | list)
              | zip(_tc_dlc_cluster_group_results.results | map(attribute='cluster_group_id') | list)) }}

- name: Reconcile DLC resource templates before laboratories
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_resource_config:
  args: "{{ _tc_dlc_config | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_resource_configs }}"
  loop_control:
    loop_var: _tc_dlc_config
    label: "{{ _tc_dlc_config.name }}"
  register: _tc_dlc_config_results

- name: Record DLC resource-template identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_resource_config_ids: >-
      {{ dict((tc_dlc_access_governance_resource_configs | map(attribute='name') | list)
              | zip(_tc_dlc_config_results.results | map(attribute='resource_config_id') | list)) }}

- name: Reconcile DLC Ray clusters after queues and resource templates
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_ray_cluster:
  args: "{{ _tc_dlc_ray | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_ray_clusters }}"
  loop_control:
    loop_var: _tc_dlc_ray
    label: "{{ _tc_dlc_ray.name }}"
  register: _tc_dlc_ray_results

- name: Record DLC Ray cluster identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_ray_cluster_ids: >-
      {{ dict((tc_dlc_access_governance_ray_clusters | map(attribute='name') | list)
              | zip(_tc_dlc_ray_results.results | map(attribute='ray_cluster_id') | list)) }}

- name: Reconcile DLC job specifications after compute targets
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_job_spec:
  args: "{{ _tc_dlc_job_spec | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_job_specs }}"
  loop_control:
    loop_var: _tc_dlc_job_spec
    label: "{{ _tc_dlc_job_spec.name }}"
  register: _tc_dlc_job_spec_results

- name: Record DLC job-specification identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_job_spec_ids: >-
      {{ dict((tc_dlc_access_governance_job_specs | map(attribute='name') | list)
              | zip(_tc_dlc_job_spec_results.results | map(attribute='job_spec_id') | list)) }}

- name: Reconcile DLC laboratories after queues and resource templates
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_lab:
  args: "{{ _tc_dlc_lab | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_labs }}"
  loop_control:
    loop_var: _tc_dlc_lab
    label: "{{ _tc_dlc_lab.name }}"
  register: _tc_dlc_lab_results

- name: Record DLC laboratory identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_lab_ids: >-
      {{ dict((tc_dlc_access_governance_labs | map(attribute='name') | list)
              | zip(_tc_dlc_lab_results.results | map(attribute='lab_id') | list)) }}

- name: Reconcile DLC Spark job definitions after compute resources
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_spark_job:
  args: "{{ _tc_dlc_spark_job | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_spark_jobs }}"
  loop_control:
    loop_var: _tc_dlc_spark_job
    label: "{{ _tc_dlc_spark_job.name }}"
  register: _tc_dlc_spark_job_results

- name: Record DLC Spark job identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_spark_job_ids: >-
      {{ dict((tc_dlc_access_governance_spark_jobs | map(attribute='name') | list)
              | zip(_tc_dlc_spark_job_results.results | map(attribute='spark_job_id') | list)) }}

- name: Reconcile DLC databases before access policies
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_database:
  args: "{{ _tc_dlc_database | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_databases }}"
  loop_control:
    loop_var: _tc_dlc_database
    label: "{{ _tc_dlc_database.name }}"
  register: _tc_dlc_database_results

- name: Record DLC database identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_database_names: "{{ tc_dlc_access_governance_databases | map(attribute='name') | list }}"

- name: Reconcile DLC saved scripts after databases
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_script:
  args: "{{ _tc_dlc_script | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_scripts }}"
  loop_control:
    loop_var: _tc_dlc_script
    label: "{{ _tc_dlc_script.name }}"
  register: _tc_dlc_script_results

- name: Record DLC saved-script identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_script_ids: >-
      {{ dict((tc_dlc_access_governance_scripts | map(attribute='name') | list)
              | zip(_tc_dlc_script_results.results | map(attribute='script_id') | list)) }}

- name: Reconcile DLC users before work-group membership
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.include_tasks: user.yml
  loop: "{{ tc_dlc_access_governance_users }}"
  loop_control:
    loop_var: _tc_dlc_user
    label: "{{ _tc_dlc_user.user.user_id }}"

- name: Record DLC user identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_user_ids: "{{ tc_dlc_access_governance_users | map(attribute='user') | map(attribute='user_id') | list }}"

- name: Reconcile DLC work groups, members and policies
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.include_tasks: work_group.yml
  loop: "{{ tc_dlc_access_governance_work_groups }}"
  loop_control:
    loop_var: _tc_dlc_group
    label: "{{ _tc_dlc_group.work_group.name }}"

- name: Reconcile DLC data masking after users and work groups
  when: tc_dlc_access_governance_state == 'present'
  susunola.tencentcloud.dlc_data_mask_strategy:
  args: "{{ _tc_dlc_mask | combine({'state': 'present'}) }}"
  loop: "{{ tc_dlc_access_governance_data_mask_strategies }}"
  loop_control:
    loop_var: _tc_dlc_mask
    label: "{{ _tc_dlc_mask.name }}"
  register: _tc_dlc_mask_results

- name: Record DLC data-mask strategy identities
  when: tc_dlc_access_governance_state == 'present'
  ansible.builtin.set_fact:
    _tc_dlc_data_mask_strategy_ids: >-
      {{ dict((tc_dlc_access_governance_data_mask_strategies | map(attribute='name') | list)
              | zip(_tc_dlc_mask_results.results | map(attribute='strategy_id') | list)) }}

- name: Require explicit authorization before DLC governance teardown
  when:
    - tc_dlc_access_governance_state == 'absent'
    - not tc_dlc_access_governance_allow_destroy | bool
  ansible.builtin.fail:
    msg: Set tc_dlc_access_governance_allow_destroy=true to authorize masking, policy, identity, database, engine and network deletion.

- name: Remove DLC data masking before referenced subjects
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_data_mask_strategy:
  args: "{{ _tc_dlc_mask | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_data_mask_strategies | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_mask
    label: "{{ _tc_dlc_mask.strategy_id }}"

- name: Remove DLC policies, members and work groups after masking strategies
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  ansible.builtin.include_tasks: teardown_work_group.yml
  loop: "{{ tc_dlc_access_governance_work_groups | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_group
    label: "{{ _tc_dlc_group.work_group.work_group_id }}"

- name: Remove DLC users after work-group access is detached
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  ansible.builtin.include_tasks: teardown_user.yml
  loop: "{{ tc_dlc_access_governance_users | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_user
    label: "{{ _tc_dlc_user.user.user_id }}"

- name: Remove DLC saved scripts before their databases
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_script:
  args: "{{ _tc_dlc_script | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_scripts | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_script
    label: "{{ _tc_dlc_script.name }}"

- name: Remove DLC databases after users and access policies
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_database:
  args: "{{ _tc_dlc_database | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_databases | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_database
    label: "{{ _tc_dlc_database.name }}"

- name: Remove DLC Spark job definitions before compute resources
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_spark_job:
  args: "{{ _tc_dlc_spark_job | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_spark_jobs | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_spark_job
    label: "{{ _tc_dlc_spark_job.name }}"

- name: Remove DLC laboratories before compute resources
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_lab:
  args: "{{ _tc_dlc_lab | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_labs | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_lab
    label: "{{ _tc_dlc_lab.name }}"

- name: Remove DLC job specifications before compute targets
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_job_spec:
  args: "{{ _tc_dlc_job_spec | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_job_specs | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_job_spec
    label: "{{ _tc_dlc_job_spec.name }}"

- name: Remove DLC Ray clusters before resource templates
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_ray_cluster:
  args: "{{ _tc_dlc_ray | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_ray_clusters | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_ray
    label: "{{ _tc_dlc_ray.name }}"

- name: Remove DLC resource templates after laboratories
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_resource_config:
  args: "{{ _tc_dlc_config | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_resource_configs | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_config
    label: "{{ _tc_dlc_config.name }}"

- name: Remove DLC cluster groups after dependent compute workloads
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_cluster_group:
  args: "{{ _tc_dlc_cluster_group | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_cluster_groups | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_cluster_group
    label: "{{ _tc_dlc_cluster_group.name }}"

- name: Remove DLC partition queues after laboratories and resource templates
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_partition_queue:
  args: "{{ _tc_dlc_queue | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_partition_queues | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_queue
    label: "{{ _tc_dlc_queue.partition_code }}/{{ _tc_dlc_queue.name }}"

- name: Remove DLC engine resource groups before parent engines
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_engine_resource_group:
  args: "{{ _tc_dlc_resource_group | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_engine_resource_groups | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_resource_group
    label: "{{ _tc_dlc_resource_group.name }}"

- name: Remove DLC data engines after access policies, groups and databases
  when:
    - tc_dlc_access_governance_state == 'absent'
    - tc_dlc_access_governance_allow_destroy | bool
  susunola.tencentcloud.dlc_data_engine:
  args: "{{ _tc_dlc_engine | combine({'state': 'absent', 'allow_delete': true}) }}"
  loop: "{{ tc_dlc_access_governance_data_engines | reverse | list }}"
  loop_control:
    loop_var: _tc_dlc_engine
