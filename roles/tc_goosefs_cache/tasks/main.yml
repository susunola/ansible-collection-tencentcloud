---
- name: Resolve GooseFS file system ID for teardown
  when:
    - tc_goosefs_cache_state == 'absent'
    - tc_goosefs_cache_file_system_id | length == 0
    - tc_goosefs_cache_name | length > 0
  ansible.builtin.set_fact:
    tc_goosefs_cache_file_system_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_goosefs_cache_name,
                resource_type='goosefs_file_system', region=tc_goosefs_cache_region) }}

- name: Validate GooseFS cache inputs
  ansible.builtin.assert:
    that:
      - tc_goosefs_cache_state in ['present', 'absent']
      - tc_goosefs_cache_region | length > 0
      - tc_goosefs_cache_file_system_id | length > 0 or tc_goosefs_cache_name | length > 0
      - tc_goosefs_cache_state == 'present' or tc_goosefs_cache_file_system_id | length > 0
    fail_msg: GooseFS cache requires a region and file-system identity.

- name: Provision GooseFS file system
  when: tc_goosefs_cache_state == 'present'
  susunola.tencentcloud.goosefs_file_system:
    region: "{{ tc_goosefs_cache_region }}"
    state: present
    file_system_id: "{{ tc_goosefs_cache_file_system_id | default(omit, true) }}"
    name: "{{ tc_goosefs_cache_name | default(omit, true) }}"
    description: "{{ tc_goosefs_cache_description }}"
    vpc_id: "{{ tc_goosefs_cache_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_goosefs_cache_subnet_id | default(omit, true) }}"
    zone: "{{ tc_goosefs_cache_zone | default(omit, true) }}"
    file_system_type: "{{ tc_goosefs_cache_file_system_type | default(omit, true) }}"
    build_elements: "{{ tc_goosefs_cache_build_elements | default(omit, true) }}"
    capacity: "{{ tc_goosefs_cache_capacity | default(omit, true) }}"
    security_group_id: "{{ tc_goosefs_cache_security_group_id | default(omit, true) }}"
    cluster_port: "{{ tc_goosefs_cache_cluster_port | default(omit, true) }}"
    tags: "{{ tc_goosefs_cache_tags }}"
  register: _tc_goosefs_file_system

- name: Resolve GooseFS file system ID
  when: tc_goosefs_cache_state == 'present'
  ansible.builtin.set_fact:
    _tc_goosefs_file_system_id: >-
      {{ tc_goosefs_cache_file_system_id
         or (_tc_goosefs_file_system.file_system.FileSystemId | default('')) }}

- name: Reconcile GooseFS filesets and quotas
  when:
    - tc_goosefs_cache_state == 'present'
    - _tc_goosefs_file_system_id | length > 0
  susunola.tencentcloud.goosefs_fileset:
  args: >-
    {{ item | combine({'state': 'present', 'file_system_id': _tc_goosefs_file_system_id,
                       'region': tc_goosefs_cache_region}) }}
  loop: "{{ tc_goosefs_cache_filesets }}"
  register: _tc_goosefs_filesets

- name: Remove GooseFS filesets before file system
  when: tc_goosefs_cache_state == 'absent'
  susunola.tencentcloud.goosefs_fileset:
    region: "{{ tc_goosefs_cache_region }}"
    state: absent
    file_system_id: "{{ tc_goosefs_cache_file_system_id }}"
    fileset_id: "{{ item.fileset_id | default(omit, true) }}"
    name: "{{ item.name | default(omit, true) }}"
    directory: "{{ item.directory | default(omit, true) }}"
  loop: "{{ tc_goosefs_cache_filesets }}"

- name: Remove GooseFS file system
  when: tc_goosefs_cache_state == 'absent'
  susunola.tencentcloud.goosefs_file_system:
    region: "{{ tc_goosefs_cache_region }}"
    state: absent
    file_system_id: "{{ tc_goosefs_cache_file_system_id }}"

- name: Publish GooseFS cache result
  when: tc_goosefs_cache_state == 'present'
  ansible.builtin.set_fact:
    tc_goosefs_cache_result:
      file_system_id: "{{ _tc_goosefs_file_system_id }}"
      file_system: "{{ _tc_goosefs_file_system.file_system | default({}) }}"
      filesets: "{{ _tc_goosefs_filesets | default({}) }}"
