---
- name: Resolve Organization member UIN for teardown
  ansible.builtin.set_fact:
    _tc_organization_member_uin: >-
      {{ _tc_organization_member.member_uin | default('')
         or lookup('susunola.tencentcloud.resource_id', _tc_organization_member.name,
                   resource_type='organization_member', region=tc_organization_governance_region) }}

- name: Remove Organization member policies
  susunola.tencentcloud.organization_member_policy:
    region: "{{ tc_organization_governance_region }}"
    state: absent
    policy_id: "{{ item.policy_id | default(omit, true) }}"
    member_uin: "{{ _tc_organization_member_uin }}"
    name: "{{ item.name | default(omit, true) }}"
  loop: "{{ _tc_organization_member.policies | default([]) }}"

- name: Remove Organization member identities
  susunola.tencentcloud.organization_member_identity:
    region: "{{ tc_organization_governance_region }}"
    member_uin: "{{ _tc_organization_member_uin }}"
    identity_ids: []
    purge: true

- name: Delete Organization member
  susunola.tencentcloud.organization_member:
    region: "{{ tc_organization_governance_region }}"
    state: absent
    member_uin: "{{ _tc_organization_member_uin }}"
