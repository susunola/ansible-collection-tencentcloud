---
- name: Resolve SQL Server instance ID for teardown
  when:
    - tc_sqlserver_stack_state == 'absent'
    - tc_sqlserver_stack_instance_id | length == 0
    - tc_sqlserver_stack_name | length > 0
  ansible.builtin.set_fact:
    tc_sqlserver_stack_instance_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_sqlserver_stack_name,
                resource_type='sqlserver_instance', region=tc_sqlserver_stack_region) }}

- name: Validate SQL Server stack inputs
  ansible.builtin.assert:
    that:
      - tc_sqlserver_stack_state in ['present', 'absent']
      - tc_sqlserver_stack_region | length > 0
      - tc_sqlserver_stack_instance_id | length > 0 or tc_sqlserver_stack_name | length > 0
      - tc_sqlserver_stack_state == 'present' or tc_sqlserver_stack_instance_id | length > 0
    fail_msg: SQL Server requires a region and instance identity; teardown requires a resolvable instance ID.

- name: Provision SQL Server instance
  when: tc_sqlserver_stack_state == 'present'
  susunola.tencentcloud.sqlserver_instance:
    region: "{{ tc_sqlserver_stack_region }}"
    state: present
    instance_id: "{{ tc_sqlserver_stack_instance_id | default(omit, true) }}"
    name: "{{ tc_sqlserver_stack_name | default(omit, true) }}"
    zone: "{{ tc_sqlserver_stack_zone | default(omit, true) }}"
    vpc_id: "{{ tc_sqlserver_stack_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_sqlserver_stack_subnet_id | default(omit, true) }}"
    memory: "{{ tc_sqlserver_stack_memory | default(omit, true) }}"
    storage: "{{ tc_sqlserver_stack_storage | default(omit, true) }}"
    cpu: "{{ tc_sqlserver_stack_cpu | default(omit, true) }}"
    db_version: "{{ tc_sqlserver_stack_db_version | default(omit, true) }}"
    charge_type: "{{ tc_sqlserver_stack_charge_type }}"
    period_months: "{{ tc_sqlserver_stack_period_months }}"
    auto_renew: "{{ tc_sqlserver_stack_auto_renew }}"
    security_group_ids: "{{ tc_sqlserver_stack_security_group_ids }}"
    ha_type: "{{ tc_sqlserver_stack_ha_type | default(omit, true) }}"
    secondary_zones: "{{ tc_sqlserver_stack_secondary_zones | default(omit, true) }}"
  register: _tc_sqlserver_instance

- name: Resolve SQL Server instance ID
  when: tc_sqlserver_stack_state == 'present'
  ansible.builtin.set_fact:
    _tc_sqlserver_instance_id: >-
      {{ tc_sqlserver_stack_instance_id
         or (_tc_sqlserver_instance.instance.InstanceId | default('')) }}

- name: Configure SQL Server backup strategy
  when:
    - tc_sqlserver_stack_state == 'present'
    - _tc_sqlserver_instance_id | length > 0
    - tc_sqlserver_stack_backup_config | length > 0
  susunola.tencentcloud.sqlserver_backup_config:
    region: "{{ tc_sqlserver_stack_region }}"
    instance_id: "{{ _tc_sqlserver_instance_id }}"
    backup_type: "{{ tc_sqlserver_stack_backup_config.backup_type | default('daily') }}"
    backup_hour: "{{ tc_sqlserver_stack_backup_config.backup_hour | default(3) }}"
    backup_cycle: "{{ tc_sqlserver_stack_backup_config.backup_cycle | default([]) }}"
    backup_model: "{{ tc_sqlserver_stack_backup_config.backup_model | default('master_pkg') }}"
    retention_days: "{{ tc_sqlserver_stack_backup_config.retention_days | default(7) }}"
  register: _tc_sqlserver_backup_config

- name: Reconcile SQL Server accounts and privileges
  when:
    - tc_sqlserver_stack_state == 'present'
    - _tc_sqlserver_instance_id | length > 0
  susunola.tencentcloud.sqlserver_account:
    region: "{{ tc_sqlserver_stack_region }}"
    state: present
    instance_id: "{{ _tc_sqlserver_instance_id }}"
    username: "{{ item.username }}"
    password: "{{ item.password | default(omit) }}"
    rotate_password: "{{ item.rotate_password | default(false) }}"
    remark: "{{ item.remark | default('') }}"
    account_type: "{{ item.account_type | default('L3') }}"
    database_privileges: "{{ item.database_privileges | default([]) }}"
  loop: "{{ tc_sqlserver_stack_accounts }}"
  no_log: true
  register: _tc_sqlserver_accounts

- name: Remove SQL Server accounts before instance action
  when: tc_sqlserver_stack_state == 'absent'
  susunola.tencentcloud.sqlserver_account:
    region: "{{ tc_sqlserver_stack_region }}"
    state: absent
    instance_id: "{{ tc_sqlserver_stack_instance_id }}"
    username: "{{ item.username }}"
  loop: "{{ tc_sqlserver_stack_accounts }}"

- name: Isolate or purge SQL Server instance
  when: tc_sqlserver_stack_state == 'absent'
  susunola.tencentcloud.sqlserver_instance:
    region: "{{ tc_sqlserver_stack_region }}"
    state: absent
    instance_id: "{{ tc_sqlserver_stack_instance_id }}"
    purge: "{{ tc_sqlserver_stack_purge }}"

- name: Publish SQL Server stack result
  when: tc_sqlserver_stack_state == 'present'
  ansible.builtin.set_fact:
    tc_sqlserver_stack_result:
      instance_id: "{{ _tc_sqlserver_instance_id }}"
      instance: "{{ _tc_sqlserver_instance.instance | default({}) }}"
      backup_config: "{{ _tc_sqlserver_backup_config.backup_config | default({}) }}"
      accounts: "{{ _tc_sqlserver_accounts | default({}) }}"
