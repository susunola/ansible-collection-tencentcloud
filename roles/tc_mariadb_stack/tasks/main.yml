---
- name: Resolve existing MariaDB instance ID for teardown
  when:
    - tc_mariadb_stack_state == 'absent'
    - tc_mariadb_stack_instance_id | length == 0
    - tc_mariadb_stack_name | length > 0
  ansible.builtin.set_fact:
    tc_mariadb_stack_instance_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_mariadb_stack_name,
                resource_type='mariadb_instance', region=tc_mariadb_stack_region) }}

- name: Validate MariaDB stack inputs
  ansible.builtin.assert:
    that:
      - tc_mariadb_stack_state in ['present', 'absent']
      - tc_mariadb_stack_instance_id | length > 0 or tc_mariadb_stack_name | length > 0
      - tc_mariadb_stack_state == 'present' or tc_mariadb_stack_instance_id | length > 0
      - tc_mariadb_stack_state == 'absent' or tc_mariadb_stack_instance_id | length > 0 or tc_mariadb_stack_zones | length > 0
      - tc_mariadb_stack_state == 'absent' or tc_mariadb_stack_instance_id | length > 0 or tc_mariadb_stack_memory is not none
      - tc_mariadb_stack_state == 'absent' or tc_mariadb_stack_instance_id | length > 0 or tc_mariadb_stack_storage is not none
      - not tc_mariadb_stack_purge or tc_mariadb_stack_state == 'absent'
    fail_msg: MariaDB creation requires placement and sizing; purge is valid only during teardown.

- name: Provision MariaDB instance
  when: tc_mariadb_stack_state == 'present'
  susunola.tencentcloud.mariadb_instance:
    region: "{{ tc_mariadb_stack_region | default(omit, true) }}"
    state: present
    instance_id: "{{ tc_mariadb_stack_instance_id | default(omit, true) }}"
    name: "{{ tc_mariadb_stack_name | default(omit, true) }}"
    zones: "{{ tc_mariadb_stack_zones | default(omit, true) }}"
    node_count: "{{ tc_mariadb_stack_node_count }}"
    memory: "{{ tc_mariadb_stack_memory | default(omit) }}"
    storage: "{{ tc_mariadb_stack_storage | default(omit) }}"
    db_version: "{{ tc_mariadb_stack_db_version | default(omit, true) }}"
    vpc_id: "{{ tc_mariadb_stack_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_mariadb_stack_subnet_id | default(omit, true) }}"
    charge_type: "{{ tc_mariadb_stack_charge_type }}"
    period_months: "{{ tc_mariadb_stack_period_months }}"
    auto_renew: "{{ tc_mariadb_stack_auto_renew }}"
    security_group_ids: "{{ tc_mariadb_stack_security_group_ids }}"
    ipv6: "{{ tc_mariadb_stack_ipv6 }}"
  register: _tc_mariadb_stack_instance

- name: Resolve MariaDB instance ID
  when: tc_mariadb_stack_state == 'present'
  ansible.builtin.set_fact:
    _tc_mariadb_stack_instance_id: >-
      {{ tc_mariadb_stack_instance_id
         or (_tc_mariadb_stack_instance.instance.InstanceId | default('')) }}

- name: Reconcile MariaDB accounts and privileges
  ansible.builtin.include_tasks: account.yml
  loop: "{{ tc_mariadb_stack_accounts }}"
  loop_control:
    loop_var: _tc_mariadb_account
    label: "{{ _tc_mariadb_account.username }}@{{ _tc_mariadb_account.host | default('%') }}"

- name: Configure MariaDB automatic backups
  when:
    - tc_mariadb_stack_state == 'present'
    - tc_mariadb_stack_backup_enabled
  susunola.tencentcloud.mariadb_backup_config:
    region: "{{ tc_mariadb_stack_region | default(omit, true) }}"
    instance_id: "{{ _tc_mariadb_stack_instance_id }}"
    retention_days: "{{ tc_mariadb_stack_backup_retention_days }}"
    start_time: "{{ tc_mariadb_stack_backup_start_time }}"
    end_time: "{{ tc_mariadb_stack_backup_end_time }}"
    weekdays: "{{ tc_mariadb_stack_backup_weekdays }}"
    archive_after_days: "{{ tc_mariadb_stack_backup_archive_after_days }}"
  register: _tc_mariadb_stack_backup

- name: Isolate or purge MariaDB instance
  when: tc_mariadb_stack_state == 'absent'
  susunola.tencentcloud.mariadb_instance:
    region: "{{ tc_mariadb_stack_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_mariadb_stack_instance_id }}"
    purge: "{{ tc_mariadb_stack_purge }}"

- name: Publish MariaDB stack result
  when: tc_mariadb_stack_state == 'present'
  ansible.builtin.set_fact:
    tc_mariadb_stack_result:
      instance_id: "{{ _tc_mariadb_stack_instance_id }}"
      instance: "{{ _tc_mariadb_stack_instance.instance }}"
      backup: "{{ _tc_mariadb_stack_backup | default({}) }}"
