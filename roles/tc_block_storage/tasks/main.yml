---
- name: Resolve existing CBS disk ID for teardown
  when:
    - tc_block_storage_state == 'absent'
    - tc_block_storage_disk_id | length == 0
    - tc_block_storage_name | length > 0
  ansible.builtin.set_fact:
    tc_block_storage_disk_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_block_storage_name,
                resource_type='cbs_disk', region=tc_block_storage_region) }}

- name: Validate block storage inputs
  ansible.builtin.assert:
    that:
      - tc_block_storage_state in ['present', 'absent']
      - tc_block_storage_disk_id | length > 0 or tc_block_storage_name | length > 0
      - tc_block_storage_state == 'present' or tc_block_storage_disk_id | length > 0
      - tc_block_storage_state == 'absent' or tc_block_storage_disk_id | length > 0 or tc_block_storage_zone | length > 0
      - tc_block_storage_state == 'absent' or tc_block_storage_disk_id | length > 0 or tc_block_storage_disk_type | length > 0
      - tc_block_storage_state == 'absent' or tc_block_storage_disk_id | length > 0 or tc_block_storage_disk_size is not none
    fail_msg: CBS disk creation requires zone, type and size; teardown requires a resolvable disk ID.

- name: Provision CBS disk
  when: tc_block_storage_state == 'present'
  susunola.tencentcloud.cbs_disk:
    region: "{{ tc_block_storage_region | default(omit, true) }}"
    state: present
    disk_id: "{{ tc_block_storage_disk_id | default(omit, true) }}"
    name: "{{ tc_block_storage_name | default(omit, true) }}"
    zone: "{{ tc_block_storage_zone | default(omit, true) }}"
    disk_type: "{{ tc_block_storage_disk_type | default(omit, true) }}"
    disk_size: "{{ tc_block_storage_disk_size | default(omit) }}"
    charge_type: "{{ tc_block_storage_charge_type }}"
    prepaid_period_months: "{{ tc_block_storage_prepaid_period_months | default(omit) }}"
    instance_id: "{{ tc_block_storage_instance_id | default(omit, true) }}"
    delete_with_instance: "{{ tc_block_storage_delete_with_instance | default(omit) }}"
    encrypt: "{{ tc_block_storage_encrypt | default(omit) }}"
    snapshot_id: "{{ tc_block_storage_source_snapshot_id | default(omit, true) }}"
    tags: "{{ tc_block_storage_tags }}"
    waiter_delay: "{{ tc_block_storage_waiter_delay }}"
    waiter_timeout: "{{ tc_block_storage_waiter_timeout }}"
  register: _tc_block_storage_disk

- name: Resolve CBS disk ID
  when: tc_block_storage_state == 'present'
  ansible.builtin.set_fact:
    _tc_block_storage_disk_id: >-
      {{ tc_block_storage_disk_id
         or (_tc_block_storage_disk.disk.DiskId | default('')) }}

- name: Reconcile CBS snapshots
  when: tc_block_storage_state == 'present'
  susunola.tencentcloud.cbs_snapshot:
    region: "{{ tc_block_storage_region | default(omit, true) }}"
    state: present
    disk_id: "{{ _tc_block_storage_disk_id }}"
    snapshot_id: "{{ item.snapshot_id | default(omit, true) }}"
    snapshot_name: "{{ item.snapshot_name | default(omit, true) }}"
    wait: "{{ item.wait | default(true) }}"
    waiter_delay: "{{ tc_block_storage_waiter_delay }}"
    waiter_timeout: "{{ tc_block_storage_waiter_timeout }}"
  loop: "{{ tc_block_storage_snapshots }}"
  loop_control:
    label: "{{ item.snapshot_name | default(item.snapshot_id | default('snapshot')) }}"
  register: _tc_block_storage_snapshots

- name: Reconcile CBS snapshot sharing
  when:
    - tc_block_storage_state == 'present'
    - item.account_ids is defined
    - not ansible_check_mode or item.snapshot_id is defined
  susunola.tencentcloud.cbs_snapshot_share:
    region: "{{ tc_block_storage_region | default(omit, true) }}"
    snapshot_id: >-
      {{ item.snapshot_id
         | default(_tc_block_storage_snapshots.results[_tc_snapshot_index].snapshot.SnapshotId) }}
    account_ids: "{{ item.account_ids }}"
  loop: "{{ tc_block_storage_snapshots }}"
  loop_control:
    index_var: _tc_snapshot_index
    label: "{{ item.snapshot_name | default(item.snapshot_id | default('snapshot')) }}"
  register: _tc_block_storage_snapshot_shares

- name: Reconcile CBS disk backup points
  when: tc_block_storage_state == 'present'
  susunola.tencentcloud.cbs_disk_backup:
    region: "{{ tc_block_storage_region | default(omit, true) }}"
    state: present
    disk_id: "{{ _tc_block_storage_disk_id }}"
    disk_backup_id: "{{ item.disk_backup_id | default(omit, true) }}"
    name: "{{ item.name | default(omit, true) }}"
    force_replace: "{{ item.force_replace | default(false) }}"
    wait: "{{ item.wait | default(true) }}"
    waiter_delay: "{{ tc_block_storage_waiter_delay }}"
    waiter_timeout: "{{ tc_block_storage_waiter_timeout }}"
  loop: "{{ tc_block_storage_backups }}"
  loop_control:
    label: "{{ item.name | default(item.disk_backup_id | default('backup')) }}"
  register: _tc_block_storage_backups

- name: Reconcile CBS automatic snapshot policies
  when: tc_block_storage_state == 'present'
  susunola.tencentcloud.cbs_auto_snapshot_policy:
    region: "{{ tc_block_storage_region | default(omit, true) }}"
    state: present
    policy_id: "{{ item.policy_id | default(omit, true) }}"
    name: "{{ item.name | default(omit, true) }}"
    schedules: "{{ item.schedules }}"
    enabled: "{{ item.enabled | default(true) }}"
    permanent: "{{ item.permanent | default(false) }}"
    retention_days: "{{ item.retention_days | default(7) }}"
    disk_ids: "{{ item.disk_ids | default([_tc_block_storage_disk_id]) }}"
  loop: "{{ tc_block_storage_snapshot_policies }}"
  loop_control:
    label: "{{ item.name | default(item.policy_id | default('policy')) }}"
  register: _tc_block_storage_snapshot_policies

- name: Remove CBS snapshot sharing
  when:
    - tc_block_storage_state == 'absent'
    - item.snapshot_id | default('') | length > 0
  susunola.tencentcloud.cbs_snapshot_share:
    region: "{{ tc_block_storage_region | default(omit, true) }}"
    snapshot_id: "{{ item.snapshot_id }}"
    account_ids: []
  loop: "{{ tc_block_storage_snapshots }}"
  loop_control:
    label: "{{ item.snapshot_name | default(item.snapshot_id | default('snapshot')) }}"

- name: Remove CBS snapshots
  when: tc_block_storage_state == 'absent'
  susunola.tencentcloud.cbs_snapshot:
    region: "{{ tc_block_storage_region | default(omit, true) }}"
    state: absent
    disk_id: "{{ tc_block_storage_disk_id }}"
    snapshot_id: "{{ item.snapshot_id | default(omit, true) }}"
    snapshot_name: "{{ item.snapshot_name | default(omit, true) }}"
  loop: "{{ tc_block_storage_snapshots }}"
  loop_control:
    label: "{{ item.snapshot_name | default(item.snapshot_id | default('snapshot')) }}"

- name: Remove CBS disk backup points
  when: tc_block_storage_state == 'absent'
  susunola.tencentcloud.cbs_disk_backup:
    region: "{{ tc_block_storage_region | default(omit, true) }}"
    state: absent
    disk_id: "{{ tc_block_storage_disk_id }}"
    disk_backup_id: "{{ item.disk_backup_id | default(omit, true) }}"
    name: "{{ item.name | default(omit, true) }}"
  loop: "{{ tc_block_storage_backups }}"
  loop_control:
    label: "{{ item.name | default(item.disk_backup_id | default('backup')) }}"

- name: Unbind and remove CBS automatic snapshot policies
  when: tc_block_storage_state == 'absent'
  susunola.tencentcloud.cbs_auto_snapshot_policy:
    region: "{{ tc_block_storage_region | default(omit, true) }}"
    state: absent
    policy_id: "{{ item.policy_id | default(omit, true) }}"
    name: "{{ item.name | default(omit, true) }}"
    force_delete: true
  loop: "{{ tc_block_storage_snapshot_policies }}"
  loop_control:
    label: "{{ item.name | default(item.policy_id | default('policy')) }}"

- name: Detach CBS disk before teardown
  when:
    - tc_block_storage_state == 'absent'
    - tc_block_storage_instance_id | length > 0
  susunola.tencentcloud.cbs_disk:
    region: "{{ tc_block_storage_region | default(omit, true) }}"
    state: present
    disk_id: "{{ tc_block_storage_disk_id }}"
    detach: true
    waiter_delay: "{{ tc_block_storage_waiter_delay }}"
    waiter_timeout: "{{ tc_block_storage_waiter_timeout }}"

- name: Terminate CBS disk
  when: tc_block_storage_state == 'absent'
  susunola.tencentcloud.cbs_disk:
    region: "{{ tc_block_storage_region | default(omit, true) }}"
    state: absent
    disk_id: "{{ tc_block_storage_disk_id }}"
    delete_snapshot: "{{ tc_block_storage_delete_snapshots_with_disk }}"

- name: Publish block storage result
  when: tc_block_storage_state == 'present'
  ansible.builtin.set_fact:
    tc_block_storage_result:
      disk_id: "{{ _tc_block_storage_disk_id }}"
      disk: "{{ _tc_block_storage_disk.disk }}"
      snapshots: "{{ _tc_block_storage_snapshots | default({}) }}"
      backups: "{{ _tc_block_storage_backups | default({}) }}"
      snapshot_policies: "{{ _tc_block_storage_snapshot_policies | default({}) }}"
