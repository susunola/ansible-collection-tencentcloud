---
- name: Resolve existing API Gateway service ID for teardown
  when:
    - tc_api_gateway_platform_state == 'absent'
    - tc_api_gateway_platform_service_id | length == 0
    - tc_api_gateway_platform_name | length > 0
  ansible.builtin.set_fact:
    tc_api_gateway_platform_service_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_api_gateway_platform_name,
                resource_type='api_gateway_service', region=tc_api_gateway_platform_region) }}

- name: Validate API Gateway platform inputs
  ansible.builtin.assert:
    that:
      - tc_api_gateway_platform_state in ['present', 'absent']
      - tc_api_gateway_platform_region | length > 0
      - tc_api_gateway_platform_service_id | length > 0 or tc_api_gateway_platform_name | length > 0
      - tc_api_gateway_platform_state == 'present' or tc_api_gateway_platform_service_id | length > 0
    fail_msg: API Gateway requires an explicit region and service identity; teardown requires a resolvable service ID.

- name: Provision API Gateway service
  when: tc_api_gateway_platform_state == 'present'
  susunola.tencentcloud.api_gateway_service:
    region: "{{ tc_api_gateway_platform_region }}"
    state: present
    service_id: "{{ tc_api_gateway_platform_service_id | default(omit, true) }}"
    name: "{{ tc_api_gateway_platform_name | default(omit, true) }}"
    description: "{{ tc_api_gateway_platform_description }}"
    protocol: "{{ tc_api_gateway_platform_protocol }}"
    network_types: "{{ tc_api_gateway_platform_network_types }}"
    ip_version: "{{ tc_api_gateway_platform_ip_version }}"
    vpc_id: "{{ tc_api_gateway_platform_vpc_id | default(omit, true) }}"
    instance_id: "{{ tc_api_gateway_platform_instance_id | default(omit, true) }}"
    tags: "{{ tc_api_gateway_platform_tags }}"
  register: _tc_api_gateway_platform_service

- name: Resolve API Gateway service ID
  when: tc_api_gateway_platform_state == 'present'
  ansible.builtin.set_fact:
    _tc_api_gateway_platform_service_id: >-
      {{ tc_api_gateway_platform_service_id
         or (_tc_api_gateway_platform_service.service.ServiceId | default('')) }}

- name: Reconcile API Gateway APIs
  when:
    - tc_api_gateway_platform_state == 'present'
    - _tc_api_gateway_platform_service_id | length > 0
  susunola.tencentcloud.api_gateway_api:
  args: "{{ item | combine({'state': 'present', 'service_id': _tc_api_gateway_platform_service_id, 'region': tc_api_gateway_platform_region}) }}"
  loop: "{{ tc_api_gateway_platform_apis }}"
  register: _tc_api_gateway_platform_apis

- name: Reconcile API Gateway service releases
  when:
    - tc_api_gateway_platform_state == 'present'
    - _tc_api_gateway_platform_service_id | length > 0
  susunola.tencentcloud.api_gateway_service_release:
  args: "{{ item | combine({'state': 'present', 'service_id': _tc_api_gateway_platform_service_id, 'region': tc_api_gateway_platform_region}) }}"
  loop: "{{ tc_api_gateway_platform_releases }}"
  register: _tc_api_gateway_platform_releases

- name: Reconcile API Gateway API keys
  when: tc_api_gateway_platform_state == 'present'
  susunola.tencentcloud.api_gateway_api_key:
  args: "{{ item | combine({'state': 'present', 'region': tc_api_gateway_platform_region}) }}"
  loop: "{{ tc_api_gateway_platform_api_keys }}"
  no_log: "{{ item.access_key_secret is defined }}"
  register: _tc_api_gateway_platform_keys

- name: Reconcile API Gateway usage plans and bindings
  when:
    - tc_api_gateway_platform_state == 'present'
    - _tc_api_gateway_platform_service_id | length > 0
  ansible.builtin.include_tasks: usage_plan.yml
  loop: "{{ tc_api_gateway_platform_usage_plans }}"
  loop_control:
    loop_var: _tc_api_gateway_plan
    label: "{{ _tc_api_gateway_plan.name | default(_tc_api_gateway_plan.usage_plan_id | default('plan')) }}"

- name: Remove API Gateway usage plan bindings and plans
  when: tc_api_gateway_platform_state == 'absent'
  ansible.builtin.include_tasks: teardown_usage_plan.yml
  loop: "{{ tc_api_gateway_platform_usage_plans }}"
  loop_control:
    loop_var: _tc_api_gateway_plan

- name: Unrelease API Gateway environments
  when: tc_api_gateway_platform_state == 'absent'
  susunola.tencentcloud.api_gateway_service_release:
  args: "{{ item | combine({'state': 'absent', 'service_id': tc_api_gateway_platform_service_id, 'region': tc_api_gateway_platform_region}) }}"
  loop: "{{ tc_api_gateway_platform_releases }}"

- name: Remove API Gateway APIs
  when: tc_api_gateway_platform_state == 'absent'
  susunola.tencentcloud.api_gateway_api:
  args: "{{ item | combine({'state': 'absent', 'service_id': tc_api_gateway_platform_service_id, 'region': tc_api_gateway_platform_region}) }}"
  loop: "{{ tc_api_gateway_platform_apis }}"

- name: Remove API Gateway API keys
  when: tc_api_gateway_platform_state == 'absent'
  susunola.tencentcloud.api_gateway_api_key:
  args: "{{ item | combine({'state': 'absent', 'region': tc_api_gateway_platform_region}) }}"
  loop: "{{ tc_api_gateway_platform_api_keys }}"
  no_log: "{{ item.access_key_secret is defined }}"

- name: Remove API Gateway service
  when: tc_api_gateway_platform_state == 'absent'
  susunola.tencentcloud.api_gateway_service:
    region: "{{ tc_api_gateway_platform_region }}"
    state: absent
    service_id: "{{ tc_api_gateway_platform_service_id }}"

- name: Publish API Gateway platform result
  when: tc_api_gateway_platform_state == 'present'
  ansible.builtin.set_fact:
    tc_api_gateway_platform_result:
      service_id: "{{ _tc_api_gateway_platform_service_id }}"
      service: "{{ _tc_api_gateway_platform_service.service | default({}) }}"
      apis: "{{ _tc_api_gateway_platform_apis | default({}) }}"
      releases: "{{ _tc_api_gateway_platform_releases | default({}) }}"
      api_keys: "{{ _tc_api_gateway_platform_keys | default({}) }}"
