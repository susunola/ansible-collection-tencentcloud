---
- name: Validate observability baseline inputs
  ansible.builtin.assert:
    that:
      - tc_observability_baseline_state in ['present', 'absent']
      - tc_observability_baseline_logset_id | length > 0 or tc_observability_baseline_logset_name | length > 0
      - tc_observability_baseline_state == 'present' or tc_observability_baseline_topics | length == 0 or tc_observability_baseline_logset_id | length > 0
    fail_msg: A CLS logset ID or name is required.

- name: Provision CLS logset
  when: tc_observability_baseline_state == 'present'
  susunola.tencentcloud.cls_logset:
    region: "{{ tc_observability_baseline_region | default(omit, true) }}"
    state: present
    logset_id: "{{ tc_observability_baseline_logset_id | default(omit, true) }}"
    name: "{{ tc_observability_baseline_logset_name | default(omit, true) }}"
    tags: "{{ tc_observability_baseline_tags }}"
  register: _tc_observability_logset

- name: Resolve CLS logset ID
  when: tc_observability_baseline_state == 'present'
  ansible.builtin.set_fact:
    _tc_observability_logset_id: >-
      {{ tc_observability_baseline_logset_id
         or (_tc_observability_logset.logset.LogsetId | default('')) }}

- name: Provision CLS topics
  when:
    - tc_observability_baseline_state == 'present'
    - _tc_observability_logset_id | length > 0
  susunola.tencentcloud.cls_topic:
    region: "{{ tc_observability_baseline_region | default(omit, true) }}"
    state: present
    topic_id: "{{ item.topic_id | default(omit, true) }}"
    logset_id: "{{ _tc_observability_logset_id }}"
    name: "{{ item.name }}"
    partition_count: "{{ item.partition_count | default(1) }}"
    period: "{{ item.period | default(30) }}"
    hot_period: "{{ item.hot_period | default(omit) }}"
    storage_type: "{{ item.storage_type | default('hot') }}"
    auto_split: "{{ item.auto_split | default(true) }}"
    max_split_partitions: "{{ item.max_split_partitions | default(50) }}"
    description: "{{ item.description | default('') }}"
    tags: "{{ item.tags | default(tc_observability_baseline_tags) }}"
  loop: "{{ tc_observability_baseline_topics }}"
  loop_control:
    label: "{{ item.name }}"
  register: _tc_observability_topics

- name: Configure CLS topic indexes
  when:
    - tc_observability_baseline_state == 'present'
    - item.0.index is defined
    - item.0.topic_id | default(item.1.topic.TopicId | default('')) | length > 0
  susunola.tencentcloud.cls_index:
    region: "{{ tc_observability_baseline_region | default(omit, true) }}"
    state: present
    topic_id: "{{ item.0.topic_id | default(item.1.topic.TopicId, true) }}"
    enabled: "{{ item.0.index.enabled | default(true) }}"
    case_sensitive: "{{ item.0.index.case_sensitive | default(false) }}"
    full_text_delimiters: "{{ item.0.index.full_text_delimiters | default(',; ') }}"
    contain_zh: "{{ item.0.index.contain_zh | default(true) }}"
    include_internal_fields: "{{ item.0.index.include_internal_fields | default(false) }}"
    metadata_flag: "{{ item.0.index.metadata_flag | default(0) }}"
    coverage_field: "{{ item.0.index.coverage_field | default(omit) }}"
  loop: "{{ tc_observability_baseline_topics | zip(_tc_observability_topics.results | default([])) }}"
  loop_control:
    label: "{{ item.0.name }} index"

- name: Reconcile monitor alarm policies
  when: tc_observability_baseline_state == 'present'
  susunola.tencentcloud.monitor_alarm_policy:
    region: "{{ tc_observability_baseline_region | default(omit, true) }}"
    state: present
    policy_id: "{{ item.policy_id | default(omit, true) }}"
    name: "{{ item.name }}"
    module: "{{ item.module | default('monitor') }}"
    monitor_type: "{{ item.monitor_type | default('MT_QCE') }}"
    namespace: "{{ item.namespace }}"
    remark: "{{ item.remark | default('') }}"
    enabled: "{{ item.enabled | default(true) }}"
    condition: "{{ item.condition | default(omit) }}"
    event_condition: "{{ item.event_condition | default(omit) }}"
    notice_ids: "{{ item.notice_ids | default([]) }}"
    project_id: "{{ item.project_id | default(omit) }}"
    filter: "{{ item.filter | default(omit) }}"
    group_by: "{{ item.group_by | default(omit) }}"
    trigger_tasks: "{{ item.trigger_tasks | default(omit) }}"
    hierarchical_notices: "{{ item.hierarchical_notices | default(omit) }}"
    notice_content_template_bindings: "{{ item.notice_content_template_bindings | default(omit) }}"
    tags: "{{ item.tags | default(tc_observability_baseline_tags) }}"
  loop: "{{ tc_observability_baseline_alarm_policies }}"
  loop_control:
    label: "{{ item.name }}"
  register: _tc_observability_alarm_policies

- name: Remove monitor alarm policies
  when: tc_observability_baseline_state == 'absent'
  susunola.tencentcloud.monitor_alarm_policy:
    region: "{{ tc_observability_baseline_region | default(omit, true) }}"
    state: absent
    policy_id: "{{ item.policy_id | default(omit, true) }}"
    name: "{{ item.name | default(omit, true) }}"
    namespace: "{{ item.namespace | default(omit, true) }}"
  loop: "{{ tc_observability_baseline_alarm_policies }}"

- name: Remove CLS topics
  when: tc_observability_baseline_state == 'absent'
  susunola.tencentcloud.cls_topic:
    region: "{{ tc_observability_baseline_region | default(omit, true) }}"
    state: absent
    topic_id: "{{ item.topic_id | default(omit, true) }}"
    logset_id: "{{ tc_observability_baseline_logset_id }}"
    name: "{{ item.name | default(omit, true) }}"
  loop: "{{ tc_observability_baseline_topics }}"

- name: Remove CLS logset
  when: tc_observability_baseline_state == 'absent'
  susunola.tencentcloud.cls_logset:
    region: "{{ tc_observability_baseline_region | default(omit, true) }}"
    state: absent
    logset_id: "{{ tc_observability_baseline_logset_id | default(omit, true) }}"
    name: "{{ tc_observability_baseline_logset_name | default(omit, true) }}"

- name: Publish observability baseline result
  when: tc_observability_baseline_state == 'present'
  ansible.builtin.set_fact:
    tc_observability_baseline_result:
      logset_id: "{{ _tc_observability_logset_id }}"
      logset: "{{ _tc_observability_logset.logset }}"
      topics: "{{ _tc_observability_topics.results | default([]) }}"
      alarm_policies: "{{ _tc_observability_alarm_policies.results | default([]) }}"
