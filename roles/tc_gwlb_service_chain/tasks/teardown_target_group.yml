---
- name: Resolve GWLB target group ID for teardown
  ansible.builtin.set_fact:
    _tc_gwlb_target_group_id: >-
      {{ _tc_gwlb_target_group.target_group_id | default('')
         or lookup('susunola.tencentcloud.resource_id', _tc_gwlb_target_group.name,
                   resource_type='gwlb_target_group', region=tc_gwlb_service_chain_region) }}

- name: Disassociate GWLB target group
  when: _tc_gwlb_target_group.associate | default(true) | bool
  susunola.tencentcloud.gwlb_target_group_association:
    region: "{{ tc_gwlb_service_chain_region }}"
    state: absent
    load_balancer_id: "{{ tc_gwlb_service_chain_load_balancer_id }}"
    target_group_id: "{{ _tc_gwlb_target_group_id }}"

- name: Deregister GWLB appliance instances
  susunola.tencentcloud.gwlb_target_group_instances:
    region: "{{ tc_gwlb_service_chain_region }}"
    target_group_id: "{{ _tc_gwlb_target_group_id }}"
    instances: []
    purge: true

- name: Remove GWLB target group
  susunola.tencentcloud.gwlb_target_group:
    region: "{{ tc_gwlb_service_chain_region }}"
    state: absent
    target_group_id: "{{ _tc_gwlb_target_group_id }}"
