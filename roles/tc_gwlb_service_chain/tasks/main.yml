---
- name: Resolve GWLB ID for teardown
  when:
    - tc_gwlb_service_chain_state == 'absent'
    - tc_gwlb_service_chain_load_balancer_id | length == 0
    - tc_gwlb_service_chain_name | length > 0
  ansible.builtin.set_fact:
    tc_gwlb_service_chain_load_balancer_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_gwlb_service_chain_name,
                resource_type='gwlb_load_balancer', region=tc_gwlb_service_chain_region) }}

- name: Validate GWLB service chain inputs
  ansible.builtin.assert:
    that:
      - tc_gwlb_service_chain_state in ['present', 'absent']
      - tc_gwlb_service_chain_region | length > 0
      - tc_gwlb_service_chain_load_balancer_id | length > 0 or tc_gwlb_service_chain_name | length > 0
      - tc_gwlb_service_chain_state == 'present' or tc_gwlb_service_chain_load_balancer_id | length > 0
    fail_msg: GWLB requires a region and load-balancer identity; teardown requires a resolvable ID.

- name: Provision Gateway Load Balancer
  when: tc_gwlb_service_chain_state == 'present'
  susunola.tencentcloud.gwlb_load_balancer:
    region: "{{ tc_gwlb_service_chain_region }}"
    state: present
    load_balancer_id: "{{ tc_gwlb_service_chain_load_balancer_id | default(omit, true) }}"
    name: "{{ tc_gwlb_service_chain_name | default(omit, true) }}"
    vpc_id: "{{ tc_gwlb_service_chain_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_gwlb_service_chain_subnet_id | default(omit, true) }}"
    charge_type: "{{ tc_gwlb_service_chain_charge_type }}"
    deletion_protection: "{{ tc_gwlb_service_chain_deletion_protection }}"
    tags: "{{ tc_gwlb_service_chain_tags }}"
  register: _tc_gwlb_load_balancer

- name: Resolve Gateway Load Balancer ID
  when: tc_gwlb_service_chain_state == 'present'
  ansible.builtin.set_fact:
    _tc_gwlb_load_balancer_id: >-
      {{ tc_gwlb_service_chain_load_balancer_id
         or (_tc_gwlb_load_balancer.load_balancer.LoadBalancerId | default('')) }}

- name: Reconcile GWLB target groups and appliances
  when:
    - tc_gwlb_service_chain_state == 'present'
    - _tc_gwlb_load_balancer_id | length > 0
  ansible.builtin.include_tasks: target_group.yml
  loop: "{{ tc_gwlb_service_chain_target_groups }}"
  loop_control:
    loop_var: _tc_gwlb_target_group
    label: "{{ _tc_gwlb_target_group.name }}"

- name: Disassociate and remove GWLB target groups
  when: tc_gwlb_service_chain_state == 'absent'
  ansible.builtin.include_tasks: teardown_target_group.yml
  loop: "{{ tc_gwlb_service_chain_target_groups }}"
  loop_control:
    loop_var: _tc_gwlb_target_group

- name: Disable GWLB deletion protection and remove load balancer
  when: tc_gwlb_service_chain_state == 'absent'
  susunola.tencentcloud.gwlb_load_balancer:
    region: "{{ tc_gwlb_service_chain_region }}"
    state: absent
    load_balancer_id: "{{ tc_gwlb_service_chain_load_balancer_id }}"
    deletion_protection: false

- name: Publish GWLB service chain result
  when: tc_gwlb_service_chain_state == 'present'
  ansible.builtin.set_fact:
    tc_gwlb_service_chain_result:
      load_balancer_id: "{{ _tc_gwlb_load_balancer_id }}"
      load_balancer: "{{ _tc_gwlb_load_balancer.load_balancer | default({}) }}"
