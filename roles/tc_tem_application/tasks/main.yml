---
- name: Validate TEM application role inputs
  ansible.builtin.assert:
    that:
      - tc_tem_application_state in ['present', 'absent']
      - tc_tem_application_environment_id | length > 0 or tc_tem_application_environment_name | length > 0
      - tc_tem_application_id | length > 0 or tc_tem_application_name | length > 0
      - tc_tem_application_state == 'present' or tc_tem_application_environment_id | length > 0
      - tc_tem_application_state == 'present' or tc_tem_application_id | length > 0
    fail_msg: >-
      state=present requires an environment and application ID or name;
      state=absent requires explicit environment_id and application_id so
      dependent services can be removed safely.

- name: Provision TEM environment
  when: tc_tem_application_state == 'present'
  susunola.tencentcloud.tem_environment:
    region: "{{ tc_tem_application_region | default(omit, true) }}"
    state: present
    environment_id: "{{ tc_tem_application_environment_id | default(omit, true) }}"
    name: "{{ tc_tem_application_environment_name | default(omit, true) }}"
    description: "{{ tc_tem_application_environment_description | default(omit, true) }}"
    environment_type: "{{ tc_tem_application_environment_type }}"
    vpc_id: "{{ tc_tem_application_vpc_id | default(omit, true) }}"
    subnet_ids: "{{ tc_tem_application_subnet_ids | default(omit, true) }}"
    setup_vpc: "{{ tc_tem_application_setup_vpc }}"
    setup_prometheus: "{{ tc_tem_application_setup_prometheus }}"
    prometheus_id: "{{ tc_tem_application_prometheus_id | default(omit, true) }}"
    apm_id: "{{ tc_tem_application_apm_id | default(omit, true) }}"
    source_channel: "{{ tc_tem_application_source_channel }}"
    waiter_timeout: "{{ tc_tem_application_waiter_timeout }}"
    waiter_delay: "{{ tc_tem_application_waiter_delay }}"
  register: _tc_tem_environment

- name: Resolve TEM environment ID
  when: tc_tem_application_state == 'present'
  ansible.builtin.set_fact:
    _tc_tem_environment_id: >-
      {{ tc_tem_application_environment_id
         or _tc_tem_environment.environment.EnvironmentId }}

- name: Provision TEM application definition
  when: tc_tem_application_state == 'present'
  susunola.tencentcloud.tem_application:
    region: "{{ tc_tem_application_region | default(omit, true) }}"
    state: present
    application_id: "{{ tc_tem_application_id | default(omit, true) }}"
    name: "{{ tc_tem_application_name | default(omit, true) }}"
    description: "{{ tc_tem_application_description | default(omit, true) }}"
    coding_language: "{{ tc_tem_application_coding_language | default(omit, true) }}"
    deploy_mode: "{{ tc_tem_application_deploy_mode | default(omit, true) }}"
    enable_tracing: "{{ tc_tem_application_enable_tracing }}"
    use_default_image_service: "{{ tc_tem_application_use_default_image_service }}"
    repo_type: "{{ tc_tem_application_repo_type }}"
    instance_id: "{{ tc_tem_application_registry_instance_id | default(omit, true) }}"
    repo_server: "{{ tc_tem_application_repo_server | default(omit, true) }}"
    repo_name: "{{ tc_tem_application_repo_name | default(omit, true) }}"
    tags: "{{ tc_tem_application_tags }}"
    source_channel: "{{ tc_tem_application_source_channel }}"
  register: _tc_tem_application

- name: Resolve TEM application ID
  when: tc_tem_application_state == 'present'
  ansible.builtin.set_fact:
    _tc_tem_application_id: >-
      {{ tc_tem_application_id
         or _tc_tem_application.application.ApplicationId }}

- name: Deploy TEM application version
  when:
    - tc_tem_application_state == 'present'
    - tc_tem_application_deploy_version | length > 0
  susunola.tencentcloud.tem_application_deployment:
    region: "{{ tc_tem_application_region | default(omit, true) }}"
    application_id: "{{ _tc_tem_application_id }}"
    environment_id: "{{ _tc_tem_environment_id }}"
    deploy_version: "{{ tc_tem_application_deploy_version }}"
    configuration: "{{ tc_tem_application_deployment }}"
    force_redeploy: "{{ tc_tem_application_force_redeploy }}"
    source_channel: "{{ tc_tem_application_source_channel }}"
    wait: "{{ tc_tem_application_wait }}"
    waiter_timeout: "{{ tc_tem_application_waiter_timeout }}"
    waiter_delay: "{{ tc_tem_application_waiter_delay }}"
  register: _tc_tem_deployment

- name: Reconcile TEM application services
  when: tc_tem_application_state == 'present'
  susunola.tencentcloud.tem_application_service:
    region: "{{ tc_tem_application_region | default(omit, true) }}"
    state: present
    application_id: "{{ _tc_tem_application_id }}"
    environment_id: "{{ _tc_tem_environment_id }}"
    name: "{{ item.name }}"
    access_type: "{{ item.access_type }}"
    service: "{{ item.service | default({}) }}"
    source_channel: "{{ tc_tem_application_source_channel }}"
  loop: "{{ tc_tem_application_services }}"
  loop_control:
    label: "{{ item.name }}"
  register: _tc_tem_services

- name: Remove TEM application services
  when: tc_tem_application_state == 'absent'
  susunola.tencentcloud.tem_application_service:
    region: "{{ tc_tem_application_region | default(omit, true) }}"
    state: absent
    application_id: "{{ tc_tem_application_id }}"
    environment_id: "{{ tc_tem_application_environment_id }}"
    name: "{{ item.name }}"
    access_type: "{{ item.access_type }}"
    source_channel: "{{ tc_tem_application_source_channel }}"
  loop: "{{ tc_tem_application_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove TEM application definition
  when: tc_tem_application_state == 'absent'
  susunola.tencentcloud.tem_application:
    region: "{{ tc_tem_application_region | default(omit, true) }}"
    state: absent
    application_id: "{{ tc_tem_application_id }}"
    environment_id: "{{ tc_tem_application_environment_id }}"
    source_channel: "{{ tc_tem_application_source_channel }}"

- name: Remove TEM environment
  when:
    - tc_tem_application_state == 'absent'
    - tc_tem_application_destroy_environment
  susunola.tencentcloud.tem_environment:
    region: "{{ tc_tem_application_region | default(omit, true) }}"
    state: absent
    environment_id: "{{ tc_tem_application_environment_id }}"
    source_channel: "{{ tc_tem_application_source_channel }}"

- name: Publish TEM role result
  when: tc_tem_application_state == 'present'
  ansible.builtin.set_fact:
    tc_tem_application_result:
      environment_id: "{{ _tc_tem_environment_id }}"
      application_id: "{{ _tc_tem_application_id }}"
      environment: "{{ _tc_tem_environment.environment }}"
      application: "{{ _tc_tem_application.application }}"
      deployment: "{{ _tc_tem_deployment.deployment | default({}) }}"
