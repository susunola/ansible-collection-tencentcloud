---
- name: Validate TSF microservice platform inputs
  ansible.builtin.assert:
    that:
      - tc_tsf_microservice_platform_state in ['present', 'absent']
      - tc_tsf_microservice_platform_clusters is sequence
      - tc_tsf_microservice_platform_namespaces is sequence
      - tc_tsf_microservice_platform_applications is sequence
      - tc_tsf_microservice_platform_microservices is sequence
      - tc_tsf_microservice_platform_vm_deployment_groups is sequence
      - tc_tsf_microservice_platform_container_deployment_groups is sequence
      - tc_tsf_microservice_platform_state == 'present' or tc_tsf_microservice_platform_allow_destroy | bool
    fail_msg: TSF platform destruction requires tc_tsf_microservice_platform_allow_destroy=true.

- name: Reconcile TSF clusters
  when: tc_tsf_microservice_platform_state == 'present'
  susunola.tencentcloud.tsf_cluster:
  args: "{{ item | combine({'state': 'present'}) }}"
  loop: "{{ tc_tsf_microservice_platform_clusters }}"
  loop_control: {label: "{{ item.name | default(item.cluster_id | default('unnamed')) }}"}
  register: _tc_tsf_microservice_platform_clusters

- name: Reconcile TSF namespaces
  when: tc_tsf_microservice_platform_state == 'present'
  susunola.tencentcloud.tsf_namespace:
  args: "{{ item | combine({'state': 'present'}) }}"
  loop: "{{ tc_tsf_microservice_platform_namespaces }}"
  loop_control: {label: "{{ item.name | default(item.namespace_id | default('unnamed')) }}"}
  register: _tc_tsf_microservice_platform_namespaces

- name: Reconcile TSF applications
  when: tc_tsf_microservice_platform_state == 'present'
  susunola.tencentcloud.tsf_application:
  args: "{{ item | combine({'state': 'present'}) }}"
  loop: "{{ tc_tsf_microservice_platform_applications }}"
  loop_control: {label: "{{ item.name | default(item.application_id | default('unnamed')) }}"}
  register: _tc_tsf_microservice_platform_applications

- name: Reconcile TSF microservices
  when: tc_tsf_microservice_platform_state == 'present'
  susunola.tencentcloud.tsf_microservice:
  args: "{{ item | combine({'state': 'present'}) }}"
  loop: "{{ tc_tsf_microservice_platform_microservices }}"
  loop_control: {label: "{{ item.namespace_id | default('?') }}/{{ item.name | default(item.microservice_id | default('unnamed')) }}"}
  register: _tc_tsf_microservice_platform_microservices

- name: Reconcile TSF VM deployment groups
  when: tc_tsf_microservice_platform_state == 'present'
  susunola.tencentcloud.tsf_vm_deployment_group:
  args: "{{ item | combine({'state': 'present'}) }}"
  loop: "{{ tc_tsf_microservice_platform_vm_deployment_groups }}"
  loop_control: {label: "{{ item.name | default(item.group_id | default('unnamed')) }}"}
  register: _tc_tsf_microservice_platform_vm_deployment_groups

- name: Reconcile TSF container deployment groups
  when: tc_tsf_microservice_platform_state == 'present'
  susunola.tencentcloud.tsf_container_deployment_group:
  args: "{{ item | combine({'state': 'present'}) }}"
  loop: "{{ tc_tsf_microservice_platform_container_deployment_groups }}"
  loop_control: {label: "{{ item.name | default(item.group_id | default('unnamed')) }}"}
  register: _tc_tsf_microservice_platform_container_deployment_groups

- name: Publish TSF microservice platform outputs
  when: tc_tsf_microservice_platform_state == 'present'
  ansible.builtin.set_fact:
    tc_tsf_microservice_platform_result:
      clusters: "{{ _tc_tsf_microservice_platform_clusters.results | default([]) | map(attribute='cluster') | list }}"
      namespaces: "{{ _tc_tsf_microservice_platform_namespaces.results | default([]) | map(attribute='namespace') | list }}"
      applications: "{{ _tc_tsf_microservice_platform_applications.results | default([]) | map(attribute='application') | list }}"
      microservices: "{{ _tc_tsf_microservice_platform_microservices.results | default([]) | map(attribute='microservice') | list }}"
      vm_deployment_groups: "{{ _tc_tsf_microservice_platform_vm_deployment_groups.results | default([]) | map(attribute='deployment_group') | list }}"
      container_deployment_groups: "{{ _tc_tsf_microservice_platform_container_deployment_groups.results | default([]) | map(attribute='deployment_group') | list }}"

- name: Remove TSF container deployment groups
  when: tc_tsf_microservice_platform_state == 'absent'
  susunola.tencentcloud.tsf_container_deployment_group:
    group_id: "{{ item.group_id | default(omit) }}"
    name: "{{ item.name }}"
    application_id: "{{ item.application_id }}"
    namespace_id: "{{ item.namespace_id }}"
    cluster_id: "{{ item.cluster_id }}"
    state: absent
  loop: "{{ tc_tsf_microservice_platform_container_deployment_groups | reverse | list }}"
  loop_control: {label: "{{ item.name | default(item.group_id | default('unnamed')) }}"}

- name: Remove TSF VM deployment groups
  when: tc_tsf_microservice_platform_state == 'absent'
  susunola.tencentcloud.tsf_vm_deployment_group:
    group_id: "{{ item.group_id | default(omit) }}"
    name: "{{ item.name }}"
    application_id: "{{ item.application_id }}"
    namespace_id: "{{ item.namespace_id }}"
    cluster_id: "{{ item.cluster_id }}"
    state: absent
  loop: "{{ tc_tsf_microservice_platform_vm_deployment_groups | reverse | list }}"
  loop_control: {label: "{{ item.name | default(item.group_id | default('unnamed')) }}"}

- name: Remove TSF microservices
  when: tc_tsf_microservice_platform_state == 'absent'
  susunola.tencentcloud.tsf_microservice:
    microservice_id: "{{ item.microservice_id | default(omit) }}"
    namespace_id: "{{ item.namespace_id }}"
    name: "{{ item.name }}"
    state: absent
  loop: "{{ tc_tsf_microservice_platform_microservices | reverse | list }}"
  loop_control: {label: "{{ item.namespace_id | default('?') }}/{{ item.name | default(item.microservice_id | default('unnamed')) }}"}

- name: Remove TSF applications
  when: tc_tsf_microservice_platform_state == 'absent'
  susunola.tencentcloud.tsf_application:
    application_id: "{{ item.application_id | default(omit) }}"
    name: "{{ item.name }}"
    sync_delete_image_repository: "{{ item.sync_delete_image_repository | default(false) }}"
    state: absent
  loop: "{{ tc_tsf_microservice_platform_applications | reverse | list }}"
  loop_control: {label: "{{ item.name | default(item.application_id | default('unnamed')) }}"}

- name: Remove TSF namespaces
  when: tc_tsf_microservice_platform_state == 'absent'
  susunola.tencentcloud.tsf_namespace:
    namespace_id: "{{ item.namespace_id | default(omit) }}"
    name: "{{ item.name }}"
    cluster_id: "{{ item.cluster_id | default(omit) }}"
    state: absent
  loop: "{{ tc_tsf_microservice_platform_namespaces | reverse | list }}"
  loop_control: {label: "{{ item.name | default(item.namespace_id | default('unnamed')) }}"}

- name: Remove TSF clusters
  when: tc_tsf_microservice_platform_state == 'absent'
  susunola.tencentcloud.tsf_cluster:
    cluster_id: "{{ item.cluster_id | default(omit) }}"
    name: "{{ item.name }}"
    unbind_only: "{{ item.unbind_only | default(false) }}"
    state: absent
  loop: "{{ tc_tsf_microservice_platform_clusters | reverse | list }}"
  loop_control: {label: "{{ item.name | default(item.cluster_id | default('unnamed')) }}"}
