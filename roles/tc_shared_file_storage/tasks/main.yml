---
- name: Resolve existing CFS file system ID for teardown
  when:
    - tc_shared_file_storage_state == 'absent'
    - tc_shared_file_storage_file_system_id | length == 0
    - tc_shared_file_storage_name | length > 0
  ansible.builtin.set_fact:
    tc_shared_file_storage_file_system_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_shared_file_storage_name,
                resource_type='cfs_file_system', region=tc_shared_file_storage_region) }}

- name: Validate shared file storage inputs
  ansible.builtin.assert:
    that:
      - tc_shared_file_storage_state in ['present', 'absent']
      - tc_shared_file_storage_file_system_id | length > 0 or tc_shared_file_storage_name | length > 0
      - tc_shared_file_storage_state == 'absent' or tc_shared_file_storage_file_system_id | length > 0 or tc_shared_file_storage_zone | length > 0
      - tc_shared_file_storage_permission_rules | length == 0 or tc_shared_file_storage_permission_group_id | length > 0 or tc_shared_file_storage_state == 'present'
      - tc_shared_file_storage_permission_rules | length == 0 or tc_shared_file_storage_permission_group_id | length > 0 or tc_shared_file_storage_permission_group_name | length > 0
      - not tc_shared_file_storage_snapshot_policy.enabled or tc_shared_file_storage_snapshot_policy.name | length > 0
    fail_msg: CFS creation requires a zone; permission rules require a permission group, with its ID required for teardown.

- name: Provision CFS permission group
  when:
    - tc_shared_file_storage_state == 'present'
    - tc_shared_file_storage_permission_group_id | length > 0 or tc_shared_file_storage_permission_group_name | length > 0
  susunola.tencentcloud.cfs_permission_group:
    region: "{{ tc_shared_file_storage_region | default(omit, true) }}"
    state: present
    permission_group_id: "{{ tc_shared_file_storage_permission_group_id | default(omit, true) }}"
    name: "{{ tc_shared_file_storage_permission_group_name | default(omit, true) }}"
    description: "{{ tc_shared_file_storage_permission_group_description }}"
  register: _tc_shared_file_storage_permission_group

- name: Resolve CFS permission group ID
  when: tc_shared_file_storage_state == 'present'
  ansible.builtin.set_fact:
    _tc_shared_file_storage_permission_group_id: >-
      {{ tc_shared_file_storage_permission_group_id
         or (_tc_shared_file_storage_permission_group.permission_group.PGroupId | default('')) }}

- name: Provision CFS permission rules
  when:
    - tc_shared_file_storage_state == 'present'
    - _tc_shared_file_storage_permission_group_id | length > 0
  susunola.tencentcloud.cfs_permission_rule:
    region: "{{ tc_shared_file_storage_region | default(omit, true) }}"
    state: present
    permission_group_id: "{{ _tc_shared_file_storage_permission_group_id }}"
    rule_id: "{{ item.rule_id | default(omit, true) }}"
    client_ip: "{{ item.client_ip }}"
    priority: "{{ item.priority | default(1) }}"
    access: "{{ item.access | default('RW') }}"
    user_permission: "{{ item.user_permission | default('no_root_squash') }}"
  loop: "{{ tc_shared_file_storage_permission_rules }}"
  loop_control:
    label: "{{ item.client_ip }}"
  register: _tc_shared_file_storage_permission_rules

- name: Provision CFS file system
  when: tc_shared_file_storage_state == 'present'
  susunola.tencentcloud.cfs_file_system:
    region: "{{ tc_shared_file_storage_region | default(omit, true) }}"
    state: present
    file_system_id: "{{ tc_shared_file_storage_file_system_id | default(omit, true) }}"
    name: "{{ tc_shared_file_storage_name | default(omit, true) }}"
    zone: "{{ tc_shared_file_storage_zone | default(omit, true) }}"
    protocol: "{{ tc_shared_file_storage_protocol }}"
    storage_type: "{{ tc_shared_file_storage_storage_type }}"
    capacity: "{{ tc_shared_file_storage_capacity }}"
    size_limit: "{{ tc_shared_file_storage_size_limit | default(omit) }}"
    vpc_id: "{{ tc_shared_file_storage_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_shared_file_storage_subnet_id | default(omit, true) }}"
    pgroup_id: "{{ _tc_shared_file_storage_permission_group_id | default(omit, true) }}"
  register: _tc_shared_file_storage_file_system

- name: Resolve provisioned CFS file system ID
  when: tc_shared_file_storage_state == 'present'
  ansible.builtin.set_fact:
    _tc_shared_file_storage_file_system_id: >-
      {{ tc_shared_file_storage_file_system_id
         or (_tc_shared_file_storage_file_system.file_system.FileSystemId | default('')) }}

- name: Reconcile CFS automatic snapshot policy
  when:
    - tc_shared_file_storage_state == 'present'
    - tc_shared_file_storage_snapshot_policy.enabled
  susunola.tencentcloud.cfs_auto_snapshot_policy:
    region: "{{ tc_shared_file_storage_region | default(omit, true) }}"
    state: present
    policy_id: "{{ tc_shared_file_storage_snapshot_policy.policy_id | default(omit, true) }}"
    name: "{{ tc_shared_file_storage_snapshot_policy.name }}"
    hour: "{{ tc_shared_file_storage_snapshot_policy.hour }}"
    day_of_week: "{{ tc_shared_file_storage_snapshot_policy.day_of_week }}"
    day_of_month: "{{ tc_shared_file_storage_snapshot_policy.day_of_month }}"
    interval_days: "{{ tc_shared_file_storage_snapshot_policy.interval_days }}"
    alive_days: "{{ tc_shared_file_storage_snapshot_policy.alive_days }}"
    enabled: true
    file_system_ids: ["{{ _tc_shared_file_storage_file_system_id }}"]
  register: _tc_shared_file_storage_snapshot_policy

- name: Remove CFS automatic snapshot policy
  when:
    - tc_shared_file_storage_state == 'absent'
    - tc_shared_file_storage_snapshot_policy.enabled
  susunola.tencentcloud.cfs_auto_snapshot_policy:
    region: "{{ tc_shared_file_storage_region | default(omit, true) }}"
    state: absent
    policy_id: "{{ tc_shared_file_storage_snapshot_policy.policy_id | default(omit, true) }}"
    name: "{{ tc_shared_file_storage_snapshot_policy.name | default(omit, true) }}"
    force_delete: true

- name: Remove CFS file system
  when: tc_shared_file_storage_state == 'absent'
  susunola.tencentcloud.cfs_file_system:
    region: "{{ tc_shared_file_storage_region | default(omit, true) }}"
    state: absent
    file_system_id: "{{ tc_shared_file_storage_file_system_id }}"

- name: Remove CFS permission rules
  when: tc_shared_file_storage_state == 'absent'
  susunola.tencentcloud.cfs_permission_rule:
    region: "{{ tc_shared_file_storage_region | default(omit, true) }}"
    state: absent
    permission_group_id: "{{ tc_shared_file_storage_permission_group_id }}"
    rule_id: "{{ item.rule_id | default(omit, true) }}"
    client_ip: "{{ item.client_ip | default(omit, true) }}"
  loop: "{{ tc_shared_file_storage_permission_rules }}"
  loop_control:
    label: "{{ item.client_ip | default(item.rule_id) }}"

- name: Remove CFS permission group
  when:
    - tc_shared_file_storage_state == 'absent'
    - tc_shared_file_storage_permission_group_id | length > 0 or tc_shared_file_storage_permission_group_name | length > 0
  susunola.tencentcloud.cfs_permission_group:
    region: "{{ tc_shared_file_storage_region | default(omit, true) }}"
    state: absent
    permission_group_id: "{{ tc_shared_file_storage_permission_group_id | default(omit, true) }}"
    name: "{{ tc_shared_file_storage_permission_group_name | default(omit, true) }}"

- name: Publish shared file storage result
  when: tc_shared_file_storage_state == 'present'
  ansible.builtin.set_fact:
    tc_shared_file_storage_result:
      file_system_id: "{{ _tc_shared_file_storage_file_system_id }}"
      file_system: "{{ _tc_shared_file_storage_file_system.file_system }}"
      permission_group: "{{ _tc_shared_file_storage_permission_group | default({}) }}"
      permission_rules: "{{ _tc_shared_file_storage_permission_rules.results | default([]) }}"
      snapshot_policy: "{{ _tc_shared_file_storage_snapshot_policy | default({}) }}"
