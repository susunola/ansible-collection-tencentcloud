---
- name: Disable WAF automatic deny
  when: _tc_waf_domain.auto_deny is defined
  susunola.tencentcloud.waf_auto_deny:
    region: "{{ tc_waf_application_region | default(omit, true) }}"
    domain: "{{ _tc_waf_domain.domain }}"
    enabled: false

- name: Remove WAF geographic blocking
  when: _tc_waf_domain.area_ban is defined
  susunola.tencentcloud.waf_area_ban_rule:
    region: "{{ tc_waf_application_region | default(omit, true) }}"
    state: absent
    domain: "{{ _tc_waf_domain.domain }}"

- name: Remove WAF anti-information-leak rules
  susunola.tencentcloud.waf_anti_info_leak_rule:
  args: "{{ item | combine({'state': 'absent', 'domain': _tc_waf_domain.domain, 'region': tc_waf_application_region}) }}"
  loop: "{{ _tc_waf_domain.anti_info_leak_rules | default([]) }}"

- name: Remove WAF anti-tamper rules
  susunola.tencentcloud.waf_anti_tamper_rule:
  args: "{{ item | combine({'state': 'absent', 'domain': _tc_waf_domain.domain, 'region': tc_waf_application_region}) }}"
  loop: "{{ _tc_waf_domain.anti_tamper_rules | default([]) }}"

- name: Remove WAF OWASP allow rules
  susunola.tencentcloud.waf_owasp_white_rule:
  args: "{{ item | combine({'state': 'absent', 'domain': _tc_waf_domain.domain, 'region': tc_waf_application_region}) }}"
  loop: "{{ _tc_waf_domain.owasp_white_rules | default([]) }}"

- name: Remove WAF attack allow rules
  susunola.tencentcloud.waf_attack_white_rule:
  args: "{{ item | combine({'state': 'absent', 'domain': _tc_waf_domain.domain, 'region': tc_waf_application_region}) }}"
  loop: "{{ _tc_waf_domain.attack_white_rules | default([]) }}"

- name: Remove WAF custom allow rules
  susunola.tencentcloud.waf_custom_white_rule:
  args: "{{ item | combine({'state': 'absent', 'domain': _tc_waf_domain.domain, 'region': tc_waf_application_region}) }}"
  loop: "{{ _tc_waf_domain.custom_white_rules | default([]) }}"

- name: Remove WAF CC rules
  susunola.tencentcloud.waf_cc_rule:
  args: "{{ item | combine({'state': 'absent', 'domain': _tc_waf_domain.domain, 'region': tc_waf_application_region}) }}"
  loop: "{{ _tc_waf_domain.cc_rules | default([]) }}"

- name: Remove WAF custom rules
  susunola.tencentcloud.waf_custom_rule:
  args: "{{ item | combine({'state': 'absent', 'domain': _tc_waf_domain.domain, 'region': tc_waf_application_region}) }}"
  loop: "{{ _tc_waf_domain.custom_rules | default([]) }}"

- name: Remove WAF IP access controls
  susunola.tencentcloud.waf_ip_access_control:
  args: "{{ item | combine({'state': 'absent', 'domain': _tc_waf_domain.domain, 'instance_id': tc_waf_application_instance_id, 'region': tc_waf_application_region}) }}"
  loop: "{{ _tc_waf_domain.ip_access_controls | default([]) }}"

- name: Remove WAF protected host
  susunola.tencentcloud.waf_host:
    region: "{{ tc_waf_application_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_waf_application_instance_id }}"
    domain: "{{ _tc_waf_domain.domain }}"
    domain_id: "{{ _tc_waf_domain.domain_id | default(omit, true) }}"
