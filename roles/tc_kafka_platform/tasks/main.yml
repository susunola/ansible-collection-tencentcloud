---
- name: Resolve existing CKafka instance ID for teardown
  when:
    - tc_kafka_platform_state == 'absent'
    - tc_kafka_platform_instance_id | length == 0
    - tc_kafka_platform_name | length > 0
  ansible.builtin.set_fact:
    tc_kafka_platform_instance_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_kafka_platform_name,
                resource_type='ckafka_instance', region=tc_kafka_platform_region) }}

- name: Validate Kafka platform inputs
  ansible.builtin.assert:
    that:
      - tc_kafka_platform_state in ['present', 'absent']
      - tc_kafka_platform_instance_id | length > 0 or tc_kafka_platform_name | length > 0
      - tc_kafka_platform_state == 'present' or tc_kafka_platform_instance_id | length > 0
      - tc_kafka_platform_state == 'absent' or tc_kafka_platform_instance_id | length > 0 or tc_kafka_platform_zones | length > 0
      - tc_kafka_platform_state == 'absent' or tc_kafka_platform_instance_id | length > 0 or tc_kafka_platform_vpc_id | length > 0
      - tc_kafka_platform_state == 'absent' or tc_kafka_platform_instance_id | length > 0 or tc_kafka_platform_subnet_id | length > 0
    fail_msg: CKafka creation requires placement and sizing; teardown requires a resolvable instance ID.

- name: Provision CKafka instance
  when: tc_kafka_platform_state == 'present'
  susunola.tencentcloud.ckafka_instance:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ tc_kafka_platform_instance_id | default(omit, true) }}"
    name: "{{ tc_kafka_platform_name | default(omit, true) }}"
    zones: "{{ tc_kafka_platform_zones | default(omit, true) }}"
    vpc_id: "{{ tc_kafka_platform_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_kafka_platform_subnet_id | default(omit, true) }}"
    charge_type: "{{ tc_kafka_platform_charge_type }}"
    period_months: "{{ tc_kafka_platform_period_months }}"
    auto_renew: "{{ tc_kafka_platform_auto_renew }}"
    instance_type: "{{ tc_kafka_platform_instance_type | default(omit) }}"
    specification: "{{ tc_kafka_platform_specification | default(omit, true) }}"
    kafka_version: "{{ tc_kafka_platform_version | default(omit, true) }}"
    disk_type: "{{ tc_kafka_platform_disk_type | default(omit, true) }}"
    disk_size: "{{ tc_kafka_platform_disk_size | default(omit) }}"
    bandwidth: "{{ tc_kafka_platform_bandwidth | default(omit) }}"
    partitions: "{{ tc_kafka_platform_partitions | default(omit) }}"
    topic_count: "{{ tc_kafka_platform_topic_count | default(omit) }}"
    retention_minutes: "{{ tc_kafka_platform_retention_minutes | default(omit) }}"
    max_message_bytes: "{{ tc_kafka_platform_max_message_bytes | default(omit) }}"
    retention_bytes: "{{ tc_kafka_platform_retention_bytes | default(omit) }}"
    unclean_leader_election: "{{ tc_kafka_platform_unclean_leader_election | default(omit) }}"
    deletion_protection: "{{ tc_kafka_platform_deletion_protection }}"
    tags: "{{ tc_kafka_platform_tags }}"
    waiter_timeout: "{{ tc_kafka_platform_waiter_timeout }}"
    waiter_delay: "{{ tc_kafka_platform_waiter_delay }}"
  register: _tc_kafka_platform_instance

- name: Resolve CKafka instance ID
  when: tc_kafka_platform_state == 'present'
  ansible.builtin.set_fact:
    _tc_kafka_platform_instance_id: >-
      {{ tc_kafka_platform_instance_id
         or (_tc_kafka_platform_instance.instance.InstanceId | default('')) }}

- name: Provision CKafka access routes
  when: tc_kafka_platform_state == 'present'
  susunola.tencentcloud.ckafka_route:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ _tc_kafka_platform_instance_id }}"
    route_id: "{{ item.route_id | default(omit) }}"
    network_type: "{{ item.network_type | default(3) }}"
    access_type: "{{ item.access_type | default(0) }}"
    vpc_id: "{{ item.vpc_id | default(omit) }}"
    subnet_id: "{{ item.subnet_id | default(omit) }}"
    public_bandwidth: "{{ item.public_bandwidth | default(omit) }}"
    note: "{{ item.note | default('') }}"
    security_group_ids: "{{ item.security_group_ids | default([]) }}"
    ip_whitelist: "{{ item.ip_whitelist | default([]) }}"
  loop: "{{ tc_kafka_platform_routes }}"
  register: _tc_kafka_platform_routes

- name: Provision CKafka users
  when: tc_kafka_platform_state == 'present'
  susunola.tencentcloud.ckafka_user:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ _tc_kafka_platform_instance_id }}"
    name: "{{ item.name }}"
    password: "{{ item.password | default(omit) }}"
    rotate_password: "{{ item.rotate_password | default(false) }}"
    current_password: "{{ item.current_password | default(omit) }}"
  loop: "{{ tc_kafka_platform_users }}"
  loop_control: {label: "{{ item.name }}"}
  register: _tc_kafka_platform_users

- name: Provision CKafka topics
  when: tc_kafka_platform_state == 'present'
  susunola.tencentcloud.ckafka_topic:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ _tc_kafka_platform_instance_id }}"
    topic_name: "{{ item.topic_name }}"
    partition_num: "{{ item.partition_num | default(1) }}"
    replica_num: "{{ item.replica_num | default(2) }}"
    retention_ms: "{{ item.retention_ms | default(omit) }}"
    retention_bytes: "{{ item.retention_bytes | default(omit) }}"
    clean_up_policy: "{{ item.clean_up_policy | default(omit) }}"
    note: "{{ item.note | default(omit) }}"
    max_message_bytes: "{{ item.max_message_bytes | default(omit) }}"
    min_insync_replicas: "{{ item.min_insync_replicas | default(omit) }}"
    producer_quota_mb: "{{ item.producer_quota_mb | default(omit) }}"
    consumer_quota_mb: "{{ item.consumer_quota_mb | default(omit) }}"
    message_timestamp_type: "{{ item.message_timestamp_type | default(omit) }}"
    tags: "{{ item.tags | default({}) }}"
  loop: "{{ tc_kafka_platform_topics }}"
  loop_control: {label: "{{ item.topic_name }}"}
  register: _tc_kafka_platform_topics

- name: Provision CKafka ACL entries
  when: tc_kafka_platform_state == 'present'
  susunola.tencentcloud.ckafka_acl:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ _tc_kafka_platform_instance_id }}"
    resource_type: "{{ item.resource_type }}"
    resource_name: "{{ item.resource_name }}"
    operation: "{{ item.operation }}"
    permission: "{{ item.permission | default('ALLOW') }}"
    host: "{{ item.host | default('*') }}"
    principal: "{{ item.principal }}"
  loop: "{{ tc_kafka_platform_acls }}"
  register: _tc_kafka_platform_acls

- name: Provision CKafka ACL rules
  when: tc_kafka_platform_state == 'present'
  susunola.tencentcloud.ckafka_acl_rule:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ _tc_kafka_platform_instance_id }}"
    name: "{{ item.name }}"
    pattern_type: "{{ item.pattern_type | default('PREFIXED') }}"
    pattern: "{{ item.pattern | default(omit) }}"
    apply_to_new_topics: "{{ item.apply_to_new_topics | default(false) }}"
    comment: "{{ item.comment | default('') }}"
    rules: "{{ item.rules }}"
  loop: "{{ tc_kafka_platform_acl_rules }}"
  loop_control: {label: "{{ item.name }}"}

- name: Remove CKafka ACL rules
  when: tc_kafka_platform_state == 'absent'
  susunola.tencentcloud.ckafka_acl_rule:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_kafka_platform_instance_id }}"
    name: "{{ item.name }}"
    pattern_type: "{{ item.pattern_type | default('PREFIXED') }}"
  loop: "{{ tc_kafka_platform_acl_rules }}"

- name: Remove CKafka ACL entries
  when: tc_kafka_platform_state == 'absent'
  susunola.tencentcloud.ckafka_acl:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_kafka_platform_instance_id }}"
    resource_type: "{{ item.resource_type }}"
    resource_name: "{{ item.resource_name }}"
    operation: "{{ item.operation }}"
    permission: "{{ item.permission | default('ALLOW') }}"
    host: "{{ item.host | default('*') }}"
    principal: "{{ item.principal }}"
  loop: "{{ tc_kafka_platform_acls }}"

- name: Remove CKafka topics
  when: tc_kafka_platform_state == 'absent'
  susunola.tencentcloud.ckafka_topic:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_kafka_platform_instance_id }}"
    topic_name: "{{ item.topic_name }}"
  loop: "{{ tc_kafka_platform_topics }}"

- name: Remove CKafka users
  when: tc_kafka_platform_state == 'absent'
  susunola.tencentcloud.ckafka_user:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_kafka_platform_instance_id }}"
    name: "{{ item.name }}"
  loop: "{{ tc_kafka_platform_users }}"

- name: Remove CKafka access routes
  when: tc_kafka_platform_state == 'absent'
  susunola.tencentcloud.ckafka_route:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_kafka_platform_instance_id }}"
    route_id: "{{ item.route_id | default(omit) }}"
    network_type: "{{ item.network_type | default(3) }}"
    access_type: "{{ item.access_type | default(0) }}"
    vpc_id: "{{ item.vpc_id | default(omit) }}"
    subnet_id: "{{ item.subnet_id | default(omit) }}"
    public_bandwidth: "{{ item.public_bandwidth | default(omit) }}"
  loop: "{{ tc_kafka_platform_routes }}"

- name: Disable CKafka deletion protection before teardown
  when: tc_kafka_platform_state == 'absent'
  susunola.tencentcloud.ckafka_instance:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ tc_kafka_platform_instance_id }}"
    deletion_protection: false

- name: Remove CKafka instance
  when: tc_kafka_platform_state == 'absent'
  susunola.tencentcloud.ckafka_instance:
    region: "{{ tc_kafka_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_kafka_platform_instance_id }}"

- name: Publish Kafka platform result
  when: tc_kafka_platform_state == 'present'
  ansible.builtin.set_fact:
    tc_kafka_platform_result:
      instance_id: "{{ _tc_kafka_platform_instance_id }}"
      instance: "{{ _tc_kafka_platform_instance.instance }}"
      routes: "{{ _tc_kafka_platform_routes.results | default([]) }}"
      users: "{{ _tc_kafka_platform_users.results | default([]) }}"
      topics: "{{ _tc_kafka_platform_topics.results | default([]) }}"
      acls: "{{ _tc_kafka_platform_acls.results | default([]) }}"
