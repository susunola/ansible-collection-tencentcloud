---
- name: Validate TSE governance platform inputs
  ansible.builtin.assert:
    that:
      - tc_tse_governance_platform_state in ['present', 'absent']
      - tc_tse_governance_platform_engine is mapping
      - tc_tse_governance_platform_access_address_query is mapping
      - tc_tse_governance_platform_namespaces is sequence
      - tc_tse_governance_platform_services is sequence
      - tc_tse_governance_platform_instances is sequence
      - tc_tse_governance_platform_aliases is sequence
      - tc_tse_governance_platform_lane_groups is sequence
      - tc_tse_governance_platform_config_groups is sequence
      - tc_tse_governance_platform_config_files is sequence
      - tc_tse_governance_platform_config_releases is sequence
      - tc_tse_governance_platform_engine.instance_id | default(tc_tse_governance_platform_engine.name | default('')) | length > 0
      - tc_tse_governance_platform_state == 'present' or tc_tse_governance_platform_allow_destroy | bool
    fail_msg: TSE governance requires instance_id or name; destruction requires tc_tse_governance_platform_allow_destroy=true.

- name: Reconcile TSE registry engine
  when: tc_tse_governance_platform_state == 'present'
  susunola.tencentcloud.tse_sre_instance:
  args: "{{ tc_tse_governance_platform_engine | combine({'state': 'present'}) }}"
  register: _tc_tse_governance_platform_engine

- name: Capture TSE registry engine ID
  when: tc_tse_governance_platform_state == 'present'
  ansible.builtin.set_fact:
    _tc_tse_governance_platform_instance_id: "{{ _tc_tse_governance_platform_engine.instance.InstanceId }}"

- name: Discover TSE registry engine access addresses
  when: tc_tse_governance_platform_state == 'present'
  susunola.tencentcloud.tse_sre_access_address_info:
  args: "{{ tc_tse_governance_platform_access_address_query | combine({'instance_id': _tc_tse_governance_platform_instance_id}) }}"
  register: _tc_tse_governance_platform_access_address

- name: Reconcile TSE governance namespaces
  when: tc_tse_governance_platform_state == 'present'
  susunola.tencentcloud.tse_governance_namespace:
  args: "{{ item | combine({'instance_id': _tc_tse_governance_platform_instance_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_governance_platform_namespaces }}"
  loop_control: {label: "{{ item.name | default('unnamed') }}"}
  register: _tc_tse_governance_platform_namespaces

- name: Reconcile TSE governance services
  when: tc_tse_governance_platform_state == 'present'
  susunola.tencentcloud.tse_governance_service:
  args: "{{ item | combine({'instance_id': _tc_tse_governance_platform_instance_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_governance_platform_services }}"
  loop_control: {label: "{{ item.namespace | default('?') }}/{{ item.name | default('unnamed') }}"}
  register: _tc_tse_governance_platform_services

- name: Reconcile TSE governance service instances
  when: tc_tse_governance_platform_state == 'present'
  susunola.tencentcloud.tse_governance_instance:
  args: "{{ item | combine({'instance_id': _tc_tse_governance_platform_instance_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_governance_platform_instances }}"
  loop_control: {label: "{{ item.namespace | default('?') }}/{{ item.service | default('?') }}/{{ item.host | default('?') }}:{{ item.port | default('?') }}"}
  register: _tc_tse_governance_platform_instances

- name: Reconcile TSE governance service aliases
  when: tc_tse_governance_platform_state == 'present'
  susunola.tencentcloud.tse_governance_alias:
  args: "{{ item | combine({'instance_id': _tc_tse_governance_platform_instance_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_governance_platform_aliases }}"
  loop_control: {label: "{{ item.alias_namespace | default('?') }}/{{ item.alias | default('unnamed') }}"}
  register: _tc_tse_governance_platform_aliases

- name: Reconcile TSE governance lane groups
  when: tc_tse_governance_platform_state == 'present'
  susunola.tencentcloud.tse_governance_lane_group:
  args: "{{ item | combine({'instance_id': _tc_tse_governance_platform_instance_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_governance_platform_lane_groups }}"
  loop_control: {label: "{{ item.name | default(item.lane_group_id | default('unnamed')) }}"}
  register: _tc_tse_governance_platform_lane_groups

- name: Reconcile TSE configuration groups
  when: tc_tse_governance_platform_state == 'present'
  susunola.tencentcloud.tse_config_file_group:
  args: "{{ item | combine({'instance_id': _tc_tse_governance_platform_instance_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_governance_platform_config_groups }}"
  loop_control: {label: "{{ item.namespace | default('?') }}/{{ item.name | default('unnamed') }}"}
  register: _tc_tse_governance_platform_config_groups

- name: Reconcile TSE configuration files
  when: tc_tse_governance_platform_state == 'present'
  susunola.tencentcloud.tse_config_file:
  args: "{{ item | combine({'instance_id': _tc_tse_governance_platform_instance_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_governance_platform_config_files }}"
  loop_control: {label: "{{ item.namespace | default('?') }}/{{ item.group | default('?') }}/{{ item.name | default('unnamed') }}"}
  register: _tc_tse_governance_platform_config_files

- name: Reconcile TSE configuration releases
  when: tc_tse_governance_platform_state == 'present'
  susunola.tencentcloud.tse_config_file_release:
  args: "{{ item | combine({'instance_id': _tc_tse_governance_platform_instance_id, 'state': 'present'}) }}"
  loop: "{{ tc_tse_governance_platform_config_releases }}"
  loop_control: {label: "{{ item.namespace | default('?') }}/{{ item.group | default('?') }}/{{ item.name | default('?') }}@{{ item.release_name | default('unnamed') }}"}
  register: _tc_tse_governance_platform_config_releases

- name: Publish TSE governance platform outputs
  when: tc_tse_governance_platform_state == 'present'
  ansible.builtin.set_fact:
    tc_tse_governance_platform_result:
      engine: "{{ _tc_tse_governance_platform_engine.instance }}"
      access_address: "{{ _tc_tse_governance_platform_access_address.access_address }}"
      namespaces: "{{ _tc_tse_governance_platform_namespaces.results | default([]) | map(attribute='namespace') | list }}"
      services: "{{ _tc_tse_governance_platform_services.results | default([]) | map(attribute='service') | list }}"
      instances: "{{ _tc_tse_governance_platform_instances.results | default([]) | map(attribute='governance_instance') | list }}"
      aliases: "{{ _tc_tse_governance_platform_aliases.results | default([]) | map(attribute='alias_info') | list }}"
      lane_groups: "{{ _tc_tse_governance_platform_lane_groups.results | default([]) | map(attribute='lane_group') | list }}"
      config_groups: "{{ _tc_tse_governance_platform_config_groups.results | default([]) | map(attribute='group') | list }}"
      config_files: "{{ _tc_tse_governance_platform_config_files.results | default([]) | map(attribute='config_file') | list }}"
      config_releases: "{{ _tc_tse_governance_platform_config_releases.results | default([]) | map(attribute='release') | list }}"

- name: Require engine ID for deterministic teardown
  when:
    - tc_tse_governance_platform_state == 'absent'
    - tc_tse_governance_platform_engine.instance_id | default('') | length == 0
  ansible.builtin.fail:
    msg: engine.instance_id is required for deterministic TSE governance teardown.

- name: Remove TSE configuration releases
  when: tc_tse_governance_platform_state == 'absent'
  susunola.tencentcloud.tse_config_file_release:
    instance_id: "{{ tc_tse_governance_platform_engine.instance_id }}"
    namespace: "{{ item.namespace }}"
    group: "{{ item.group }}"
    name: "{{ item.name }}"
    release_name: "{{ item.release_name }}"
    release_id: "{{ item.release_id | default(omit) }}"
    state: absent
  loop: "{{ tc_tse_governance_platform_config_releases | reverse | list }}"
  loop_control: {label: "{{ item.namespace | default('?') }}/{{ item.group | default('?') }}/{{ item.name | default('?') }}@{{ item.release_name | default('unnamed') }}"}

- name: Remove TSE configuration files
  when: tc_tse_governance_platform_state == 'absent'
  susunola.tencentcloud.tse_config_file:
  args: "{{ item | combine({'instance_id': tc_tse_governance_platform_engine.instance_id, 'state': 'absent'}) }}"
  loop: "{{ tc_tse_governance_platform_config_files | reverse | list }}"

- name: Remove TSE configuration groups
  when: tc_tse_governance_platform_state == 'absent'
  susunola.tencentcloud.tse_config_file_group:
  args: "{{ item | combine({'instance_id': tc_tse_governance_platform_engine.instance_id, 'state': 'absent'}) }}"
  loop: "{{ tc_tse_governance_platform_config_groups | reverse | list }}"

- name: Remove TSE governance service aliases
  when: tc_tse_governance_platform_state == 'absent'
  susunola.tencentcloud.tse_governance_alias:
    instance_id: "{{ tc_tse_governance_platform_engine.instance_id }}"
    alias: "{{ item.alias }}"
    alias_namespace: "{{ item.alias_namespace }}"
    state: absent
  loop: "{{ tc_tse_governance_platform_aliases | reverse | list }}"
  loop_control: {label: "{{ item.alias_namespace | default('?') }}/{{ item.alias | default('unnamed') }}"}

- name: Remove TSE governance lane groups
  when: tc_tse_governance_platform_state == 'absent'
  susunola.tencentcloud.tse_governance_lane_group:
    instance_id: "{{ tc_tse_governance_platform_engine.instance_id }}"
    lane_group_id: "{{ item.lane_group_id | default(omit) }}"
    name: "{{ item.name | default(omit) }}"
    state: absent
  loop: "{{ tc_tse_governance_platform_lane_groups | reverse | list }}"
  loop_control: {label: "{{ item.name | default(item.lane_group_id | default('unnamed')) }}"}

- name: Remove TSE governance service instances
  when: tc_tse_governance_platform_state == 'absent'
  susunola.tencentcloud.tse_governance_instance:
    instance_id: "{{ tc_tse_governance_platform_engine.instance_id }}"
    governance_instance_id: "{{ item.governance_instance_id | default(omit) }}"
    namespace: "{{ item.namespace }}"
    service: "{{ item.service }}"
    host: "{{ item.host }}"
    port: "{{ item.port }}"
    state: absent
  loop: "{{ tc_tse_governance_platform_instances | reverse | list }}"
  loop_control: {label: "{{ item.namespace | default('?') }}/{{ item.service | default('?') }}/{{ item.host | default('?') }}:{{ item.port | default('?') }}"}

- name: Remove TSE governance services
  when: tc_tse_governance_platform_state == 'absent'
  susunola.tencentcloud.tse_governance_service:
  args: "{{ item | combine({'instance_id': tc_tse_governance_platform_engine.instance_id, 'state': 'absent'}) }}"
  loop: "{{ tc_tse_governance_platform_services | reverse | list }}"

- name: Remove TSE governance namespaces
  when: tc_tse_governance_platform_state == 'absent'
  susunola.tencentcloud.tse_governance_namespace:
  args: "{{ item | combine({'instance_id': tc_tse_governance_platform_engine.instance_id, 'state': 'absent'}) }}"
  loop: "{{ tc_tse_governance_platform_namespaces | reverse | list }}"

- name: Remove TSE registry engine
  when: tc_tse_governance_platform_state == 'absent'
  susunola.tencentcloud.tse_sre_instance:
  args: "{{ tc_tse_governance_platform_engine | combine({'state': 'absent'}) }}"
