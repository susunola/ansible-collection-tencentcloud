---
- name: Resolve existing Prometheus instance ID for teardown
  when:
    - tc_prometheus_platform_state == 'absent'
    - tc_prometheus_platform_instance_id | length == 0
    - tc_prometheus_platform_name | length > 0
  ansible.builtin.set_fact:
    tc_prometheus_platform_instance_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_prometheus_platform_name,
                resource_type='prometheus_instance', region=tc_prometheus_platform_region) }}

- name: Validate Prometheus platform inputs
  ansible.builtin.assert:
    that:
      - tc_prometheus_platform_state in ['present', 'absent']
      - tc_prometheus_platform_instance_id | length > 0 or tc_prometheus_platform_name | length > 0
      - tc_prometheus_platform_state == 'present' or tc_prometheus_platform_instance_id | length > 0
      - tc_prometheus_platform_state == 'absent' or tc_prometheus_platform_instance_id | length > 0 or tc_prometheus_platform_vpc_id | length > 0
      - tc_prometheus_platform_state == 'absent' or tc_prometheus_platform_instance_id | length > 0 or tc_prometheus_platform_subnet_id | length > 0
      - tc_prometheus_platform_state == 'absent' or tc_prometheus_platform_instance_id | length > 0 or tc_prometheus_platform_zone | length > 0
    fail_msg: Prometheus creation requires VPC, subnet and zone; teardown requires a resolvable instance ID.

- name: Provision Managed Prometheus instance
  when: tc_prometheus_platform_state == 'present'
  susunola.tencentcloud.monitor_prometheus_instance:
    region: "{{ tc_prometheus_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ tc_prometheus_platform_instance_id | default(omit, true) }}"
    name: "{{ tc_prometheus_platform_name | default(omit, true) }}"
    vpc_id: "{{ tc_prometheus_platform_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_prometheus_platform_subnet_id | default(omit, true) }}"
    zone: "{{ tc_prometheus_platform_zone | default(omit, true) }}"
    retention_days: "{{ tc_prometheus_platform_retention_days }}"
    grafana_instance_id: "{{ tc_prometheus_platform_grafana_instance_id | default(omit, true) }}"
    tags: "{{ tc_prometheus_platform_tags }}"
    instance_attributes: "{{ tc_prometheus_platform_instance_attributes }}"
  register: _tc_prometheus_platform_instance

- name: Resolve Managed Prometheus instance ID
  when: tc_prometheus_platform_state == 'present'
  ansible.builtin.set_fact:
    _tc_prometheus_platform_instance_id: >-
      {{ tc_prometheus_platform_instance_id
         or (_tc_prometheus_platform_instance.instance.InstanceId | default('')) }}

- name: Configure Prometheus Alertmanager
  when:
    - tc_prometheus_platform_state == 'present'
    - _tc_prometheus_platform_instance_id | length > 0
    - tc_prometheus_platform_alertmanager_config is not none
  susunola.tencentcloud.monitor_prometheus_alertmanager_config:
    region: "{{ tc_prometheus_platform_region | default(omit, true) }}"
    instance_id: "{{ _tc_prometheus_platform_instance_id }}"
    config: "{{ tc_prometheus_platform_alertmanager_config }}"
  register: _tc_prometheus_platform_alertmanager

- name: Configure Prometheus global notification
  when:
    - tc_prometheus_platform_state == 'present'
    - _tc_prometheus_platform_instance_id | length > 0
    - tc_prometheus_platform_global_notification is not none
  susunola.tencentcloud.monitor_prometheus_global_notification:
    region: "{{ tc_prometheus_platform_region | default(omit, true) }}"
    instance_id: "{{ _tc_prometheus_platform_instance_id }}"
    notification: "{{ tc_prometheus_platform_global_notification }}"
  register: _tc_prometheus_platform_notification

- name: Reconcile Prometheus Grafana bindings
  when:
    - tc_prometheus_platform_state == 'present'
    - _tc_prometheus_platform_instance_id | length > 0
  susunola.tencentcloud.monitor_prometheus_grafana_binding:
    region: "{{ tc_prometheus_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ _tc_prometheus_platform_instance_id }}"
    grafana_id: "{{ item }}"
  loop: "{{ tc_prometheus_platform_grafana_bindings }}"
  register: _tc_prometheus_platform_grafana

- name: Reconcile Prometheus recording rules
  when:
    - tc_prometheus_platform_state == 'present'
    - _tc_prometheus_platform_instance_id | length > 0
  susunola.tencentcloud.monitor_prometheus_record_rule:
    region: "{{ tc_prometheus_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ _tc_prometheus_platform_instance_id }}"
    name: "{{ item.name }}"
    content: "{{ item.content }}"
  loop: "{{ tc_prometheus_platform_record_rules }}"
  loop_control: {label: "{{ item.name }}"}
  register: _tc_prometheus_platform_record_rules

- name: Reconcile Prometheus alert groups
  when:
    - tc_prometheus_platform_state == 'present'
    - _tc_prometheus_platform_instance_id | length > 0
  susunola.tencentcloud.monitor_prometheus_alert_group:
    region: "{{ tc_prometheus_platform_region | default(omit, true) }}"
    state: present
    instance_id: "{{ _tc_prometheus_platform_instance_id }}"
    group_id: "{{ item.group_id | default(omit, true) }}"
    name: "{{ item.name | default(omit, true) }}"
    enabled: "{{ item.enabled | default(true) }}"
    receivers: "{{ item.receivers | default([]) }}"
    custom_receiver: "{{ item.custom_receiver | default(omit) }}"
    repeat_interval: "{{ item.repeat_interval | default('1h') }}"
    rules: "{{ item.rules | default([]) }}"
  loop: "{{ tc_prometheus_platform_alert_groups }}"
  loop_control:
    label: "{{ item.name | default(item.group_id | default('alert group')) }}"
  register: _tc_prometheus_platform_alert_groups

- name: Reconcile Prometheus cluster agents and scrape jobs
  when:
    - tc_prometheus_platform_state == 'present'
    - _tc_prometheus_platform_instance_id | length > 0
  ansible.builtin.include_tasks: cluster_agent.yml
  loop: "{{ tc_prometheus_platform_cluster_agents }}"
  loop_control:
    loop_var: _tc_prometheus_agent
    label: "{{ _tc_prometheus_agent.cluster_id }}"

- name: Remove Prometheus scrape jobs and cluster agents
  when: tc_prometheus_platform_state == 'absent'
  ansible.builtin.include_tasks: teardown_cluster_agent.yml
  loop: "{{ tc_prometheus_platform_cluster_agents }}"
  loop_control:
    loop_var: _tc_prometheus_agent
    label: "{{ _tc_prometheus_agent.cluster_id }}"

- name: Remove Prometheus alert groups
  when: tc_prometheus_platform_state == 'absent'
  susunola.tencentcloud.monitor_prometheus_alert_group:
    region: "{{ tc_prometheus_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_prometheus_platform_instance_id }}"
    group_id: "{{ item.group_id | default(omit, true) }}"
    name: "{{ item.name | default(omit, true) }}"
  loop: "{{ tc_prometheus_platform_alert_groups }}"

- name: Remove Prometheus recording rules
  when: tc_prometheus_platform_state == 'absent'
  susunola.tencentcloud.monitor_prometheus_record_rule:
    region: "{{ tc_prometheus_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_prometheus_platform_instance_id }}"
    name: "{{ item.name }}"
  loop: "{{ tc_prometheus_platform_record_rules }}"

- name: Unbind Prometheus Grafana instances
  when: tc_prometheus_platform_state == 'absent'
  susunola.tencentcloud.monitor_prometheus_grafana_binding:
    region: "{{ tc_prometheus_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_prometheus_platform_instance_id }}"
    grafana_id: "{{ item }}"
  loop: "{{ tc_prometheus_platform_grafana_bindings }}"

- name: Remove Managed Prometheus instance
  when: tc_prometheus_platform_state == 'absent'
  susunola.tencentcloud.monitor_prometheus_instance:
    region: "{{ tc_prometheus_platform_region | default(omit, true) }}"
    state: absent
    instance_id: "{{ tc_prometheus_platform_instance_id }}"

- name: Publish Prometheus platform result
  when: tc_prometheus_platform_state == 'present'
  ansible.builtin.set_fact:
    tc_prometheus_platform_result:
      instance_id: "{{ _tc_prometheus_platform_instance_id }}"
      instance: "{{ _tc_prometheus_platform_instance.instance | default({}) }}"
      record_rules: "{{ _tc_prometheus_platform_record_rules | default({}) }}"
      alert_groups: "{{ _tc_prometheus_platform_alert_groups | default({}) }}"
