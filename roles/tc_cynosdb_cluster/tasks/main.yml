---
- name: Resolve existing CynosDB cluster ID for teardown
  when:
    - tc_cynosdb_cluster_state == 'absent'
    - tc_cynosdb_cluster_id | length == 0
    - tc_cynosdb_cluster_name | length > 0
  ansible.builtin.set_fact:
    tc_cynosdb_cluster_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_cynosdb_cluster_name,
                resource_type='cynosdb_cluster', region=tc_cynosdb_cluster_region) }}

- name: Validate CynosDB cluster inputs
  ansible.builtin.assert:
    that:
      - tc_cynosdb_cluster_state in ['present', 'absent']
      - tc_cynosdb_cluster_id | length > 0 or tc_cynosdb_cluster_name | length > 0
      - tc_cynosdb_cluster_state == 'present' or tc_cynosdb_cluster_id | length > 0
      - tc_cynosdb_cluster_state == 'absent' or tc_cynosdb_cluster_id | length > 0 or tc_cynosdb_cluster_zone | length > 0
      - tc_cynosdb_cluster_state == 'absent' or tc_cynosdb_cluster_id | length > 0 or tc_cynosdb_cluster_cpu is not none
      - tc_cynosdb_cluster_state == 'absent' or tc_cynosdb_cluster_id | length > 0 or tc_cynosdb_cluster_memory is not none
      - tc_cynosdb_cluster_state == 'absent' or tc_cynosdb_cluster_id | length > 0 or tc_cynosdb_cluster_storage is not none
      - not tc_cynosdb_cluster_purge or tc_cynosdb_cluster_state == 'absent'
    fail_msg: CynosDB creation requires placement and sizing; purge is valid only during teardown.

- name: Provision CynosDB cluster
  when: tc_cynosdb_cluster_state == 'present'
  susunola.tencentcloud.cynosdb_cluster:
    region: "{{ tc_cynosdb_cluster_region | default(omit, true) }}"
    state: present
    cluster_id: "{{ tc_cynosdb_cluster_id | default(omit, true) }}"
    name: "{{ tc_cynosdb_cluster_name | default(omit, true) }}"
    zone: "{{ tc_cynosdb_cluster_zone | default(omit, true) }}"
    slave_zone: "{{ tc_cynosdb_cluster_slave_zone | default(omit, true) }}"
    vpc_id: "{{ tc_cynosdb_cluster_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_cynosdb_cluster_subnet_id | default(omit, true) }}"
    db_type: "{{ tc_cynosdb_cluster_db_type }}"
    db_version: "{{ tc_cynosdb_cluster_db_version | default(omit, true) }}"
    cynos_version: "{{ tc_cynosdb_cluster_cynos_version | default(omit, true) }}"
    cpu: "{{ tc_cynosdb_cluster_cpu | default(omit) }}"
    memory: "{{ tc_cynosdb_cluster_memory | default(omit) }}"
    instance_count: "{{ tc_cynosdb_cluster_instance_count }}"
    storage: "{{ tc_cynosdb_cluster_storage | default(omit) }}"
    admin_password: "{{ tc_cynosdb_cluster_admin_password | default(omit, true) }}"
    port: "{{ tc_cynosdb_cluster_port }}"
    pay_mode: "{{ tc_cynosdb_cluster_pay_mode }}"
    period_months: "{{ tc_cynosdb_cluster_period_months }}"
    auto_renew: "{{ tc_cynosdb_cluster_auto_renew }}"
    security_group_ids: "{{ tc_cynosdb_cluster_security_group_ids }}"
  register: _tc_cynosdb_cluster

- name: Resolve CynosDB cluster ID
  when: tc_cynosdb_cluster_state == 'present'
  ansible.builtin.set_fact:
    _tc_cynosdb_cluster_id: >-
      {{ tc_cynosdb_cluster_id
         or (_tc_cynosdb_cluster.cluster.ClusterId | default('')) }}

- name: Reconcile CynosDB accounts and privileges
  ansible.builtin.include_tasks: account.yml
  loop: "{{ tc_cynosdb_cluster_accounts }}"
  loop_control:
    loop_var: _tc_cynosdb_account
    label: "{{ _tc_cynosdb_account.account_name }}@{{ _tc_cynosdb_account.host | default('%') }}"

- name: Configure CynosDB automatic backups
  when:
    - tc_cynosdb_cluster_state == 'present'
    - tc_cynosdb_cluster_backup_enabled
  susunola.tencentcloud.cynosdb_backup_config:
    region: "{{ tc_cynosdb_cluster_region | default(omit, true) }}"
    cluster_id: "{{ _tc_cynosdb_cluster_id }}"
    backup_start: "{{ tc_cynosdb_cluster_backup_start }}"
    backup_end: "{{ tc_cynosdb_cluster_backup_end }}"
    retention_seconds: "{{ tc_cynosdb_cluster_backup_retention_seconds }}"
  register: _tc_cynosdb_cluster_backup

- name: Isolate or purge CynosDB cluster
  when: tc_cynosdb_cluster_state == 'absent'
  susunola.tencentcloud.cynosdb_cluster:
    region: "{{ tc_cynosdb_cluster_region | default(omit, true) }}"
    state: absent
    cluster_id: "{{ tc_cynosdb_cluster_id }}"
    purge: "{{ tc_cynosdb_cluster_purge }}"

- name: Publish CynosDB cluster result
  when: tc_cynosdb_cluster_state == 'present'
  ansible.builtin.set_fact:
    tc_cynosdb_cluster_result:
      cluster_id: "{{ _tc_cynosdb_cluster_id }}"
      cluster: "{{ _tc_cynosdb_cluster.cluster }}"
      backup: "{{ _tc_cynosdb_cluster_backup | default({}) }}"
