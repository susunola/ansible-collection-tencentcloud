---
# Cross-region disaster recovery artifacts:
#   1. a golden CVM image refreshed from a source instance in the primary
#      region (the recovery point used to rebuild the fleet),
#   2. COS bucket replication from the primary bucket to the DR region
#      (the data plane replica),
#   3. an optional standby CLB pre-wired in the DR region as the failover
#      entry point (backends are attached after the replica fleet is rebuilt).
# Lifecycle: present creates/updates, absent removes in reverse order
# (standby CLB -> replication -> image).
tc_dr_state: present

# ---- Golden image (primary region) ------------------------------------
# The cvm_image module creates the image on first run and only updates the
# name/description afterwards; it does not re-snapshot the instance on every
# run. Refresh the golden image by removing it (state=absent) and running the
# role again when a new baseline is needed.
tc_dr_enable_image: true
tc_dr_image_id: ""
tc_dr_image_name: ""
tc_dr_image_instance_id: ""
tc_dr_image_description: ""
tc_dr_image_force_poweroff: false
tc_dr_image_sysprep: false
tc_dr_image_delete_binded_snap: false

# ---- COS cross-region replication (primary -> DR) ---------------------
# Each rule must carry the DR-region destination bucket, for example:
#   - ID: replica
#     Status: Enabled
#     Prefix: ""
#     Destination: {Bucket: "qcs::cos:ap-singapore::dr-bucket-125xxxx", StorageClass: STANDARD}
tc_dr_enable_cos: true
tc_dr_bucket_name: ""
tc_dr_bucket_appid: ""
tc_dr_replication_role: ""
tc_dr_replication_rules: []

# ---- Standby CLB in the DR region -------------------------------------
# Created with region=tc_dr_dr_region. Backends are only reconciled when
# tc_dr_targets is non-empty, so the standby can be wired before failover.
tc_dr_enable_clb: false
tc_dr_clb_id: ""
tc_dr_clb_name: ""
tc_dr_clb_type: OPEN
tc_dr_clb_vpc_id: ""
tc_dr_clb_subnet_id: ""
tc_dr_clb_tags: {}
tc_dr_listener_port: 80
tc_dr_listener_protocol: TCP
tc_dr_listener_name: ""
tc_dr_scheduler: WRR
tc_dr_session_expire_time: 0
tc_dr_health_check:
  health_switch: true
  interval_time: 5
  health_num: 3
  un_health_num: 3
  time_out: 2
  check_type: TCP
# DR-region backends, e.g. [{instance_id: ins-xxxx, port: 8080, weight: 10}]
tc_dr_targets: []
tc_dr_purge: true

# Waiter tuning
tc_dr_waiter_timeout: 300
tc_dr_waiter_delay: 5
