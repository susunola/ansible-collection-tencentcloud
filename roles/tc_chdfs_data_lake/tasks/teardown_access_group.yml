---
- name: Resolve CHDFS access group ID for teardown
  ansible.builtin.set_fact:
    _tc_chdfs_access_group_id: >-
      {{ _tc_chdfs_access_group.access_group_id | default('')
         or lookup('susunola.tencentcloud.resource_id', _tc_chdfs_access_group.name,
                   resource_type='chdfs_access_group', region=tc_chdfs_data_lake_region) }}

- name: Remove CHDFS access rules
  susunola.tencentcloud.chdfs_access_rules:
    region: "{{ tc_chdfs_data_lake_region }}"
    access_group_id: "{{ _tc_chdfs_access_group_id }}"
    rules: []

- name: Remove CHDFS access group
  susunola.tencentcloud.chdfs_access_group:
    region: "{{ tc_chdfs_data_lake_region }}"
    state: absent
    access_group_id: "{{ _tc_chdfs_access_group_id }}"
