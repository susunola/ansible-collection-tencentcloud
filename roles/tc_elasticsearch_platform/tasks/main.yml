---
- name: Resolve Elasticsearch instance ID for teardown
  when:
    - tc_elasticsearch_platform_state == 'absent'
    - tc_elasticsearch_platform_instance_id | length == 0
    - tc_elasticsearch_platform_name | length > 0
  ansible.builtin.set_fact:
    tc_elasticsearch_platform_instance_id: >-
      {{ lookup('susunola.tencentcloud.resource_id', tc_elasticsearch_platform_name,
                resource_type='elasticsearch_instance', region=tc_elasticsearch_platform_region) }}

- name: Validate Elasticsearch platform inputs
  ansible.builtin.assert:
    that:
      - tc_elasticsearch_platform_state in ['present', 'absent']
      - tc_elasticsearch_platform_region | length > 0
      - tc_elasticsearch_platform_instance_id | length > 0 or tc_elasticsearch_platform_name | length > 0
      - tc_elasticsearch_platform_state == 'present' or tc_elasticsearch_platform_instance_id | length > 0
      - tc_elasticsearch_platform_indices | length == 0 or tc_elasticsearch_platform_password | length > 0
    fail_msg: Elasticsearch requires a region and cluster identity; index operations additionally require the cluster password.

- name: Provision Elasticsearch instance
  when: tc_elasticsearch_platform_state == 'present'
  susunola.tencentcloud.elasticsearch_instance:
    region: "{{ tc_elasticsearch_platform_region }}"
    state: present
    instance_id: "{{ tc_elasticsearch_platform_instance_id | default(omit, true) }}"
    name: "{{ tc_elasticsearch_platform_name | default(omit, true) }}"
    zone: "{{ tc_elasticsearch_platform_zone | default(omit, true) }}"
    es_version: "{{ tc_elasticsearch_platform_version | default(omit, true) }}"
    vpc_id: "{{ tc_elasticsearch_platform_vpc_id | default(omit, true) }}"
    subnet_id: "{{ tc_elasticsearch_platform_subnet_id | default(omit, true) }}"
    password: "{{ tc_elasticsearch_platform_password | default(omit, true) }}"
    node_type: "{{ tc_elasticsearch_platform_node_type | default(omit, true) }}"
    node_num: "{{ tc_elasticsearch_platform_node_num | default(omit, true) }}"
    disk_type: "{{ tc_elasticsearch_platform_disk_type | default(omit, true) }}"
    disk_size: "{{ tc_elasticsearch_platform_disk_size | default(omit, true) }}"
    license_type: "{{ tc_elasticsearch_platform_license_type | default(omit, true) }}"
  no_log: "{{ tc_elasticsearch_platform_password | length > 0 }}"
  register: _tc_elasticsearch_instance

- name: Resolve Elasticsearch instance ID
  when: tc_elasticsearch_platform_state == 'present'
  ansible.builtin.set_fact:
    _tc_elasticsearch_instance_id: >-
      {{ tc_elasticsearch_platform_instance_id
         or (_tc_elasticsearch_instance.instance.InstanceId | default('')) }}

- name: Reconcile Elasticsearch indexes
  when:
    - tc_elasticsearch_platform_state == 'present'
    - _tc_elasticsearch_instance_id | length > 0
  susunola.tencentcloud.elasticsearch_index:
    region: "{{ tc_elasticsearch_platform_region }}"
    state: present
    instance_id: "{{ _tc_elasticsearch_instance_id }}"
    name: "{{ item.name }}"
    index_type: "{{ item.index_type | default('normal') }}"
    metadata: "{{ item.metadata }}"
    username: "{{ item.username | default(tc_elasticsearch_platform_username) }}"
    password: "{{ item.password | default(tc_elasticsearch_platform_password) }}"
  loop: "{{ tc_elasticsearch_platform_indices }}"
  no_log: true
  register: _tc_elasticsearch_indices

- name: Reconcile Elasticsearch snapshots
  when:
    - tc_elasticsearch_platform_state == 'present'
    - _tc_elasticsearch_instance_id | length > 0
  susunola.tencentcloud.elasticsearch_snapshot:
  args: "{{ item | combine({'state': 'present', 'instance_id': _tc_elasticsearch_instance_id, 'region': tc_elasticsearch_platform_region}) }}"
  loop: "{{ tc_elasticsearch_platform_snapshots }}"
  register: _tc_elasticsearch_snapshots

- name: Remove Elasticsearch snapshots
  when: tc_elasticsearch_platform_state == 'absent'
  susunola.tencentcloud.elasticsearch_snapshot:
  args: "{{ item | combine({'state': 'absent', 'instance_id': tc_elasticsearch_platform_instance_id, 'region': tc_elasticsearch_platform_region}) }}"
  loop: "{{ tc_elasticsearch_platform_snapshots }}"

- name: Remove Elasticsearch indexes
  when: tc_elasticsearch_platform_state == 'absent'
  susunola.tencentcloud.elasticsearch_index:
    region: "{{ tc_elasticsearch_platform_region }}"
    state: absent
    instance_id: "{{ tc_elasticsearch_platform_instance_id }}"
    name: "{{ item.name }}"
    index_type: "{{ item.index_type | default('normal') }}"
    username: "{{ item.username | default(tc_elasticsearch_platform_username) }}"
    password: "{{ item.password | default(tc_elasticsearch_platform_password) }}"
  loop: "{{ tc_elasticsearch_platform_indices }}"
  no_log: true

- name: Remove Elasticsearch instance
  when: tc_elasticsearch_platform_state == 'absent'
  susunola.tencentcloud.elasticsearch_instance:
    region: "{{ tc_elasticsearch_platform_region }}"
    state: absent
    instance_id: "{{ tc_elasticsearch_platform_instance_id }}"

- name: Publish Elasticsearch platform result
  when: tc_elasticsearch_platform_state == 'present'
  ansible.builtin.set_fact:
    tc_elasticsearch_platform_result:
      instance_id: "{{ _tc_elasticsearch_instance_id }}"
      instance: "{{ _tc_elasticsearch_instance.instance | default({}) }}"
      indices: "{{ _tc_elasticsearch_indices | default({}) }}"
      snapshots: "{{ _tc_elasticsearch_snapshots | default({}) }}"
