# antsibull-docs configuration for the susunola.tencentcloud docsite.
#
# Regenerate a skeleton with:
#   antsibull-docs sphinx-init --use-current --dest-dir <dir> susunola.tencentcloud
# The committed copy is edited: `collection_url` / `collection_install`
# point at the project instead of Galaxy.

breadcrumbs = true
indexes = true
use_html_blobs = false
add_antsibull_docs_version = true

collection_url = {
  * = "https://github.com/susunola/ansible-collection-tencentcloud"
}

collection_install = {
  * = "ansible-galaxy collection install {namespace}.{name}"
}
