---
minor_changes:
  - >-
    tests - gate a blind spot no other census covered: a module whose test file
    only exercises its helpers never executes the body that talks to the API.
    Such a module is referenced (so the "no test references it" census is
    satisfied) and needs no private harness (so that census is satisfied too),
    which is why four slipped through:
    ``config_aggregate_delivery_info``, ``cos_bucket_domain_info``,
    ``monitor_grafana_whitelist_info`` and
    ``monitor_prometheus_alertmanager_config_info``.
    ``check_quality_gates.py`` now freezes them in
    ``scripts/quality_baselines/untested_main_path.txt`` (shrink-only): a
    module with tests must have at least one that drives ``run_module``.
    All four now have end-to-end tests through the shared harness (the
    delivery reader, the COS domain reader with its real get_domains path, and
    the Grafana and Alertmanager readers with their audit-trail assertions), so
    that census is zero and its baseline file is deleted -- a paid-off family
    needs no file, by the same rule the untested_modules baseline followed.
