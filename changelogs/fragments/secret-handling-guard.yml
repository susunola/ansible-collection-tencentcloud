---
minor_changes:
  - >-
    scripts/check_secret_handling.py - new guard, wired into CI as "Secrets
    cannot reach a log". ``no_log: True`` is the only thing that keeps an
    option's value out of the controller log, ``-v`` output and the callbacks,
    and nothing checked that the options which need it have it: a module could
    add ``db_password`` to its argument spec and have it printed on every run.
    The guard reads every argument spec in ``plugins/`` (modules, doc
    fragments, shared specs -- at any nesting depth) and fails when an option
    that is a secret by name does not declare ``no_log``, or when a message
    built with ``%``, ``.format()`` or an f-string interpolates one. The
    census is clean today -- 71 secret-shaped options, 53 with ``no_log``, 18
    flags that carry no secret, zero interpolations -- which is the point:
    this keeps it that way. Two cases are deliberately out of scope, because
    a name-based rule that flagged them would be switched off: a flag such as
    ``rotate_password`` cannot carry a credential, and ``client_token`` is an
    SDK idempotency token that ``tc_api_calls`` echoes on purpose.
