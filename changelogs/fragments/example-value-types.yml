---
minor_changes:
  - >-
    scripts/check_module_examples.py - new ``types`` rule: a scalar in an
    example must match the type the option declares (templated values
    skipped, quoted scalars accepted where the argspec casts them, module
    documentation wins over fragment types exactly like the runtime argspec).
  - >-
    scripts/check_quality_gates.py - two new ratchets:
    ``return_sample_type_findings()`` (a RETURN ``sample`` must not
    contradict its declared ``type``) and ``fragment_shadow_findings()`` (a
    module re-declaring a fragment option with a different type shadows the
    shared feature; the grandfathered sites are frozen in
    ``scripts/quality_baselines/fragment_shadowing.txt``).
