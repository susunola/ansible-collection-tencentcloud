    tests -- but the wiring mutant (``sdk_call`` bypassing ``retry_on``)
    survived the entire suite until these tests. Re-running it now kills
    exactly the new test.
  - >-
    docs - record the module_utils mutation triad and the wiring-gap story
    in ``docs/inclusion-remediation.md``.
