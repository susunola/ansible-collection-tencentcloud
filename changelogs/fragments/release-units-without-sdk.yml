minor_changes:
  - >-
    release workflow - ``ansible-test units`` could fail on a tag while the
    same suite passed on ``main``: CI installs ``requirements.txt`` (and the
    pinned SDK) in the same job, so unit tests silently had the SDK
    importable, while the release workflow installed only ansible-core. The
    release workflow now installs the same dependency set as CI, so the two
    agree.
  - >-
    tests - the COS AppId unit tests no longer import the real
    ``tencentcloud`` SDK. ``fetch_appid`` only needs a client class and a
    request object to hand to the module double, so the tests now stub
    ``tencentcloud.cam`` / ``tencentcloud.sts`` in ``sys.modules`` and run in
    an SDK-free environment as well as an SDK-provided one.
