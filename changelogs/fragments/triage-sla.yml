---
minor_changes:
  - >-
    docs/triage.md defines a 48-hour first-response SLA on issues and pull
    requests, the label set used to triage them (triage, needs-info, module,
    dependencies, sla-breach, good first issue), and what counts as a
    response (human comments and submitted reviews, never bot comments).
  - >-
    scripts/triage_sla.py measures that SLA from the GitHub API and prints
    one row per item with its age, response time, and one of four statuses
    (OK, LATE, WAITING, BREACH). Only BREACH -- unanswered and overdue --
    fails --check, because it is the only one that is still actionable; a
    late answer is history, and failing on it would leave CI red on an item
    nobody can clear except by closing it. --exclude-author drops items a
    maintainer opened, which can never receive a first response.
