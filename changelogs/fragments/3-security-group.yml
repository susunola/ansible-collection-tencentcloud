minor_changes:
  - security_group - add the first idempotent resource module with
    present/absent state, check mode, diff output, and tag management.
  - module_utils - split the single-file helper into focused modules
    (errors, retries, paging, tagging, comparison, waiters, client, base);
    the original tencentcloud module remains as a backward-compatible shim.
  - module_utils - all new modules share a retry policy with exponential
    backoff and jitter for throttled and transient API failures.
  - module_utils - add a unified offset/limit paginator replacing the
    hand-rolled loops in the discovery modules.
  - integration - add a real-account security_group integration test target
    covering create/idempotency/check-mode/delete.
