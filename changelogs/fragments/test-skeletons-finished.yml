---
minor_changes:
  - >-
    unit tests - finish the generated test skeletons. Eight test files were
    still byte-for-byte output of
    ``scripts/generate_module_test_skeleton.py``: their first line carried
    the generator's marker, which the script documents as "delete this line
    when you start hand-finishing", and most of their behavioural tests were
    ``xfail`` stubs annotated "TODO(human)". For those eight modules the file
    existed and asserted nothing about the module's behaviour, which is 22 of
    the suite's xfails and the reason a claim like "every module has a
    dedicated unit test" was true only nominally.
  - >-
    unit tests - hand-finish ssm_secret_version_info. The gate it documents
    -- secret material is read only when I(include_secret_value=true) is
    asked for -- had no test in either direction, so a regression would
    either put a secret into a task result nobody requested or silently
    withhold one that was requested. Both directions are asserted now, along
    with the two guard rails around them (a version id is required to read a
    value; encryption response options require the opt-in), the request id
    being reported separately from the payload, and the SDK error envelope. A
    mutation that removes the gate is caught by five tests.
  - >-
    unit tests - rewrite the api_gateway_api_key skeleton as the
    request-builder tests it actually was. The module's behaviour flows are
    covered by test_api_gateway_api_key_main.py; what that file cannot see is
    the request put on the wire, and one builder carries a credential:
    ``build_create`` copies I(access_key_secret) into the request in manual
    mode and must not invent one in auto mode, where the API generates the
    key. The three ``run_module`` stubs that duplicated the main file are
    gone.
  - >-
    scripts/check_quality_gates.py - ratchet the number of test files that
    are still unmodified generator skeletons. Nothing required a skeleton to
    ever be finished: the generator's ``--check`` verifies that a
    marker-bearing file still matches the generator, which is the opposite
    assertion. The new census is printed by every CI run and may only go
    down.
bugfixes:
  - >-
    api_gateway_api_key - return the generated secret on the run that creates
    the key. ``CreateApiKey`` is the only response that carries it --
    ``DescribeApiKey`` and ``DescribeApiKeysStatus`` never return it -- and
    the module passed every response through a helper that deleted
    ``AccessKeySecret`` unconditionally, so a key created in the default
    I(key_type=auto) mode had a credential the caller could never learn and
    the module's main purpose produced an unusable key. The value is still
    redacted by default; C(reveal_secret_value=true) now returns it on that
    one task, matching the pattern I(tse_gateway_secret_key),
    I(tione_model_service_auth_token) and I(ssm_secret_version_info) already
    use. The unit-test fake, which echoed the request's secret and therefore
    modelled auto mode as having no secret at all, now generates one the way
    the API does -- that is why the defect passed its own tests.
  - >-
    A sweep of every module that removes a secret-shaped field from a
    response found four others, and none of them is the same defect:
    ``key_pair`` moves the generated private key to its own return value
    rather than discarding it, ``mqtt_user`` and ``trabbit_serverless_user``
    redact a password the caller supplied, and
    ``tse_gateway_console_network`` redacts a credential that belongs to an
    existing console account and is not created by the module.
