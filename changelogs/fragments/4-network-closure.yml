major_changes:
  - modules - add STS AssumeRole support to every module via ``role_arn``,
    ``role_session_name`` and ``role_session_duration`` (env fallback
    ``TENCENTCLOUD_ROLE_ARN``); credentials are exchanged for temporary ones
    before any service call.
  - inventory - add the ``tencentcloud_cvm`` dynamic inventory plugin with
    constructed groups, composed hostvars and caching support.
minor_changes:
  - vpc - add an idempotent module managing VPCs (CIDR, DNS servers, domain
    name, tags) with check mode and diff.
  - subnet - add an idempotent module managing subnets (CIDR, zone, broadcast,
    tags) with check mode and diff.
  - route_table - add an idempotent module managing route tables and their
    user routes (full route reconciliation) with check mode and diff.
  - security_group_rule - add an idempotent module reconciling the
    ingress/egress rule set of a security group with optional purge.
  - eip - add an idempotent module allocating, releasing and binding elastic
    IP addresses with check mode and diff.
  - key_pair - add an idempotent module creating or importing SSH key pairs;
    generated private keys are returned once at creation.
  - cvm_instance - add an idempotent module managing the CVM instance
    lifecycle (present/absent/running/stopped) with state waiters.
  - subnet_info - add a read-only module querying subnets with IDs or API
    filters.
  - route_table_info - add a read-only module querying route tables with IDs
    or API filters.
  - eip_info - add a read-only module querying elastic IPs with IDs, IPs or
    API filters.
  - key_pair_info - add a read-only module querying key pairs with IDs or API
    filters.
  - meta - add the ``tencentcloud.cloud.all`` action group so
    ``module_defaults`` can set shared options (region, credentials,
    ``role_arn``) once per play.
  - integration - add a ``network`` target covering the vpc, subnet,
    route_table, security_group_rule and eip lifecycle against a real account.
bugfixes:
  - security_group - build ``Filter`` objects via attribute assignment; the
    real SDK ``Filter`` class does not accept constructor kwargs, which broke
    name-based lookups at runtime.
