---
bugfixes:
  - >-
    module docs - document the return values ``cvm_instance`` was already
    reporting. It returns C(count), C(instances) and
    C(terminated) in I(exact_count) mode, which is the point of that mode.
    A playbook that registers the result and branches on one of those had no
    way to know it existed.
minor_changes:
  - >-
    scripts/check_return_docs.py - new guard, wired into CI as "Modules
    document every key they return". Every keyword a module passes to
    C(exit_json) must appear in its C(RETURN) block or be one of the keys
    Ansible itself adds to every result, and a documented key the module never
    returns is reported too -- that direction is skipped for modules
    that splat a mapping, because a splat carries keys the check cannot read.
    Both directions were verified by mutation.
