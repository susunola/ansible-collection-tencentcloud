---
minor_changes:
  - >-
    integration tests - `security_group` now deletes in an `always` block. It
    was the only target that deleted on the success path
    only, which is precisely the path a failure skips, so a run that failed
    half way through left the group behind. Rewriting it also revealed a
    second trap: a `vars:` block is templated lazily, so the `| random` name
    would be re-rolled on every reference and the teardown would have deleted a
    name that was never created. The name is frozen with `set_fact` first, as
    every other target does.
  - >-
    scripts/audit_integration_targets.py - four new checks over
    `tests/integration/targets`. A target that creates a resource must delete
    it in an `always` block, must run something in check mode, and must freeze
    any `| random` name before using it; and every module
    `tests/integration/coverage.yml` credits to a target must actually be
    called by it. Each was verified by removing the thing it checks and
    watching it fail.
bugfixes:
  - >-
    tests - `GOOD_TASKS` in tests/unit/scripts/test_audit_integration_targets.py
    indented its `always:` inside an `ansible.builtin.assert` task. Ansible
    gives a task no `always`, so the fixture described a target that could not
    have run, and it passed because nothing checked the block structure until
    the teardown audit did.
