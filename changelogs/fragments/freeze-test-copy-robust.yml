---
bugfixes:
  - >-
    tests - stop the remediation-freeze test from depending on where it was
    copied to. It resolved its script through ``parents[3]``, which under
    ``ansible-test units`` points into a copy that holds the plugin tree but
    not ``scripts/``, so the unit-test step failed with a misleading
    ``ImportError: can't find '__main__' module``. It now locates the script by
    walking up from its own file and runs it as a subprocess -- the way a user
    does -- so no ``runpy`` path heuristic sits between the test and the exit
    status it is about; it skips with that reason when the tree genuinely does
    not contain the script.
