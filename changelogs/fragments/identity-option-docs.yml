---
minor_changes:
  - >-
    module docs - say which of an id and a name identifies the resource. 38
    core modules accept both for the same resource and described them as
    "Existing policy ID." and "Policy name.", which leaves a reader unable to
    tell whether both are needed or what happens when both are given. They now
    read "Identifies the policy to manage; one of this or O(name) is required,
    and the module matches on the id when it is given."
