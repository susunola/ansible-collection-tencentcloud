---
minor_changes:
  - triage - new .github/workflows/triage.yml automates the triage label flow
    described in docs/triage.md — ``triage`` is added when an issue or pull
    request is opened or reopened and cleared on the first human comment or
    submitted review, with bot comments deliberately not counting. A daily
    scheduled job runs scripts/triage_sla.py --check so an overdue first
    response fails the job instead of sitting in a report nobody reads. The
    workflow never checks out pull request code.
  - docs/porting.md - new "Version map and upgrade notes" section mapping all
    published releases with their change counts, plus upgrade notes
    for the three that are not a no-op (the 0.11.0 collection rename, the five
    renamed _info modules in 0.12.0 and the ansible-core 2.19 floor in 1.0.0).
