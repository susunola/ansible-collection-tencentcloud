minor_changes:
  - scripts/check_integration_defaults.py - new guard for the default dispatch
    list of the weekly credentialed integration run. The list is a string typed
    twice in .github/workflows/integration.yml and nothing compared either copy
    with tests/integration/coverage.yml or with the other copy, so editing one
    was a complete, silent, successful edit. docs/integration-env.md did state
    the rule -- free/low is dispatched, medium/high stays opt-in -- and the list
    still     carried two medium targets. The rule is now executed in CI -- the two
    copies must agree, every target must be registered, high is never
    dispatched, medium only when VETTED_MEDIUM records why it is safe
    unattended (cfs_file_system and clb_http, both torn down inside an
    ``always`` block), and a cheap target left out of the list is a failure
    too, because a
    target nobody runs is coverage the registry claims but does not have.
bugfixes:
  - docs/integration-env.md - the billing-guardrail, runbook and new-target
    sections restated the opt-in rule in prose and disagreed with the list the
    workflow actually dispatches; all three now point at the guard instead of
    restating a rule that prose cannot enforce.
  - docs/panorama.html - P2-04 claimed the changelog fragment directory was
    still empty; fragments have been accumulating with every pull request since
    v1.4.0. Replaced with a statement of the mechanism rather than a new
    unguarded count.
