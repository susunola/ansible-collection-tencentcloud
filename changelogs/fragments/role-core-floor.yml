---
bugfixes:
  - >-
    roles - declare the ansible-core floor the collection actually requires.
    Roles advertised ``min_ansible_version: "2.16"`` while
    ``meta/runtime.yml`` and every module in the collection require 2.19, so
    Galaxy offered the roles to a controller that cannot load them. They
    now state 2.19, which is the version whose argument-spec and
    validate-modules behaviour these roles are tested against.
    ``scripts/check_quality_gates.py`` now compares every role's
    ``min_ansible_version`` with ``meta/runtime.yml`` and its license with the
    collection license, which is the check that was missing when the roles
    drifted core versions behind.
