minor_changes:
  - elasticsearch_instance - new module to create, rename and destroy
    Elasticsearch clusters with the ``es.v20180416`` API. Creation uses
    ``CreateInstance`` with a ``NodeInfoList`` (Type=hotData) and waits
    for the cluster to reach Status 1; ``state=absent`` destroys the
    cluster with ``DeleteInstance`` and waits for it to disappear,
    bounded by ``waiter_timeout``.
  - network_interface - new module to create, update and delete VPC
    elastic network interfaces with the ``vpc.v20170312`` API. An
    interface is identified by ``network_interface_id`` or by
    ``name`` + ``subnet_id``; the name, description and bound security
    groups are reconciled on an existing interface with
    ``ModifyNetworkInterfaceAttribute``.
  - scf_alias - new module to manage SCF function aliases with the
    ``scf.v20180416`` API. An alias is identified by
    ``function_name`` + ``name``; the target ``function_version`` and
    ``description`` are enforced on an existing alias with
    ``UpdateAlias``.
  - scf_version - new module to publish and delete SCF function versions
    with the ``scf.v20180416`` API. Versions are published with
    ``PublishVersion``, listed with ``ListVersionByFunction`` and removed
    with ``DeleteFunctionVersion``; ``$LATEST`` and ``default`` are
    rejected as identities.
  - tcr_namespace - new module to create, update and delete TCR namespace
    resources with the ``tcr.v20190924`` API. A namespace is identified
    by ``registry_id`` + ``name``; public access, auto-scan and
    vulnerability prevention settings are enforced with
    ``ModifyNamespace``.
  - tke_node_pool - new module to create, update and delete TKE node
    pools with the ``tke.v20220501`` API. A pool is identified by
    ``cluster_id`` + ``name``; the autoscaling range, labels, taints and
    deletion protection are reconciled on an existing pool with
    ``ModifyClusterNodePool``; ``keep_instance`` controls whether
    instances survive deletion.
