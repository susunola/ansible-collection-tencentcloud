---
bugfixes:
  - >-
    tests - stop three test files from installing stub ``ansible`` modules into
    ``sys.modules`` at import time. Any harness-importing file collected later in
    the same pytest process died at collection ("No module named
    'ansible.module_utils.common'; 'ansible.module_utils' is not a package"), so
    the unit-test selection's result depended on filesystem order. The real
    ``ansible.module_utils.basic`` is used now.
