major_changes:
  - >-
    First stable release (1.0.0). The module and plugin API surface is now
    covered by semantic versioning: breaking changes will only land in
    future major releases.
breaking_changes:
  - >-
    susunola.tencentcloud now requires ansible-core 2.19 or newer
    (meta/runtime.yml requires_ansible >= 2.19.0). ansible-core 2.16,
    2.17 and 2.18 reached end-of-life (2025-07, 2025-11 and 2026-05) and
    are no longer tested. Controllers must run Python 3.11 or newer.
    Upgrade ansible-core before upgrading the collection.
