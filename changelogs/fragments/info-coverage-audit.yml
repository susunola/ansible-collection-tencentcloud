minor_changes:
  - "Add scripts/audit_info_coverage.py: audits that every write module has a readable query surface (matching _info module, curated KNOWN_COVERAGE mapping, or documented KNOWN_GAPS/KNOWN_NO_LIST_API entry) and is wired into CI with --check."
  - "Close the read side of eighteen write modules with new generated _info modules: network_interface_info, security_group_rule_info, tke_node_pool_info, scf_alias_info, scf_version_info, scf_trigger_info, clb_listener_info, clb_listener_target_info, clb_target_group_info, cam_policy_attachment_info, nat_gateway_dnat_rule_info, nat_gateway_snat_rule_info, tag_info, havip_info, network_acl_info, peering_connection_info, vpc_address_template_info, vpc_address_template_group_info, plus the ALB API (alb.v20251030) modules alb_load_balancer_info, alb_listener_info, alb_target_group_info and alb_target_group_targets_info."
  - "generate_info_modules.py - the list pagination mode now passes extra_params/ids/filters to build_request (previously rendered a broken build_request(models, 0, 0) call for any list spec with extra params), extra_params support elements and choices in the argument spec, and generated list-mode tests inject sample values for extra params."
