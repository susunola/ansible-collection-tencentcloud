minor_changes:
  - >-
    check_quality_gates - the census of hand-written modules no unit test
    references now reads import statements instead of searching the
    concatenated text of every test file. The old rule was satisfied by
    accident: any test that mentioned ``vpc`` -- as a fixture key, a sample
    value, part of ``vpc_id`` -- kept ``vpc_info``'s entry alive, so for a
    short module name it could not fail. It now recognises the three
    spellings the tests actually use: ``from ...plugins.modules import
    <name>``, ``import ...plugins.modules.<name>`` and
    ``importlib.import_module("...plugins.modules.<name>")``.
  - >-
    check_quality_gates - the three baselines that had no stock ceiling now
    have one, so none of them is a place where a hard failure can be frozen
    without limit. ``untested_modules``, ``private_harness`` and
    ``untested_main_path`` had been paid down to zero, which left their
    baseline files as the only thing that could hold debt -- and
    ``--write-baseline`` records whatever the census finds with nothing
    capping the total. With a ceiling of zero they are hard rules: a new
    finding has to be fixed rather than recorded, and re-opening one is a
    reviewed edit to the gate rather than a command.
  - >-
    check_quality_gates - new hard rule for hand-written ``_info`` modules that
    call the module-level ``sdk_call``, which does not retry. The 502 generated
    ones moved when the generator did and the 15 hand-written ones were
    migrated with them, so no module may reach for that call any more. The
    census separates it from ``TencentCloudModule.sdk_call``, which retries and
    records the call audit trail: the two share a suffix, so a text search for
    ``sdk_call`` counts both, and an earlier version of this census listed 38
    modules that already retry.
  - >-
    release_check - "ready to tag" is no longer printed when checks were left
    out with ``--ignore``. The line reported a release as verified on the
    strength of the checks that were skipped, which is the failure this guard
    exists to prevent, and ``--json`` now sets ``ready`` false and lists the
    ignored names so a consumer sees the same thing. A check that skips
    because the context does not apply (``tag-matches`` without ``--tag``) or
    is opt-in (``fragment-lint``) is unaffected: the documented release path
    accounts for both.
  - >-
    check_quality_gates - removed ``integration_gates()``, which no caller,
    test or workflow referenced. Its output was reproducible from
    ``_gated_targets()`` and the target files, and it had drifted from them.
