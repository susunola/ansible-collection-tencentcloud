---
minor_changes:
  - >-
    module docs - write every ``RETURN`` entry in block style. The
    documentation normalisation pass only rewrote ``DOCUMENTATION.options``,
    so hundreds of modules still described their return values as single-line
    flow mappings such as ``- id: {description: ..., returned: always, type:
    str}``. Those entries are now laid out the same way as the option blocks
    above them. An empty flow mapping is left alone rather than expanded:
    ``options: {}`` and ``default: {}`` are already the shortest readable
    form, and rewriting them as a key followed by a line holding ``{}`` is
    longer without being clearer.
