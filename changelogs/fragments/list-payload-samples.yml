---
minor_changes:
  - >-
    scripts - teach the sample writer the module whose payload is the list
    itself. It matched a captured payload to a documented key by name, which a
    bare list cannot satisfy; when exactly one documented entry is still
    unsampled there is nothing to guess, so the list becomes that entry's
    sample. The census of modules whose RETURN carries no sample falls from 3
    to 2.
  - >-
    docs - say why the last two modules keep no sample. Their payloads contain a
    single value whose YAML rendering cannot fit the 150-character line budget
    without altering the value (folding a JSON string inserts spaces into it),
    so they are a reasoned floor rather than a gap: raising the budget is what
    would make the number smaller, and that is a documentation rule, not a
    defect count.
