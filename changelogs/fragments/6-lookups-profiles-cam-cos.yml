major_changes:
  - authentication - support TCCLI-style credential profiles in
    ``~/.tencentcloud/default.configure`` with a new ``profile`` option
    (env fallback ``TENCENTCLOUD_PROFILE``); precedence is module parameter
    > environment variable > profile file, and ``region`` is no longer
    hard-required when a profile supplies it.
  - lookup - add the ``sts_caller_identity`` lookup returning the caller's
    Uin/AccountId/Arn, with optional AssumeRole.
  - lookup - add the ``ssm_parameter`` lookup reading secrets from Tencent
    Cloud Secrets Manager (``GetSecretValue``).
minor_changes:
  - cos_bucket - add an idempotent module managing COS buckets (ACL,
    versioning, native COS tagging) via the qcloud_cos SDK; the first module
    family outside the API 3.0 surface.
  - cos_bucket_info - add a read-only module describing one COS bucket or
    listing all buckets in a region.
  - cam_user - add an idempotent module managing CAM sub-users (console
    login, remark, tags).
  - cam_role - add an idempotent module managing CAM roles with trust policy
    documents and native role tags.
  - cam_policy - add an idempotent module managing CAM custom policies with
    semantic JSON policy comparison.
  - cam_role_info - add a read-only module querying CAM roles.
  - cam_policy_info - add a read-only module querying CAM policies.
  - meta - register all new modules in the ``tencentcloud.cloud.all`` action
    group and add an (empty) ``plugin_routing`` section documenting the
    deprecation process.
  - ci - the release workflow now folds changelog fragments with
    ``antsibull-changelog release`` and commits the rendered changelog back
    to main before building the tarball.
  - governance - add MAINTAINERS.md, SECURITY.md, issue templates and a PR
    template, following the Ansible community package requirements.
