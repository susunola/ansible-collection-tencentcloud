---
minor_changes:
  - >-
    scripts/check_quality_gates.py - read the roles from the documentation
    side. A role's README may name only variables the role offers: its
    ``defaults/main.yml`` inputs plus whatever it publishes with
    ``set_fact``/``register`` (documented as ``tc_<role>_result``). A README
    that names anything else documents a variable a user cannot set and will
    not receive, which is how five roles once lost their ``region`` input --
    they read it behind ``default(omit)`` and it never appeared in the
    interface. All 68 roles pass, and both directions were verified by
    mutation: inventing a variable in a README, and renaming a default without
    touching the README, each fail the census.
