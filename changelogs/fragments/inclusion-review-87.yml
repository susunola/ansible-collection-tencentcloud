minor_changes:
  - >-
    community - reviewed ansible-inclusion #87 (openvswitch.openvswitch), the
    first review of another collection from this project (P2-01 / G2-a). The
    target was picked because its MUST FIX list is mechanically checkable and
    because it had sat unanswered for four weeks since the steering committee
    checklist of 2026-08-19, which is the same "nobody answers" failure this
    project's own roadmap treats as structural.
  - >-
    community - the review re-measures every MUST FIX item against
    openvswitch.openvswitch main (3b979e2, 2026-09-10, tag 2.2.2) rather than
    restating the checklist: attributes: absent from all four modules;
    option-level version_added missing on 38 of 38 options, not only the two the
    checklist named; openvswitch_bond still declaring 1.0.0 when changelog 1.1.0
    added it; semantic markup O(/V(/C(/M( counting zero across all four
    DOCUMENTATION blocks; state: read still present in choices, examples, RETURN
