---
minor_changes:
  - nat_gateway_rule - new module that reconciles the DNAT and SNAT rule
    sets of a NAT gateway. The desired rules are compared against the
    rules currently configured on the gateway, the missing delta is
    created and, when ``purge=true`` (the default), the surplus is
    deleted. A DNAT rule is identified by protocol, public IP, public
    port, private IP and private port; a SNAT rule by resource type,
    resource ID and private IP, so changing the public IPs or the
    description of an existing rule replaces it (delete and re-create).
    Supports check mode and diff output.
