  1.0.0:
    changes:
      breaking_changes:
      - susunola.tencentcloud now requires ansible-core 2.19 or newer (meta/runtime.yml
        requires_ansible >= 2.19.0). ansible-core 2.16, 2.17 and 2.18 reached end-of-life
        (2025-07, 2025-11 and 2026-05) and are no longer tested. Controllers must
        run Python 3.11 or newer. Upgrade ansible-core before upgrading the collection.
      bugfixes:
      - cvm_disaster_recover_group - drop the ``strategy`` and ``partition_count``
        options; the CVM placement-group API declares neither on ``CreateDisasterRecoverGroupRequest``
        nor on the ``DisasterRecoverGroup`` response, so both values were silently
        discarded and could never converge.
