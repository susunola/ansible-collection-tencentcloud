  1.3.0:
    changes:
      minor_changes:
      - 'tc_inventory - entries that share a resource id are folded into a single
        host by default (``dedupe``, default ``true``). The overlap is real: a TKE
        worker node is also a CVM instance and both sources report the same ``i-xxxx``.
        Merging unions ``tc_sources``, merges list fields and keeps the first configured
        source''s value for scalars, so a host reported by several products joins
        every matching ``tc_<source>`` group instead of appearing twice.'
      - tc_inventory - every host carries the same standardised variable set regardless
        of the product it came from (``tc_source``, ``tc_sources``, ``tc_region``,
        ``tc_id``, ``tc_name``, ``tc_state``, ``tc_private_ip``, ``tc_public_ip``,
        ``tc_zone``, ``tc_tags``, ``tc_role``, ``tc_parent_id``, ``tc_parent_name``),
        so ``keyed_groups`` and ``compose`` do not need a per-product branch. Fields
        a product has no concept of are ``null`` rather than absent, and the raw API
        fields are kept alongside, so nothing is lost.
      - tc_inventory - new inventory plugin that builds one inventory from several
        Tencent Cloud products at once, with CVM, TKE (cluster nodes), Lighthouse
        and VPC as the first batch. The per-product inventory plugins remain available
        and stay the right choice when a playbook targets a single product; this one
        is for inventorying an estate, where one source file, one credential block
        and one cache entry should cover compute and network together. Lighthouse
        and VPC had no inventory plugin before this.
      - tc_inventory - the cache key covers the query configuration (``sources``,
        ``regions``, ``filters``, ``dedupe``) in addition to the source file path.
        The inherited ``Cacheable.get_cache_key`` hashes the plugin name and path
        only, so editing ``regions`` or ``filters`` would otherwise serve a stale
        inventory until the cache expired.
    fragments:
    - tc-inventory-plugin.yml
    plugins:
      inventory:
      - description: Unified Tencent Cloud asset inventory across CVM, TKE, Lighthouse
          and VPC
        name: tc_inventory
        namespace: null
    release_date: '2026-09-13'
  1.4.0:
    changes:
      minor_changes:
      - module_utils.cos - new ``build_cos_client(region, secret_id, secret_key, ...)``
        helper that builds a ``CosS3Client`` without an ``AnsibleModule``, for controller-side
        callers such as the inventory plugin; ``create_cos_client(module)`` now delegates
        to it, so the two entry points cannot drift apart. Missing SDK raises the
        typed ``CosSDKMissing`` error.
      - module_utils.cos - new ``list_bucket_entries(client, region)`` helper returning
        the raw bucket entries of ``list_buckets``. ``list_buckets`` projects three
        fields for ``cos_bucket_info`` and keeps doing so; callers that want the rest
        of the entry (``Type``, ``BucketType``, ``AZType``) read it here.
      - tc_inventory - CLB and CDB report their run state as an integer; it is now
        mapped to the same vocabulary the other sources use (``CREATING``, ``RUNNING``,
        ``ISOLATING``, ``ISOLATED``) and passed through unchanged when the API grows
        a value this plugin does not know yet, instead of leaving ``keyed_groups``
        to group on a bare number.
      - tc_inventory - CLB and CDB spell their tags ``TagKey``/``TagValue`` where
        CVM, Lighthouse, VPC and CBS spell them ``Key``/``Value``. Both dialects are
        read now, so ``tc_tags`` is populated for every source rather than being empty
        for half of them.
      - 'tc_inventory - second batch of sources: ``clb`` (CLB load balancers), ``cdb``
        (CDB MySQL instances), ``cbs`` (CBS disks) and ``cos`` (COS buckets), alongside
        the existing ``cvm``, ``tke``, ``lighthouse`` and ``vpc``. CBS and CDB had
        no inventory plugin before this. Every source keeps the same standardised
        ``tc_*`` variable set, so grouping and ``compose`` expressions still do not
        need a per-product branch.'
      - 'tc_inventory - the ``cos`` source is the first one that is not an API 3.0
        product: it uses its own client builder and collector and therefore needs
        the ``cos-python-sdk-v5`` distribution on the controller in addition to ``tencentcloud-sdk-python``.
        It ignores ``filters`` because the COS service call is region-scoped, so narrowing
