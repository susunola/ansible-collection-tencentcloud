        entry names a file that does not exist, and the committed total dropped from
        1869 to 1557 after the dangling entries were removed.
      - 'scripts/release_check.py is a pre-release guard: it reports whether the version
        in galaxy.yml is publishable before a tag is pushed, checking the version
        format, that it is ahead of the newest released tag, that the tag is free
        locally and on origin, that there are changelog fragments to fold, that the
        version is not already in changelog.yaml, and that the tree is clean. --dry-run
        additionally builds the tarball in a temporary directory, checks MANIFEST.json
        against galaxy.yml, asserts nothing from build_ignore leaked in, installs
        it and lists its documentation, then prints what pushing the tag would do.
        docs/release.md is the runbook.'
      - scripts/triage_sla.py measures that SLA from the GitHub API and prints one
        row per item with its age, response time, and one of four statuses (OK, LATE,
        WAITING, BREACH). Only BREACH -- unanswered and overdue -- fails --check,
        because it is the only one that is still actionable; a late answer is history,
        and failing on it would leave CI red on an item nobody can clear except by
        closing it. --exclude-author drops items a maintainer opened, which can never
        receive a first response.
      - solution roles - add ``tc_alb_application_entry`` for ALB instances, target
        groups, exact backend sets and listeners with automatic forwarding, exact-name
        adoption and dependency-ordered teardown.
      - solution roles - add ``tc_api_gateway_platform`` for service adoption, APIs,
        releases, keys, usage plans and both binding types with secret-safe, dependency-aware
        teardown.
      - solution roles - add ``tc_autoscaling_group`` for exact-name adoption and
        child-first management of Auto Scaling groups, scaling policies and scheduled
        capacity actions, with a zero-capacity safe default.
      - solution roles - add ``tc_block_storage`` for exact-name CBS disk adoption,
        attachment, snapshots, sharing, backup points and automatic snapshot policies
        with dependency-safe teardown.
      - solution roles - add ``tc_cmq_messaging`` for CMQ queues, topics and HTTP
        or queue subscriptions with endpoint-safe teardown ordering.
      - solution roles - add ``tc_cynosdb_cluster`` for cloud-native database clusters,
        accounts, exact privilege sets and automatic backups with exact-name adoption
        and two-stage isolation and purge semantics.
      - solution roles - add ``tc_dns_zone`` for child-first management of DNSPod
        domains, custom routing lines, line groups and DNS records.
      - solution roles - add ``tc_edgeone_application`` covering EdgeOne delivery,
        DNS and all managed web-security policy modules with exact-name zone adoption
        and dependency-safe teardown.
      - solution roles - add ``tc_eventbridge_router`` for exact-name event-bus adoption
        and child-first orchestration of source connections, routing rules and delivery
        targets.
      - solution roles - add ``tc_kafka_platform`` for CKafka instances, access routes,
        users, topics, ACL grants and ACL rules with exact-name adoption, deletion-protection
        handling and child-first teardown.
      - solution roles - add ``tc_lighthouse_stack`` for exact-name instance adoption,
        SSH keys, firewall rules, data disks and snapshots with child-first teardown
        and explicit isolation semantics.
      - solution roles - add ``tc_mariadb_stack`` for MariaDB instances, accounts,
        scoped privilege sets and automatic backups with exact-name adoption and explicit
        two-stage isolation and purge semantics.
      - solution roles - add ``tc_mongodb_stack`` for MongoDB instances, exact account
        roles, explicit password rotation and automatic backup policy, including exact-name
        adoption and credential-aware child-first teardown.
      - solution roles - add ``tc_mqtt_broker`` for MQTT instances, network access,
        topics, users and ordered authorization policies with exact-name adoption
        and dependency-ordered teardown.
      - solution roles - add ``tc_object_storage_baseline`` for secure COS bucket
        composition across encryption, lifecycle, access, logging, replication and
        irreversible retention features, with configuration-first safe teardown.
      - solution roles - add ``tc_postgresql_stack`` for PostgreSQL instances, accounts,
        backup plans and reusable parameter templates with exact-name adoption and
        explicit two-stage isolation and purge semantics.
      - solution roles - add ``tc_prometheus_platform`` for exact-name Managed Prometheus
        adoption, cluster agents, scrape jobs, rules, alerts, notifications and Grafana
        bindings with dependency-safe teardown.
      - solution roles - add ``tc_rabbitmq_platform`` for exact-name dedicated instance
        adoption, users, virtual hosts, permissions and bindings with secret-safe
        tasks and deletion-protection-aware teardown.
      - solution roles - add ``tc_rabbitmq_serverless`` for managing users, virtual
        hosts, permissions, exchanges, queues and bindings inside an explicitly supplied
        existing Serverless instance.
      - solution roles - add ``tc_redis_stack`` for Redis instances, application accounts,
        explicit password rotation, automatic backups and reusable parameter templates,
        including exact-name adoption and child-first teardown.
      - solution roles - add ``tc_rocketmq_platform`` for exact-name cluster adoption
        and child-first orchestration of RocketMQ namespaces, roles, permissions,
        topics and consumer groups.
      - solution roles - add ``tc_shared_file_storage`` for CFS file systems, permission
        groups, exact client rules and automatic snapshot binding with name adoption
        and dependency-ordered teardown.
      - solution roles - add ``tc_waf_application`` covering every WAF write module
        with existing-instance ownership boundaries and dependency-safe teardown.
      - solution roles - resolve exact parent names through ``resource_id`` before
        validating and executing teardown for VPC, TKE, CDB, TCR, TEM and API Gateway
        compositions.
      - solution-role governance - add source contracts that enforce child-first teardown
        ordering for stateful and externally reachable resources.
      - 'tag_merge - new filter plugin that merges any number of Tencent Cloud tag
        sources into one ``{key: value}`` mapping. It is the collection''s first filter
        plugin, and it closes a gap no existing filter could: ``ansible.builtin.combine``
        only understands mappings, so combining the ``tags`` mapping a module parameter
        takes with the ``Key``/``Value`` list an ``*_info`` module returns had no
        expression. A source may be a tag mapping, a single ``Key``/``Value`` tag,
        a list of tags, a list of SDK ``Tag`` objects, or a nested list of any of
        those; later sources win, the result is sorted by key with string values (the
        same normalization the resource modules apply to ``tags``), and an unsupported
        source fails the task with the filter named instead of dropping tags silently.'
      - tc_serverless_application - bind API Gateway routes directly to the SCF function
        managed by the role.
      - 'tc_wait - new action plugin that waits for an existing Tencent Cloud resource
        to reach a state by polling one of the ``*_info`` modules. It is the collection''s
        first action plugin and the first plugin that can drive another module: a
        module cannot call a module, so "wait until this disk is attached" was previously
        inexpressible without ``until``/``retries`` against a raw API call. Options
        are ``module`` (the ``*_info`` module to poll, short name or FQCN), ``args``
        (its arguments), ``state`` (required; ``absent`` means "no longer listed"),
        plus optional ``state_field``, ``list_field``, ``delay`` and ``timeout``.
        Waiting only reads, so the task never reports ``changed``; in check mode it
        observes once instead of polling.'
      - tcr_immutable_tag_rule - add module to create/delete a TCR immutable tag rule,
        idempotent on repository+tag pattern within a namespace (roadmap
      - tcr_webhook_trigger - add module to create/delete a TCR webhook trigger, idempotent
        on trigger name within a namespace (roadmap
      - tdcpg_cluster_info - new module that gathers TDSQL-C for PostgreSQL clusters
        via DescribeClusters (ClusterSet), closing the flagship write module's read-surface
        gap.
      - tests - the COS AppId unit tests no longer import the real ``tencentcloud``
        SDK. ``fetch_appid`` only needs a client class and a request object to hand
        to the module double, so the tests now stub ``tencentcloud.cam`` / ``tencentcloud.sts``
        in ``sys.modules`` and run in an SDK-free environment as well as an SDK-provided
        one.
      - tests/integration/smoke_readonly.yml is a manual, credential-gated, read-only
        smoke test that proves the full runtime chain against the real Tencent Cloud
        API (credential resolution, SDK client, signed request, live response) without
        creating any resources. It lists VPCs and CVM instances only and is excluded
        from ansible-test automation because it needs live credentials.
      - tke_cls_log_config is a new idempotent TKE module that creates or deletes
        a CLS log collection configuration for a cluster. The configuration is the
        raw TKE log-config object, passed through as JSON to the API; idempotency
        is keyed on the configuration name within the cluster. It supports check mode.
      - tke_cluster, tke_node_pool and tke_cluster_upgrade - resolve through ``resolver.resolve_one``
        instead of hand-rolled first-match lookups. ``tke_cluster`` and ``tke_cluster_upgrade``
        took ``Clusters[0]`` for an ID lookup without re-checking it, which is the
        wrong thing to trust in front of a version upgrade; node pools have no server-side
        name filter, so every pool of the cluster is now listed and resolved client-side.
      - tke_cluster_deletion_protection is a new idempotent TKE module that enables
        or disables deletion protection on a cluster, preventing accidental cluster
        deletion through the console, CLI or API. It reads the current protection
        state first and is a no-op when the cluster is already in the desired state;
        it supports check mode.
      - tke_cluster_route is a new idempotent TKE module that creates or deletes a
        route (destination PodCIDR to next-hop gateway IP) inside a cluster route
        table. A route is uniquely identified within a table by its destination CIDR
        block. It supports check mode.
      - tke_cluster_route_table is a new idempotent TKE module that creates or deletes
        a cluster route table (usually named after the cluster ID). Route table CIDR
        and VPC are immutable once created, so an existing table with the same name
        is treated as present rather than reconciled. It supports check mode.
      - vpc, subnet, security_group, route_table, eip, nat_gateway and cvm_instance
        - resolve through ``resolver.resolve_one`` and report failures and deletes
        through ``lifecycle`` instead of hand-rolled first-match lookups.
      - 'vpn_gateway, vpn_connection, peering_connection, network_interface, network_acl,
        vpc_flow_log, nat_gateway_rule, customer_gateway, dc_direct_connect and dc_direct_connect_tunnel
        - resolve through ``resolver.resolve_one`` instead of hand-rolled first-match
        lookups. Each of these took ``XxxSet[0]`` after a substring name filter, so
        ``name: prod`` could manage ``prod-old``; the shared contract now applies
        to all of them (an exact name wins, a lone fuzzy candidate is accepted, two
        or more candidates fail with ``ambiguous=true`` and the candidate list), including
        the paginated lookups and the product-specific scopes (an ENI''s ``SubnetId``,
        a tunnel''s ``DirectConnectId``).'
