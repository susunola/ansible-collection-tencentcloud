  1.2.0:
    changes:
      bugfixes:
      - Align ``ssm_rotation`` begin-time documentation and frequency validation with
        the SSM API contract.
      - 'DOCUMENTATION - 65 modules documented an option with a comma inside an unquoted
        YAML flow mapping, for example ``{type: int, description: Maximum retained
        versions, from 1 to 24.}``. The comma is the flow separator, so ``from 1 to
        24.`` was parsed as a second option key and ``ansible-doc`` rendered it as
        a parameter (``max_reserved_models`` showed a ``from 1 to 24.: null`` line).
        115 option descriptions in 68 modules are now quoted, including the same mistake
        in five ``RETURN`` blocks. Two related defects were fixed in the same pass:
        ``no_log`` inside a ``DOCUMENTATION`` option (9 modules - it belongs in ``argument_spec``,
        not in the docs) and nested ``options:`` where the schema requires ``suboptions:``
        (3 modules).'
      - Make ``ssm_parameter`` genuinely idempotent for unchanged current values,
        apply creation tags, update descriptions through the supported API, and restore
        secrets pending deletion.
      - Paginate Oceanus job and workspace identity lookups to prevent duplicate creation
        in environments larger than one API page.
      - Route DLC Lab, JobSpec and Ray cluster priority changes through their dedicated
        priority APIs instead of generic update requests.
      - 'Sanity ignores - dropped 302 entries (100 in ignore-2.21.txt, 101 each in
        2.19 and 2.20) that named test files deleted during the P0-07/P0-09 unit test
        rewrites, plus 10 entries ansible-test reports as unnecessary. An ignore line
        naming a file that no longer exists is itself a failure of ansible-test''s
        ``ignores`` test, and 302 lines of "File ... does not exist" are easy to mistake
        for noise: they kept ``main`` red from 2026-09-09T16:27 until now. ``scripts/check_sanity_ignore.py``
        now also rejects any entry whose file is missing, so the next one fails as
        one obvious line instead of three hundred.'
      - Standardize Private DNS zone and record API failure payloads with the collection
        lifecycle contract.
      - Standardize ``tat_command`` API failures with the collection lifecycle error
        contract.
      - Stop online CDN domains and wait for offline state before deleting them.
      - 'Unit tests - fixed the 44 pylint ``repeated-keyword`` findings and 2 ``unnecessary-comprehension``
        findings that were also failing sanity. The ``repeated-keyword`` ones were
        a pylint false positive: ``dict(params(), page_size=0)`` is inferred as having
        ``page_size`` twice whenever the overridden key already exists in the base
        dict. The ``params()`` helpers now take overrides directly (``params(page_size=0)``),
        which reads better and does not trip the inference.'
      - Update ``dlc_table`` comments in place through ``AlterTableComment`` instead
        of requiring destructive table replacement.
      - Wait for Oceanus resources and immutable resource/job configuration versions
        to become visible or disappear before returning.
      - Wait for Oceanus workspace create, update and delete convergence and for job
        deletion before returning, preventing dependent-task races.
      - 'apigateway_ip_strategy - build the DescribeIPStrategysStatus filter with
        the field the SDK actually declares. The lookup set ``Filter.Key``, but the
        API Gateway ``Filter`` model only declares ``Name`` and ``Values``, so the
        attribute was silently dropped: the request went out unfiltered and the strategy
        was matched client-side only. It also set ``Limit`` and ``Offset``, which
        ``DescribeIPStrategysStatusRequest`` does not declare - the SDK serialized
        them into the unknown parameters ``Imit`` and ``Ffset`` and sent those to
        the API as well.'
      - cfs_file_system - match an existing file system on ``FsName`` instead of ``Name``.
        ``DescribeCfsFileSystems`` reports the display name as ``FsName``, so name-based
        lookups never matched and a rename was reported as drift on every run.
      - cfs_file_system - re-read the file system by the ID returned from ``CreateCfsFileSystem``
        so the created resource is reported back instead of ``None``.
      - 'cls_alarm - correct the documented alarm body so the example actually creates
        an alarm. The old payload used ``MonitorObjectType: log`` (the field is a
        ``uint64``: 0 = one shared monitor object, 1 = one per query), ``MonitorTime:
        {Type: Relative, TimeGap: 600}`` (``Type`` accepts only ``Period``, ``Fixed``
        or ``Cron`` and the period field is ``Time``, not ``TimeGap``), and omitted
        everything CLS requires - at least one of ``AlarmNoticeIds`` or ``MonitorNotice``,
        a ``LogsetId`` next to every ``TopicId``, and an ``EndTimeOffset`` greater
        than its ``StartTimeOffset``. The module forwards the body verbatim, so every
        one of these was rejected by the API rather than by Ansible; only a real-cloud
        run surfaced them. The option documentation now spells out the constraints.'
      - 'cos_bucket, cos_bucket_info - read CORS and lifecycle rules from the flat
        shape the SDK actually returns. A ``get_bucket_cors`` / ``get_bucket_lifecycle``
        GET answers a CORSRule / Rule list at the top level rather than nesting it
        under ``CORSConfiguration`` / ``LifecycleConfiguration``, so both sub-configurations
        always looked empty: the module reported a change on every run and never converged.'
      - cos_bucket, cos_bucket_info, cos_object, cos_object_info, cos_object_sync
        - resolve ``secret_id``/``secret_key`` from the TCCLI profile in ``~/.tencentcloud/default.configure``
        when no parameter or ``TENCENTCLOUD_*`` variable supplies them, and resolve
        ``region`` the same way. The COS client previously only looked at parameters
        and the environment, so every ``cos_*`` module failed with ``Set secret_id
        and secret_key`` under ``ansible-test integration``, which strips the environment.
      - cos_bucket, cos_bucket_info, cos_object, cos_object_info, cos_object_sync
        - resolve the COS AppId through CAM ``GetUserAppId`` instead of treating the
        STS ``GetCallerIdentity`` ``AccountId`` as the AppId. On accounts where the
        UIN and the AppId differ the bucket was addressed under a name the account
        does not own and every COS call answered ``AccessDenied``.
      - dlc_ray_job_list_info - the module description referenced ``O(fetched_count)``,
        which is a return value and not an option, so the docsite build failed on
        an unresolved cross-reference. It is now ``RV(fetched_count)``.
      - 'galaxy.yml now excludes generated, gitignored output from the collection
        build: docs/docsite/build, docs/docsite/rst/collections, .pytest_cache, .ruff_cache,
        .ansible, .coverage and the coverage reports. ansible-galaxy reads build_ignore
        but not .gitignore, so building on a machine that had built the docsite shipped
        roughly 250 MB of Sphinx HTML (36.6 MB and nine minutes instead of 1.9 MB
        and three), and packaging the tool caches made the tarball''s own FILES.json
        checksums disagree with its contents, which ansible-galaxy collection install
        rejects. CI never saw either problem because CI builds from a clean checkout.'
      - playbooks/three_tier_web.yml declares web_instance_password, which it passed
        to cvm_instance without ever defining; a copy of the playbook failed with
        "The task includes an option with an undefined variable". docs/examples/05_module_mix.yml
        prints sg.security_group.SecurityGroupId instead of a top-level sg.security_group_id
        the security_group module does not return.
      - postgresql_instance - align long-running waiter defaults with documentation
        and correct inline documentation parsing.
      - 'private_dns integration target - use a domain the API actually accepts. The
        target created ``ansible-<random>.internal``, but a single-label ``.internal``
        zone is refused outright with ``InvalidParameter.IllegalDomainTld``. The target
        had therefore never once completed, which is how the defect survived: it self-skipped
        on its gate variable for as long as that was unset. It now uses the ``<label>.example.com``
        shape the module already documents.'
      - private_dns_zone - recognise ``InvalidParameter.ZoneNotExists`` as "already
        gone". Private DNS reports a missing zone as an ``InvalidParameter`` rather
        than a ``ResourceNotFound``, so ``state=absent`` failed its own post-delete
        confirmation instead of treating the successful delete as success. The code
        was added to the shared ``is_not_found`` classification, so every module benefits,
        not just this one.
      - 'redis_replication_group - document a remark that the API actually accepts.
        The example used ``remark: Primary HA group for app cache``, but CreateReplicationGroup
        validates the remark with the instance-name rule and rejects any space with
        ``InvalidParameterValue.InstanceNameRuleError: Illegal character of replication
        group remark``. The integration target carried the same defect (``CI integration
        test``), so the real-cloud run failed on the very first create.'
      - 'redis_replication_group integration target - stop failing on an account that
        is not whitelisted for replication groups. CreateReplicationGroup answers
        ``UnauthorizedOperation.NoCAMAuthed: user not in replication group whitelist``
        even for a freshly created, running Redis instance, which is an account capability
        gap rather than a regression. The target now recognises that code, explains
        it and skips the lifecycle, while any other create error still fails the run.'
      - solution roles - require explicit parent IDs before deleting declared child
        resources in the VPC, TKE, CDB and observability roles.
      - tag - stop treating tag-query authorization, throttling or service errors
        as an empty remote tag set before a write operation.
      - tc_serverless_application - unrelease and remove managed API Gateway APIs
        and their service during teardown instead of leaving externally reachable
        resources behind.
      - 'tc_wait - ansible-core 2.21.3 moved action failures onto ``UnifiedTaskResult``
        and now passes the ``result`` dict of an ``AnsibleActionFail`` through untouched,
        where 2.21.2 and earlier merged the message into it as ``msg``. Every failure
        the plugin raised therefore surfaced as an empty payload: the task still failed,
        but the operator lost the reason and the timeout payload lost ``attempts``,
        ``waited``, ``observed_states`` and ``last_result`` along with it. The plugin
        now puts ``failed`` and ``msg`` into the result it passes, which is version-independent,
        and a regression test asserts the payload rather than the exception type.
        One test that covers the ``Invalid options`` failure raised by ``ActionBase.run``
        (not by this plugin) accepts either spelling, since the plugin cannot influence
        a failure it does not raise.'
      - tc_web_stack and tc_disaster_recovery now publish tc_web_stack_result and
        tc_disaster_recovery_result as facts. docs/examples/02_web_stack.yml, 03_tke_cluster.yml
        and 04_disaster_recovery.yml all end by printing a role result; two of the
        three roles never set one, so the last task of those examples printed "VARIABLE
        IS NOT DEFINED!".
      - tc_web_stack, tc_tke_cluster, tc_disaster_recovery, tc_clb_http and tc_launch
        declare their region variable in defaults/main.yml and read it with default(omit,
        true), matching the other 43 roles. They read an undeclared tc_<role>_region,
        which worked by accident (default(omit) tolerates undefined) but left a variable
        every example sets out of the role's documented interface.
      - 'tcr_webhook_trigger - stop requiring NamespaceName to match when looking
        up an existing trigger. DescribeWebhookTrigger returns NamespaceName as null
        and only populates NamespaceId, so the comparison never matched: the module
        decided the trigger was absent and a second ``state: present`` run called
        CreateWebhookTrigger again, which the API rejects with "notification policy
        named ... already exists". The lookup is already scoped to the namespace by
        the request, so it now only rejects a trigger whose namespace is present AND
        different.'
      - waf_custom_white_rule - mark ``bypass_modules`` as explicitly non-secret so
        Ansible validation does not reject the public module-name list.
