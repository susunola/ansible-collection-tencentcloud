        credential scrubbing.
      - Add organization member access policy lifecycle management.
      - Add organization member creation, update, node movement and deletion lifecycle.
      - Add physical Direct Connect and secret-safe Direct Connect tunnel lifecycle
        management.
      - Add prepaid and postpaid CKafka instance lifecycle with runtime controls and
        prepaid capacity changes.
      - Add prepaid and postpaid DCDB instance lifecycle with shard expansion and
        specification upgrades.
      - Add prepaid and postpaid MariaDB instance lifecycle with deployment and specification
        changes.
      - Add reusable VPC address templates and exact address-template group membership.
      - Add scheduled TAT invoker lifecycle with secret-safe parameter comparison
        and enablement control.
      - Add secret-safe CKafka Datahub elastic topic lifecycle management.
      - Add secret-safe TDMQ RocketMQ role lifecycle management.
      - Add standard TDMQ RocketMQ cluster lifecycle management with secret-safe output.
      - Reconcile mutable CDN origin, service, project and acceleration-area configuration
        on existing domains.
      - Reformat the generated module and contract-test sources so every file satisfies
        the ``pep8`` sanity test, clearing 5660 ``E701``/``E702``/``E703`` and 1367
        ``E501`` violations that had been failing CI on every push.
      - cos_bucket - new event_source plugin for Event-Driven Ansible that polls a
        COS bucket's object listing and yields each new or changed object as an event,
        the polling equivalent of a bucket event notification (prefix filter, optional
        max_objects cap, baseline first poll).
      - eks_cluster - new module to manage Tencent Cloud EKS clusters (create/update/delete,
        idempotent by name).
      - eks_container_instance - new module to manage Tencent Cloud EKS container
        instances (create/update/delete, idempotent by name).
      - generate_info_modules.py - extend the generator to scaffold resource (write)
        modules from a curated RESOURCE_SPECS table. ``--resource <module>`` introspects
        the SDK request models named in the spec and renders the module boilerplate
        (argument spec, request builders, identify/find helpers, check-mode run_module
        with a drift TODO) into plugins/modules/<module>.py. Scaffolding is write-once
        - existing module files are never overwritten - so scaffolded modules can
        be finished by hand and stay stable across generator runs. ``--resources --check``
        verifies every RESOURCE_SPECS entry against the installed SDK and reports
        missing scaffolds (wired into CI). scf_alias is the reference entry; new write
        modules add their own spec and scaffold from it.
      - 'tc_disaster_recovery - new role that prepares cross-region disaster recovery
        artifacts: a golden CVM image of a source instance in the primary region,
        COS bucket replication to the DR region, and an optional standby CLB pre-wired
        in the DR region as the failover entry point.'
      - tc_tke_cluster - new role that provisions a managed TKE cluster with node
        pools and addons in one call, reconciling the tc_tke_cluster_node_pools and
        tc_tke_cluster_addons lists idempotently and tearing down in reverse order
        (addons -> node pools -> cluster).
      - 'tc_web_stack - new role that provisions a complete Tencent Cloud web stack
        in one call: a CVM instance pool, a MySQL CDB instance and a Redis cache fronted
        by a CLB with an HTTP listener, automatically registering the created CVM
        instances as CLB backends (explicit target list or per-component enable flags
        supported, teardown in reverse order).'
      - tencentcloud_cos - new dynamic inventory plugin listing COS buckets (and optionally
        their objects) as hosts, keyed by bucket name, with region/prefix filters
        and constructed/cache support.
      - tencentcloud_tke - new dynamic inventory plugin exposing TKE cluster nodes
        as hosts (worker pool by default), walking clusters and node pools per region
        with cluster/node-pool host variables.
      - tke_cluster - new event_source plugin for Event-Driven Ansible that polls
        TKE cluster status via DescribeClusterStatus and yields cluster state-change
        events (with previous state and node counts) plus cluster-deleted events.
      - vod_class - new module to manage Tencent Cloud VOD media categories (create/delete,
        idempotent by name and parent).
      - vod_sub_app - new module to manage Tencent Cloud VOD sub-applications (create/update/delete,
        idempotent by name; delete uses the Destroyed status since no delete API exists).
