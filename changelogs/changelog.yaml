  0.8.0:
    changes:
      minor_changes:
      - coverage batches 3+4 - add 126 generated read-only ``_info`` modules, raising
        product coverage from 36 to 162 distinct Tencent Cloud services. New modules
        span compute and batch (batch, bm, bmlb, bmvpc, chc, ecm, thpc), storage and
        backup (bdrc, cetcd, cds, dbs, goosefs, keewidb, memcached, smh, vdb), databases
        and big data (cdwch, cdwdoris, cdwpg, ctsdb, dbbrain, dbdc, dcdb, dlc, emr,
        es-scale-out, oceanus, omics, tcaplusdb, tdcpg, tdmysql, wedata), networking
        and edge (antiddos, bmeip, dc, ecdn, fwm, ga2, gwlb, igtm, privatedns, teo),
        security and compliance (cfw, cloudhsm, config, csip, ctem, dasb, dsgc, securitylake,
        ssa, sslpod, yunjing), messaging and integration (cmq, eb, mqtt, tdmq, trabbit,
        trocket), AI and serverless (adp, ags, apis, asw, hai, lke, lowcode, tdai,
        tione, tokenhub), media and communication (ame, ccc, ic, iss, ivld, live,
        mps, ses, trtc, vcube, vod, wss, yinsuda), IoT and devices (iotcloud, iotexplorer,
        iotvideo, iotvideoindustry, trro), and management/finops (billing-adjacent
        tcb, controlcenter, domain, eiam, hasim, mall, msp, partners, pts, region,
        rum, svp, tourism).
      - 'scripts/discover_info_specs.py - new SDK-introspection tool that nominates
        ``_info`` generator specs automatically: it finds paginated Describe/List
        actions (Offset/Limit or PageNumber/PageSize) across all installed ``tencentcloud-sdk-python-<product>``
        packages, identifies ids and Filters model shapes, and writes ``scripts/info_specs_auto.py``.
        Products without a qualifying list API are reported in a skip report.'
      - scripts/generate_info_modules.py - the generator now merges auto-discovered
        specs from ``scripts/info_specs_auto.py`` and emits a matching generated unit
        test for each simple auto spec; curated specs keep their hand-written tests.
      - tests/contract - contract tests now cover the auto-discovered specs via the
        merged spec list (362 contracts checked).
