      - 'module_utils.polling - new ``poll_until`` helper: the bounded poll loop with
        the budget counted as the delays actually slept. It lives in ``module_utils``
        because both callers must reach it, and ``plugin_utils.polling`` re-exports
        it for the controller side. It is the first shared helper motivated by a controller-side
        consumer, and ``module_utils.waiters.wait_for_state`` now delegates to it
        while keeping its exact module-side failure payload (``expected_states``,
        ``last_state``, ``timeout``). ``wait_until_gone`` and ``wait_for_task`` keep
        their own terminal conditions and are unchanged.'
      - 'module_utils.tagging - new ``merge_tags`` helper implementing that merge
        on top of the existing ``normalize_tags`` / ``tags_from_sdk`` readers, so
        the filter and the resource modules cannot drift apart; the ``tag_merge``
        filter is a thin wrapper that only translates the helper''s ``TypeError``
        into an ``AnsibleFilterError``. It lives in ``module_utils`` even though the
        filter is its only consumer today, because tag reading and tag comparison
        are one body of semantics and because the layering rule is one-directional:
        a helper a module may later need has to be born in ``module_utils``. ``plugin_utils.tags``
        re-exports it for the controller side.'
