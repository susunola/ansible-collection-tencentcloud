        lcic_answer_info, captcha_captcha_user_all_app_id_info, mna_access_region_info.'
      - scripts/discover_info_specs.py - reuses existing auto specs verbatim so previously
        generated modules cannot drift, recognizes ``Get``/``Query``/``Search`` list
        actions, page-number aliases (``PageNo``/``PageNum``/``PageIndex``), token
        continuation without a size field, and penalizes candidates with unmanaged
        optional inputs.
      - 'scripts/generate_info_modules.py - new pagination modes: pagination without
        a total-count field (stop at the first short page), custom token field pairs
        (e.g. ``Cursor``/``NextCursor``, ``FileSystemIdMarker``/``NextFileSystemIdMarker``)
        with optional ``ListOver``/``IsOver``/``HasMore``/``HasNextPage`` flags, and
        ``list`` mode for unpaginated actions returning an items list.'
