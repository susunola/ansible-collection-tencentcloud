        string expected by ``ModifyInstancesDisasterRecoverGroupRequest`` instead
        of a ``DisasterRecoverGroupIds`` list, and drop the ``partition_number`` option
        that the API does not declare; binding requests previously carried no group
        at all.
      - postgresql_instance - declare ``waiter_delay`` and ``waiter_timeout`` in the
        argument spec so the documented 10 second and 900 second defaults are the
        ones actually applied, and quote the ``storage`` and ``auto_renew`` descriptions
        so their embedded commas no longer break the option documentation.
      - waf_custom_white_rule - mark ``bypass_modules`` as ``no_log=False``; it carries
        WAF module names, not a secret.
