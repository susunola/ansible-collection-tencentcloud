      - Add WAF protected-host and custom-rule lifecycle modules.
      - Add WAF sensitive-information leakage rule lifecycle with immutable URI protection.
      - Add ``cos_object_info`` to list and filter objects in a COS bucket, with prefix,
        marker and max_keys pagination.
      - Add ``cos_object_sync`` to mirror a local directory tree into a COS bucket
        prefix, uploading new or changed files via MD5/ETag comparison and optionally
        deleting extraneous remote objects.
      - Add ``cos_object`` for idempotent COS object upload, download and deletion,
        with ETag-based change detection, metadata and storage-class drift reconciliation,
        check mode and diff output.
      - Add ``cvm_image_share`` to manage CVM image sharing permissions. With ``state=present``
        it shares an image to the given account IDs via ``ModifyImageSharePermission``
        (Permission=SHARE); with ``state=absent`` it revokes sharing (Permission=CANCEL).
        Reads current shares with ``DescribeImageSharePermission``, deduplicates and
        sorts account IDs, supports check mode and diff.
      - Add ``cvm_instance_security_group`` to reconcile the set of security groups
        bound to a CVM instance. With ``state=present`` it binds missing groups and
        unbinds extra ones to converge on exactly the desired set; with ``state=absent``
        it unbinds the given groups. Uses ``AssociateSecurityGroups``/``DisassociateSecurityGroups``
        (one call per group), enforces the five-group platform limit, supports check
        mode and diff.
      - "Add ``sms_signature`` to manage Tencent Cloud SMS signatures (\u7B7E\u540D)
        via ``AddSmsSign``/``DeleteSmsSign``/``DescribeSmsSignList``. Signature applications
        are review-based: content fields are sent only at creation, and a signature
        whose review failed (status code -1) is treated as absent so re-running the
        task resubmits. Supports check mode and diff."
      - "Add ``sms_template`` to manage Tencent Cloud SMS templates (\u77ED\u4FE1\u6A21\u677F)
        via ``AddSmsTemplate``/``DeleteSmsTemplate``/``DescribeSmsTemplateList``.
        Template applications are review-based: content fields are sent only at creation,
        and a template whose review failed (status code -1) is treated as absent so
        re-running the task resubmits. Supports check mode and diff."
      - Add ``tke_cluster_autoscaler`` to reconcile the cluster-level autoscaler options
        of a TKE cluster via ``DescribeClusterAsGroupOption``/``ModifyClusterAsGroupOptionAttribute``.
        Only explicitly provided options are compared and written (scale-down toggles,
        expander algorithm, idle thresholds, unready-node guardrails); supports check
        mode and diff.
