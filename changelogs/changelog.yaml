        through ``plugin_utils.profile`` for controller-side callers. ``PROFILE_FILE``
        / ``DEFAULT_PROFILE_NAME`` are deliberately not re-exported: a re-exported
        constant is a separate binding, so rebinding it through the shim silently
        had no effect on the reader. Tests that redirect the profile file patch ``module_utils.client.PROFILE_FILE``.'
      - module_utils.paging - ``Paginator`` keeps its definition here, because ``scripts/generate_info_modules.py``
