namespace: susunola
name: tencentcloud
version: 1.4.0
readme: README.md
authors:
  - Tencent Cloud Ansible Collection Contributors (@susunola)
description: "A curated core set of Ansible modules for automating Tencent Cloud (QCloud) resources through Tencent Cloud API 3.0, covering identity (CAM), compute (CVM, Lighthouse), network (VPC, CLB, security groups), storage (COS, CBS), containers (TKE, TCR), databases (TencentDB, Redis), secrets (KMS, SSM) and auto scaling, with inventory, lookup and connection plugins and deployment roles."
license:
  - GPL-3.0-or-later
tags: [cloud, tencentcloud, infrastructure, security, networking, compute, cvm, vpc]
dependencies: {}
repository: https://github.com/susunola/ansible-collection-tencentcloud
documentation: https://github.com/susunola/ansible-collection-tencentcloud/tree/main/docs
homepage: https://github.com/susunola/ansible-collection-tencentcloud
issues: https://github.com/susunola/ansible-collection-tencentcloud/issues
build_ignore:
  - .github
  - .gitignore
  - .venv
  - tests
  # Generated by docs/docsite/build.sh and gitignored there, but
  # ansible-galaxy does not read .gitignore: without these two entries a
  # tarball built on a machine that has built the docsite ships ~250 MB of
  # Sphinx HTML. scripts/release_check.py --dry-run asserts the size.
  - docs/docsite/build
  # Internal working documents.  These are maintained in the repo but are
  # not user documentation: gap-closure plans, benchmark dashboards and a
  # Chinese-language retrospective.  Shipping them in the tarball put
  # non-English, non-user-facing material in every install.
  - docs/gap-closure.md
  - docs/internal-community-post.md
  - docs/panorama.html
  - docs/capability-map.html
  - docs/demo.html
  - docs/roadmap.md
  - docs/coverage-batching.md
  - docs/depth-cvm-vpc.md
  - docs/depth-recommendations.md
  - docs/docsite/rst/collections
  # Tool caches and coverage output. Same reason, and worse: these change
  # while tooling runs, so a build that packages them can produce a tarball
  # whose FILES.json checksums no longer match its own contents, which
  # ansible-galaxy install then rejects.
  - .pytest_cache
  - .ruff_cache
  - .ansible
  - .coverage
  - '.coverage.*'
  - coverage.xml
  - coverage-html
  - '*.retry'
  - '*.tar.gz'
  - '*.pyc'
  - __pycache__
