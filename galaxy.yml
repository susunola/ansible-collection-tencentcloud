namespace: susunola
name: tencentcloud
version: 1.1.0
readme: README.md
authors:
  - Tencent Cloud Ansible Collection Contributors (@susunola)
description: "Ansible modules and plugins for automating Tencent Cloud (QCloud) resources through Tencent Cloud API 3.0. 609 modules (resource modules plus _info facts modules) cover compute (CVM, Lighthouse, TKE), network (VPC, CLB, security groups), storage (COS, CBS), database (TencentDB, Redis, MongoDB), security and middleware services, with inventory, lookup and connection plugins and deployment roles."
license:
  - GPL-3.0-or-later
tags: [cloud, tencentcloud, infrastructure, security, networking, compute, cvm, vpc]
dependencies: {}
repository: https://github.com/susunola/ansible-collection-tencentcloud
documentation: https://github.com/susunola/ansible-collection-tencentcloud/tree/main/docs
homepage: https://github.com/susunola/ansible-collection-tencentcloud
issues: https://github.com/susunola/ansible-collection-tencentcloud/issues
build_ignore:
  - .github
  - .gitignore
  - .venv
  - tests
  - '*.tar.gz'
  - '*.pyc'
  - __pycache__
