---
- name: Fetch a TKE cluster kubeconfig
  hosts: localhost
  gather_facts: false
  vars:
    tke_cluster_id: cls-xxxxxxxx
    kubeconfig_path: "{{ playbook_dir }}/kubeconfig-{{ tke_cluster_id }}"
  tasks:
    - name: Write the intranet kubeconfig to a local file (0600)
      susunola.tencentcloud.tke_cluster_kubeconfig:
        region: "{{ tencentcloud_region | default('ap-guangzhou') }}"
        cluster_id: "{{ tke_cluster_id }}"
        dest: "{{ kubeconfig_path }}"

    - name: Show how to use the kubeconfig
      ansible.builtin.debug:
        msg: "export KUBECONFIG={{ kubeconfig_path }}"
