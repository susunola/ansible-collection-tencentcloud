---
- name: Query Tencent Cloud CVM instances
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Gather CVM instances
      tencentcloud.cloud.cvm_instance_info:
        region: "{{ tencentcloud_region | default('ap-guangzhou') }}"
      register: cvm_result
    - name: Show CVM instances
      ansible.builtin.debug:
        var: cvm_result.instances
